[tool.ruff]
line-length = 120
target-version = "py311"
src = ["libs/ocr_common", "services/orchestrator", "services/guardrails", "services/extraction", "services/structuring", "services/scoring"]
extend-exclude = ["services/*/app/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
section-order = ["future", "standard-library", "third-party", "ocr-common", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
"ocr-common" = ["ocr_common"]

[tool.ruff.lint.per-file-ignores]
"services/*/app/api/**" = ["B008", "B904"]
"services/*/app/dependencies.py" = ["B008"]
"libs/ocr_common/ocr_common/web/intake.py" = ["B008"]
"tools/tracker/backend/*.py" = ["B008"]

[tool.ty.environment]
extra-paths = [
    "libs/ocr_common",
]

# Pyrefly (language server di editor): cari import seperti ty di atas. Tiap service dan libs/ocr_common
# punya [tool.pyrefly] sendiri, jadi paket `app` selalu milik service tempat file itu berada.
[tool.pyrefly]
search-path = ["libs/ocr_common", "tools/tracker/backend"]
project-excludes = ["**/.venv/**", "**/node_modules/**", "**/__pycache__/**"]

[tool.pyrefly.errors]
# yaml / openpyxl ship no type stubs; the libraries work, only their types are unknown.
untyped-import = false
# str()/int() around data from JSON or FastAPI (Any at runtime) are deliberate.
unnecessary-type-conversion = false
