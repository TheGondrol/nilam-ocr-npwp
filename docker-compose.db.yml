# Overlay opsional: PostgreSQL lokal untuk repository SQL.
#
#   docker compose -f docker-compose.yml -f docker-compose.db.yml up -d --build
#   (atau: make docker-up-db)
#
# Pola sama dengan docker-compose.elk.yml di ocr-orchestration: overlay di atas
# compose utama, bukan file terpisah, supaya service utama ikut mendapat
# DATABASE_URL yang menunjuk ke container postgres ini. Di produksi dengan
# PostgreSQL terkelola, jangan pakai overlay ini; cukup isi DATABASE_URL di .env.
services:
  nilam-ocr-npwp:
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-bribrain_ocr_nilam}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: nilam-ocr-npwp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-bribrain_ocr_nilam}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Dijalankan otomatis hanya saat volume pertama kali diinisialisasi.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bribrain_ocr_nilam}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
