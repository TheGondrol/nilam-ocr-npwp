openapi: 3.1.0
info:
  title: OCR NPWP Guardrails API
  description: 'Entry point of the OCR NPWP pipeline. `POST /v1/extract-ocr` classifies every page of
    the document (image or PDF) as accepted / reject with the guardrails model, aggregates a document
    verdict, and when it passes hands the document to the OCR stage (ekstraksi), which chains to structuring
    and scoring. The orchestrator makes this one call: it waits up to `PIPELINE_WAIT_SECONDS` for the
    pipeline and answers 200 with the final result, or 202 while it is still running; the stage callbacks
    follow either way. The model runs in this process (`efficientnet`) or in the ML team''s model service
    (`remote`). All endpoints except /health require an X-API-Key header.


    ## Conventions (the same for every nilam-ocr service)


    **Authentication.** Every endpoint except `/health` and `/ready` requires the header `X-API-Key`.

    A missing or wrong key answers `401`. The services are reachable only from inside the cluster.


    **Envelope.** Every JSON response, success or error, has the same shape:

    `{status_code, status_desc, message, data, errors, request_id}`. `status_code` always equals the HTTP

    status. On success `errors` is null; on error `data` is null.


    **Errors.** `errors` is machine-readable: `VALIDATION_ERROR` for `422`, otherwise the same text as

    `message`. `400` = the request or the document is unusable (do not retry unchanged). `401` = API key.

    `404` = unknown request_id. `409` = request_id already processed (legacy contract only). `422` = a

    field is missing or has the wrong type. `500` = this service or its model failed. `503` = a

    dependency is unreachable, `504` = it did not answer in time (both are safe to retry).


    **request_id.** Minted by the orchestrator and carried through every stage. Where an endpoint has
    no

    request_id of its own, the `X-Request-ID` request header is used (and echoed in the response header);

    without it the service generates one.


    **Asynchronous stages.** `POST .../jobs` answers `202` immediately and does the work in the

    background. The outcome is reported by a callback to the orchestrator (see *Webhooks*), and can be

    read at any time with `GET .../jobs/{request_id}`. Submitting the same request_id again is idempotent:

    `202` with `duplicate: true`, the work is not repeated, unless the earlier attempt `FAILED` or has
    been

    `PROCESSING` for longer than the job lease (`PIPELINE_JOB_LEASE_SECONDS`, 5 minutes by default: the

    process running it died). A job still running when the service shuts down is reported `FAILED`. Because

    the request was already answered `202`, a problem with the document itself (unreadable file, no text,

    unsupported document type) shows up as a `FAILED` job and callback, not as a `4xx`.

    '
  version: 1.0.0
servers:
- url: /
  description: This host (where this page is served)
- url: http://guardrails.nilam-ocr-{environment}.svc.cluster.local:8031
  description: GKE, from another namespace (e.g. the orchestrator / gateway)
  variables:
    environment:
      enum:
      - dev
      - staging
      - production
      default: dev
      description: 'One namespace per environment: nilam-ocr-<environment>'
- url: http://guardrails:8031
  description: GKE from the same namespace, or the Docker Compose network
- url: http://127.0.0.1:8031
  description: Local development
paths:
  /health:
    get:
      tags:
      - Health
      summary: Liveness probe
      description: Says the process is alive and which implementations are active. Never touches a dependency.
        Does not require an API key.
      operationId: getHealth
      responses:
        '200':
          description: The process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: Healthy
                  value:
                    status: healthy
                    version: 1.0.0
                    device: cpu
                    backends:
                      guardrails: efficientnet
  /ready:
    get:
      tags:
      - Health
      summary: Readiness probe
      description: 'Liveness vs readiness: /health only says the process is alive and never touches a
        dependency (a database blip must not make Kubernetes restart every pod). /ready says whether this
        pod can do its job right now: 200 when every REQUIRED dependency of this service answers, 503
        otherwise, so the pod is taken out of the Service until it recovers. Downstream stages and model
        services are deliberately not checked: their outage is reported per job, not by refusing traffic.
        Does not require an API key.'
      operationId: getReadiness
      responses:
        '200':
          description: Every required dependency answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              examples:
                ready:
                  summary: Ready
                  value:
                    status: ready
                    checks: {}
        '503':
          description: A required dependency is unavailable; the pod is taken out of the Service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                status: not_ready
                checks: {}
  /v1/extract-ocr:
    post:
      tags:
      - Guardrails
      summary: Judge a document and, when it passes, start the pipeline
      description: "**The only call the orchestrator makes.** Runs the guardrails model on the document\
        \ synchronously, then:\n\n- **rejected** -> **200** with `data.passed: false` and `data.reason`;\
        \ `job`, `pipeline` and `result` are null. Nothing else runs and no callback follows; the orchestrator\
        \ answers the client 422 with `reason`.\n- **passed** -> sends the same document on to the OCR\
        \ stage (`POST /v1/ekstraksi/jobs` on the ekstraksi service; its answer is `data.job`), then waits\
        \ for OCR -> structuring -> scoring for up to `PIPELINE_WAIT_SECONDS` (15 by default), counted\
        \ from when this request arrived:\n  - finished in time -> **200**: `data.pipeline.status` is\
        \ `DONE` with the final result in `data.result` (identical to the `result` of the SCORING callback),\
        \ or `FAILED` with the failed `stage` and `error_message`;\n  - still running -> **202**: `data.pipeline.status`\
        \ is `PROCESSING`; the outcome follows in the stage callbacks, or read it with `GET /v1/scoring/jobs/{request_id}`.\n\
        \nThe `OCR`, `STRUCTURING` and `SCORING` callbacks are sent in every case, also when the result\
        \ is already in this response. The wait is counted from the request's arrival, so the answer normally\
        \ comes within `PIPELINE_WAIT_SECONDS`; give this call an HTTP timeout well above it (e.g. +15\
        \ s) to cover a slow guardrails check or hand-off.\n\nRuns the guardrails model on each page (a\
        \ PDF is rendered page by page; an image is one page) and aggregates a document verdict. The model\
        \ is either in this process (`efficientnet`) or the ML team's model service (`remote`, POST /v1/predict/json);\
        \ the response is the same either way.\n\nSend `request_id` plus the document as `file`, or as\
        \ `file_url` (downloaded here once, then forwarded as a file, so the URL only has to live for\
        \ this call); exactly one of the two.\n\n**Idempotency.** The same request_id again re-runs the\
        \ guardrails check, but the OCR stage answers `duplicate: true` and does not run twice unless\
        \ the earlier attempt `FAILED` or outlived the job lease (`PIPELINE_JOB_LEASE_SECONDS`). A request_id\
        \ that already finished answers 200 with its stored result."
      operationId: extractOcr
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_extractOcr'
        required: true
      responses:
        '200':
          description: 'A final answer: rejected, or accepted and the pipeline finished (DONE or FAILED)
            within the wait'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardrailCheckResponse'
              examples:
                done:
                  summary: 'Accepted and finished within the wait: `result` is the final result (same
                    as the SCORING callback)'
                  value:
                    status_code: 200
                    status_desc: OK
                    message: OK
                    data:
                      passed: true
                      document:
                        verdict: accepted
                        confidence: 0.9821
                        n_pages: 1
                        n_approve: 1
                        n_reject: 0
                      pages:
                      - page_index: 0
                        proba_approve: 0.9821
                        proba_reject: 0.0179
                        verdict: accepted
                      job:
                        request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                        stage: OCR
                        status: PROCESSING
                        duplicate: false
                      pipeline:
                        stage: SCORING
                        status: DONE
                      result:
                        document_type: npwp
                        fields:
                          nomor_npwp:
                            value: 12.345.678.9-012.345
                            confidence: 0.9762
                          nama:
                            value: BUDI SANTOSO
                            confidence: 0.9931
                          nama_badan:
                            confidence: 0.0
                        scoring:
                          npwp_confidence: 0.7296
                          name_confidence: 0.9471
                        guardrails:
                          passed: true
                          document:
                            verdict: accepted
                            confidence: 0.9821
                            n_pages: 1
                            n_approve: 1
                            n_reject: 0
                          pages:
                          - page_index: 0
                            proba_approve: 0.9821
                            proba_reject: 0.0179
                            verdict: accepted
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                failed:
                  summary: 'Accepted, but a stage failed within the wait: the request ends here, as with
                    a FAILED callback'
                  value:
                    status_code: 200
                    status_desc: OK
                    message: OK
                    data:
                      passed: true
                      document:
                        verdict: accepted
                        confidence: 0.9821
                        n_pages: 1
                        n_approve: 1
                        n_reject: 0
                      pages:
                      - page_index: 0
                        proba_approve: 0.9821
                        proba_reject: 0.0179
                        verdict: accepted
                      job:
                        request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                        stage: OCR
                        status: PROCESSING
                        duplicate: false
                      pipeline:
                        stage: OCR
                        status: FAILED
                        error_message: ekstraksi OCR model is unavailable
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                duplicate:
                  summary: 'Same request_id sent again after it finished: nothing runs twice, the stored
                    result is returned'
                  value:
                    status_code: 200
                    status_desc: OK
                    message: OK
                    data:
                      passed: true
                      document:
                        verdict: accepted
                        confidence: 0.9821
                        n_pages: 1
                        n_approve: 1
                        n_reject: 0
                      pages:
                      - page_index: 0
                        proba_approve: 0.9821
                        proba_reject: 0.0179
                        verdict: accepted
                      job:
                        request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                        stage: OCR
                        status: DONE
                        duplicate: true
                      pipeline:
                        stage: SCORING
                        status: DONE
                      result:
                        document_type: npwp
                        fields:
                          nomor_npwp:
                            value: 12.345.678.9-012.345
                            confidence: 0.9762
                          nama:
                            value: BUDI SANTOSO
                            confidence: 0.9931
                          nama_badan:
                            confidence: 0.0
                        scoring:
                          npwp_confidence: 0.7296
                          name_confidence: 0.9471
                        guardrails:
                          passed: true
                          document:
                            verdict: accepted
                            confidence: 0.9821
                            n_pages: 1
                            n_approve: 1
                            n_reject: 0
                          pages:
                          - page_index: 0
                            proba_approve: 0.9821
                            proba_reject: 0.0179
                            verdict: accepted
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                rejected:
                  summary: 'Rejected: nothing was started; answer the client with `reason`'
                  value:
                    status_code: 200
                    status_desc: OK
                    message: OK
                    data:
                      passed: false
                      reason: 'Document rejected by guardrails: 1/1 page(s) rejected (confidence 0.88)'
                      document:
                        verdict: reject
                        confidence: 0.8821
                        n_pages: 1
                        n_approve: 0
                        n_reject: 1
                      pages:
                      - page_index: 0
                        proba_approve: 0.1179
                        proba_reject: 0.8821
                        verdict: reject
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pdf_one_bad_page:
                  summary: 'PDF with one rejected page: the whole document is rejected (policy `all`)'
                  value:
                    status_code: 200
                    status_desc: OK
                    message: OK
                    data:
                      passed: false
                      reason: 'Document rejected by guardrails: 1/2 page(s) rejected (confidence 0.70)'
                      document:
                        verdict: reject
                        confidence: 0.7
                        n_pages: 2
                        n_approve: 1
                        n_reject: 1
                      pages:
                      - page_index: 0
                        proba_approve: 0.9821
                        proba_reject: 0.0179
                        verdict: accepted
                      - page_index: 1
                        proba_approve: 0.3
                        proba_reject: 0.7
                        verdict: reject
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
        '202':
          description: 'Accepted, but the pipeline was still running when the wait ran out: the outcome
            follows in the stage callbacks'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardrailCheckResponse'
              examples:
                processing:
                  summary: Still running after PIPELINE_WAIT_SECONDS
                  value:
                    status_code: 202
                    status_desc: Accepted
                    message: Accepted
                    data:
                      passed: true
                      document:
                        verdict: accepted
                        confidence: 0.9821
                        n_pages: 1
                        n_approve: 1
                        n_reject: 0
                      pages:
                      - page_index: 0
                        proba_approve: 0.9821
                        proba_reject: 0.0179
                        verdict: accepted
                      job:
                        request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                        stage: OCR
                        status: PROCESSING
                        duplicate: false
                      pipeline:
                        stage: STRUCTURING
                        status: PROCESSING
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                no_wait:
                  summary: 'Waiting disabled (PIPELINE_WAIT_SECONDS=0): answered right after the hand-off'
                  value:
                    status_code: 202
                    status_desc: Accepted
                    message: Accepted
                    data:
                      passed: true
                      document:
                        verdict: accepted
                        confidence: 0.9821
                        n_pages: 1
                        n_approve: 1
                        n_reject: 0
                      pages:
                      - page_index: 0
                        proba_approve: 0.9821
                        proba_reject: 0.0179
                        verdict: accepted
                      job:
                        request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                        stage: OCR
                        status: PROCESSING
                        duplicate: false
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
        '400':
          description: Bad file (empty, too large, unsupported type, unreadable), bad intake, or rejected
            by the OCR stage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 400
                status_desc: Bad Request
                message: Uploaded file is empty
                errors: Uploaded file is empty
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'body.request_id: Field required'
                errors: VALIDATION_ERROR
        '500':
          description: The guardrails model or the ekstraksi service failed or answered in an unexpected
            shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 500
                status_desc: Internal Server Error
                message: guardrails model returned an unexpected response
                errors: guardrails model returned an unexpected response
        '503':
          description: The ekstraksi service (or the remote guardrails model) is unreachable; nothing
            was started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 503
                status_desc: Service Unavailable
                message: ekstraksi service is unavailable
                errors: ekstraksi service is unavailable
        '504':
          description: The ekstraksi service (or the remote guardrails model) did not answer in time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 504
                status_desc: Gateway Timeout
                message: ekstraksi service timed out after 10.0s
                errors: ekstraksi service timed out after 10.0s
      security:
      - APIKeyHeader: []
components:
  schemas:
    Body_extractOcr:
      properties:
        request_id:
          type: string
          title: Request Id
          description: request_id minted by the orchestrator
          examples:
          - OCR_9cb01af2-493d-446d-b191-af120333f6d0
        document_type:
          type: string
          title: Document Type
          description: Document type chosen by the client. Only `npwp` is supported
          default: npwp
          examples:
          - npwp
        handoff:
          type: boolean
          title: Handoff
          description: 'false: judge only, start nothing, `job` stays null. Used by the legacy `extract-ocr`
            contract, which runs the stages itself; the orchestrator leaves it out'
          default: true
          examples:
          - true
        file:
          anyOf:
          - type: string
            format: binary
          - type: string
          - type: 'null'
          title: File
          description: Document image (JPEG/PNG/PDF). Omit when sending file_url.
        file_url:
          anyOf:
          - type: string
          - type: 'null'
          title: File Url
          description: URL this service fetches the document image from (e.g. a presigned MinIO GET).
            Omit when uploading file. The host must be listed in the service's `FILE_URL_ALLOWED_HOSTS`,
            or resolve to a public address when that is empty; redirects are not followed.
      type: object
      required:
      - request_id
      title: Body_extractOcr
    DocumentResult:
      properties:
        verdict:
          type: string
          enum:
          - accepted
          - reject
          title: Verdict
          description: 'Document verdict. Default policy `all`: accepted only when every page is accepted'
          examples:
          - accepted
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          description: Confidence in the verdict. accepted -> the lowest `proba_approve` over the pages
            (the weakest page decides); reject -> the highest `proba_reject` among the rejected pages
          examples:
          - 0.9821
        n_pages:
          type: integer
          minimum: 0.0
          title: N Pages
          description: Pages judged (a PDF is capped at 20)
          examples:
          - 2
        n_approve:
          type: integer
          minimum: 0.0
          title: N Approve
          description: Pages with verdict `accepted`
          examples:
          - 2
        n_reject:
          type: integer
          minimum: 0.0
          title: N Reject
          description: Pages with verdict `reject`
          examples:
          - 0
      type: object
      required:
      - verdict
      - confidence
      - n_pages
      - n_approve
      - n_reject
      title: DocumentResult
    ErrorResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          examples:
          - 400
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          examples:
          - Bad Request
        message:
          type: string
          title: Message
          description: Human-readable cause; safe to log
          examples:
          - Uploaded file is empty
        data:
          type: 'null'
          title: Data
          description: Always null on error
        errors:
          type: string
          title: Errors
          description: Machine-readable cause. `VALIDATION_ERROR` for 422 (branch on this, the message
            names a different field every time); for every other status it repeats `message`
          examples:
          - Uploaded file is empty
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: Present when the error is tied to a known request_id
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
      type: object
      required:
      - status_code
      - status_desc
      - message
      - errors
      title: ErrorResponse
    FieldConfidences:
      properties:
        npwp_confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Npwp Confidence
          description: P(the NPWP number is correct); null when no number was found
          examples:
          - 0.7296
        name_confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Name Confidence
          description: P(the name is correct); null when no name was found
          examples:
          - 0.9471
      type: object
      required:
      - npwp_confidence
      - name_confidence
      title: FieldConfidences
      description: 'Output of the ML team''s trust model: probability that each extracted field is correct.'
    FinalField:
      properties:
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
          description: null when the field was not found
          examples:
          - '3201234567890001'
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          description: OCR score of the line the value came from
          examples:
          - 0.9762
      type: object
      required:
      - confidence
      title: FinalField
    FinalResult:
      properties:
        document_type:
          type: string
          title: Document Type
          description: Document type the fields were read as
          examples:
          - npwp
        fields:
          additionalProperties:
            $ref: '#/components/schemas/FinalField'
          type: object
          title: Fields
          description: '`nomor_npwp`, `nama`, `nama_badan`. A 15-digit number is formatted `XX.XXX.XXX.X-XXX.XXX`;
            a 16-digit (NIK-based) number is 16 plain digits. A card printing both reports the 16-digit
            one'
          examples:
          - nama:
              confidence: 0.9931
              value: BUDI SANTOSO
            nama_badan:
              confidence: 0.0
            nomor_npwp:
              confidence: 0.9762
              value: '3201234567890001'
        scoring:
          $ref: '#/components/schemas/FieldConfidences'
          description: 'Per-field trust. There is NO document-level score and NO approve / reject decision:
            thresholds belong to the caller'
        guardrails:
          anyOf:
          - $ref: '#/components/schemas/GuardrailsResult'
          - type: 'null'
          description: The guardrails result that was submitted with the job, returned unchanged
      type: object
      required:
      - document_type
      - fields
      - scoring
      title: FinalResult
      description: What the pipeline produced for one request_id. Carried by the SCORING / DONE callback.
    GuardrailCheckResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          default: 200
          examples:
          - 200
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          default: OK
          examples:
          - OK
        message:
          type: string
          title: Message
          description: Human-readable outcome
          default: OK
          examples:
          - OK
        errors:
          type: 'null'
          title: Errors
          description: Always null on success
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: 'The request_id this response belongs to: the one sent in the form / body / path,
            otherwise the `X-Request-ID` header, otherwise one generated by the service'
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        data:
          $ref: '#/components/schemas/GuardrailJobReport'
      type: object
      required:
      - data
      title: GuardrailCheckResponse
    GuardrailJobReport:
      properties:
        passed:
          type: boolean
          title: Passed
          description: 'true: send the document on to the OCR stage. false: stop, and answer the client
            with `reason` (the sequence diagram uses 422 for this)'
          examples:
          - true
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Why the document was rejected; null when `passed`. The model is a binary classifier,
            so the reason can only state how many pages were rejected and how confidently, not *what*
            is wrong with them
          examples:
          - null
        document:
          $ref: '#/components/schemas/DocumentResult'
        pages:
          items:
            $ref: '#/components/schemas/PageResult'
          type: array
          title: Pages
          description: One entry per page, in page order
        job:
          anyOf:
          - $ref: '#/components/schemas/JobAccepted'
          - type: 'null'
          description: The OCR job this service started on the ekstraksi service when `passed`; null when
            rejected (nothing runs and no callback follows) or when `handoff` was false
        pipeline:
          anyOf:
          - $ref: '#/components/schemas/PipelineProgress'
          - type: 'null'
          description: Where the pipeline stood when this response was sent, after waiting up to `PIPELINE_WAIT_SECONDS`
            from the moment the request arrived. Null when rejected, when `handoff` was false, or when
            waiting is disabled (`PIPELINE_WAIT_SECONDS=0`)
        result:
          anyOf:
          - $ref: '#/components/schemas/FinalResult'
          - type: 'null'
          description: 'The final result when `pipeline.status` is `DONE`: identical to the `result` of
            the SCORING callback, which is still sent. Null otherwise'
      type: object
      required:
      - passed
      - document
      - pages
      title: GuardrailJobReport
    GuardrailsDocument:
      properties:
        verdict:
          anyOf:
          - type: string
            enum:
            - accepted
            - reject
          - type: 'null'
          title: Verdict
          description: Document verdict
          examples:
          - accepted
        confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Confidence
          description: 'Confidence in the verdict: accepted -> lowest `proba_approve` over the pages.
            Sent to the scoring model as `guardrail_probability`'
          examples:
          - 0.9821
        n_pages:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: N Pages
          description: Pages that were checked
          examples:
          - 1
        n_approve:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: N Approve
          description: Pages with verdict `accepted`
          examples:
          - 1
        n_reject:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: N Reject
          description: Pages with verdict `rejected`
          examples:
          - 0
      additionalProperties: true
      type: object
      title: GuardrailsDocument
    GuardrailsPage:
      properties:
        page_index:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Page Index
          description: 0-based page number
          examples:
          - 0
        proba_approve:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Proba Approve
          description: Probability that this page is an acceptable document
          examples:
          - 0.9821
        proba_reject:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Proba Reject
          description: 1 - `proba_approve`
          examples:
          - 0.0179
        verdict:
          anyOf:
          - type: string
            enum:
            - accepted
            - reject
          - type: 'null'
          title: Verdict
          description: Verdict for this page alone
          examples:
          - accepted
      additionalProperties: true
      type: object
      title: GuardrailsPage
    GuardrailsResult:
      properties:
        passed:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Passed
          description: 'true: the document may proceed to OCR'
          examples:
          - true
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Why it was rejected; null when passed
          examples:
          - null
        document:
          anyOf:
          - $ref: '#/components/schemas/GuardrailsDocument'
          - type: 'null'
          description: Verdict for the document as a whole
        pages:
          items:
            $ref: '#/components/schemas/GuardrailsPage'
          type: array
          title: Pages
          description: One entry per page, in page order
      additionalProperties: true
      type: object
      title: GuardrailsResult
      description: The guardrails report (`data` of the guardrails service's POST /v1/extract-ocr), forwarded
        unchanged down the pipeline.
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          description: Always `healthy` while the process is alive
          examples:
          - healthy
        version:
          type: string
          title: Version
          description: Service version
          examples:
          - 1.0.0
        device:
          type: string
          title: Device
          description: Where this service computes
          examples:
          - cpu
        backends:
          additionalProperties:
            type: string
          type: object
          title: Backends
          description: Active implementation per concern (model backend, storage). Useful to confirm a
            deployment
          examples:
          - ekstraksi: paddle
            storage: postgres
      type: object
      required:
      - status
      - version
      - device
      - backends
      title: HealthResponse
    JobAccepted:
      properties:
        request_id:
          type: string
          title: Request Id
          description: Echo of the submitted request_id
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        stage:
          type: string
          enum:
          - OCR
          - STRUCTURING
          - SCORING
          title: Stage
          description: Pipeline stage that accepted the job
          examples:
          - OCR
        status:
          type: string
          enum:
          - PROCESSING
          - DONE
          - FAILED
          title: Status
          description: '`PROCESSING` for a newly accepted job. When `duplicate` is true: the current status
            of the job that already exists for this request_id'
          examples:
          - PROCESSING
        duplicate:
          type: boolean
          title: Duplicate
          description: 'true: this request_id was already accepted before and the work is NOT run again
            (idempotent). Exception: a job whose status is `FAILED` is re-claimed and run again, and answers
            `duplicate: false`'
          default: false
          examples:
          - false
      type: object
      required:
      - request_id
      - stage
      - status
      title: JobAccepted
    PageResult:
      properties:
        page_index:
          type: integer
          minimum: 0.0
          title: Page Index
          description: 0-based page number; an image is always page 0
          examples:
          - 0
        proba_approve:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Proba Approve
          description: Model probability of `accepted`
          examples:
          - 0.9821
        proba_reject:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Proba Reject
          description: Model probability of `reject`; `proba_approve + proba_reject = 1`
          examples:
          - 0.0179
        verdict:
          type: string
          enum:
          - accepted
          - reject
          title: Verdict
          description: '`reject` when `proba_reject` reaches the reject threshold (0.5 by default)'
          examples:
          - accepted
      type: object
      required:
      - page_index
      - proba_approve
      - proba_reject
      - verdict
      title: PageResult
    PipelineProgress:
      properties:
        stage:
          type: string
          enum:
          - OCR
          - STRUCTURING
          - SCORING
          title: Stage
          description: 'The stage this is about: `SCORING` when the pipeline is `DONE`, the stage that
            failed when `FAILED`, or the stage still running when the wait ran out'
          examples:
          - SCORING
        status:
          type: string
          enum:
          - PROCESSING
          - DONE
          - FAILED
          title: Status
          description: '`DONE`: `result` holds the final result. `FAILED`: the pipeline stopped at `stage`.
            `PROCESSING`: still running when the wait ran out (HTTP 202); the outcome follows in the stage
            callbacks'
          examples:
          - DONE
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
          description: Why `stage` failed; null unless `status` is `FAILED`
          examples:
          - null
      type: object
      required:
      - stage
      - status
      title: PipelineProgress
    ReadyResponse:
      properties:
        status:
          type: string
          enum:
          - ready
          - not_ready
          title: Status
          description: '`ready` (HTTP 200) when every check is `ok`, else `not_ready` (HTTP 503)'
          examples:
          - ready
        checks:
          additionalProperties:
            type: string
            enum:
            - ok
            - failed
          type: object
          title: Checks
          description: One entry per REQUIRED dependency of this service; empty when it has none
          examples:
          - database: ok
      type: object
      required:
      - status
      - checks
      title: ReadyResponse
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: API key for this service
      in: header
      name: X-API-Key
tags:
- name: Guardrails
  description: 'Single entry point: guardrails check, then the OCR stage'
- name: Health
  description: Liveness and readiness probes; no API key
