openapi: 3.1.0
info:
  title: OCR NPWP Guardrails API
  description: 'Entry point of the OCR NPWP pipeline. `POST /v1/extract-ocr` classifies every page of
    the document (image or PDF) as accepted / reject with the guardrails model, aggregates a document
    verdict, and when it passes hands the document to the OCR stage (ekstraksi), which chains to structuring
    and scoring. The orchestrator makes this one call: it waits up to `PIPELINE_WAIT_SECONDS` for the
    pipeline and answers 200 with the final result, or 202 while it is still running; the stage callbacks
    follow either way. The model runs in this process (`efficientnet`) or in the ML team''s model service
    (`remote`). All endpoints except /health require an X-API-Key header.


    ## Conventions (the same for every nilam-ocr service)


    **Authentication.** Every endpoint except `/health` and `/ready` requires the header `X-API-Key`.

    A missing or wrong key answers `401`. The services are reachable only from inside the cluster.


    **Envelope.** Every JSON response, success or error, has the same shape:

    `{status_code, status_desc, message, data, errors, request_id}`. `status_code` always equals the HTTP

    status. On success `errors` is null; on error `data` is null.


    **Errors.** `errors` is machine-readable: `VALIDATION_ERROR` for `422`, otherwise the same text as

    `message`. `400` = the request or the document is unusable (do not retry unchanged). `401` = API key.

    `404` = unknown request_id. `409` = request_id already processed (legacy contract only). `422` = a

    field is missing or has the wrong type. `500` = this service or its model failed. `503` = a

    dependency is unreachable, `504` = it did not answer in time (both are safe to retry).


    **request_id.** Minted by the orchestrator and carried through every stage. Where an endpoint has
    no

    request_id of its own, the `X-Request-ID` request header is used (and echoed in the response header);

    without it the service generates one.


    **Asynchronous stages.** `POST .../jobs` answers `202` immediately and does the work in the

    background. The outcome is reported by a callback to the orchestrator (see *Webhooks*), and can be

    read at any time with `GET .../jobs/{request_id}`. Submitting the same request_id again is idempotent:

    `202` with `duplicate: true`, the work is not repeated, unless the earlier attempt `FAILED` or has
    been

    `PROCESSING` for longer than the job lease (`PIPELINE_JOB_LEASE_SECONDS`, 5 minutes by default: the

    process running it died). A job still running when the service shuts down is reported `FAILED`. Because

    the request was already answered `202`, a problem with the document itself (unreadable file, no text,

    unsupported document type) shows up as a `FAILED` job and callback, not as a `4xx`.

    '
  version: 1.0.0
servers:
- url: /
  description: This host (where this page is served)
- url: http://guardrails.nilam-ocr-{environment}.svc.cluster.local:8031
  description: GKE, from another namespace (e.g. the orchestrator / gateway)
  variables:
    environment:
      enum:
      - dev
      - staging
      - production
      default: dev
      description: 'One namespace per environment: nilam-ocr-<environment>'
- url: http://guardrails:8031
  description: GKE from the same namespace, or the Docker Compose network
- url: http://127.0.0.1:8031
  description: Local development
paths:
  /health:
    get:
      tags:
      - Health
      summary: Liveness probe
      description: Says the process is alive and which implementations are active. Never touches a dependency.
        Does not require an API key.
      operationId: getHealth
      responses:
        '200':
          description: The process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: Healthy
                  value:
                    status: healthy
                    version: 1.0.0
                    device: cpu
                    backends:
                      guardrails: efficientnet
  /ready:
    get:
      tags:
      - Health
      summary: Readiness probe
      description: 'Liveness vs readiness: /health only says the process is alive and never touches a
        dependency (a database blip must not make Kubernetes restart every pod). /ready says whether this
        pod can do its job right now: 200 when every REQUIRED dependency of this service answers, 503
        otherwise, so the pod is taken out of the Service until it recovers. Downstream stages and model
        services are deliberately not checked: their outage is reported per job, not by refusing traffic.
        Does not require an API key.'
      operationId: getReadiness
      responses:
        '200':
          description: Every required dependency answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              examples:
                ready:
                  summary: Ready
                  value:
                    status: ready
                    checks: {}
        '503':
          description: A required dependency is unavailable; the pod is taken out of the Service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                status: not_ready
                checks: {}
  /v1/extract-ocr:
    post:
      tags:
      - Guardrails
      summary: Judge a document, run the pipeline, answer with the OCR result or 202
      description: '**The only call the orchestrator makes.** Judges the document with the guardrails
        model, hands it to the OCR stage when it passes, then waits for OCR -> structuring -> scoring
        for up to `PIPELINE_WAIT_SECONDS` (15 s by default), counted from when this request arrived. The
        response follows the orchestrator''s `extract-ocr` contract:


        | Outcome | HTTP | `job_status` | `data` | `guardrails` | `errors` |

        |---|---|---|---|---|---|

        | Finished in time | 200 | `completed` | the fields | `1` | null |

        | Still running | 202 | `processing` | null | null | null |

        | Rejected by the guardrails model | 400 | `failed` | null | `0` | `DOWNSTREAM_VALIDATION_ERROR`
        |

        | A stage failed in time | 422 | `failed` | null | `1` | `OCR_FAILED`, `STRUCTURING_FAILED` or
        `SCORING_FAILED` |


        `data` holds `nomor_npwp` and `nama` as `{value, confidence}`; `nama` is the taxpayer''s name,
        or the registered name on a company''s card. `confidence` is `1` when the ML team''s trust model
        gives the value a probability of being correct of at least `FIELD_CONFIDENCE_THRESHOLD` (0.5 by
        default), else `0`. `params` is returned as sent.


        After a hand-off the `OCR`, `STRUCTURING` and `SCORING` callbacks are sent in every case; on 202
        the result arrives in the SCORING callback. Give this call an HTTP timeout well above `PIPELINE_WAIT_SECONDS`
        (e.g. +15 s) to cover a slow guardrails check or hand-off.


        Send `request_id` plus the document as `file`, or as `file_url` (downloaded here once, then forwarded
        as a file, so the URL only has to live for this call); exactly one of the two. The raw guardrails
        report (per-page probabilities) is not part of this response: it travels down the pipeline, comes
        back in the SCORING callback, and `POST /v1/guardrails/check` returns it on its own.


        **Idempotency.** The same request_id again re-runs the guardrails check, but the pipeline does
        not run twice unless the earlier attempt `FAILED` or outlived the job lease (`PIPELINE_JOB_LEASE_SECONDS`);
        a request_id that already finished answers 200 with its stored result.'
      operationId: extractOcr
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_extractOcr'
        required: true
      responses:
        '200':
          description: Accepted and finished within the wait
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              examples:
                completed:
                  summary: The OCR result
                  value:
                    status_code: 200
                    status_desc: OK
                    message: OCR extraction completed successfully
                    data:
                      nomor_npwp:
                        value: 12.345.678.9-012.345
                        confidence: 1
                      nama:
                        value: BUDI SANTOSO
                        confidence: 1
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                    document_type: npwp
                    guardrails: 1
        '202':
          description: 'Accepted, but still running when the wait ran out: the result follows in the SCORING
            callback'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              examples:
                processing:
                  summary: Still processing
                  value:
                    status_code: 202
                    status_desc: Accepted
                    message: OCR job accepted; still processing
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                    document_type: npwp
                    job_status: processing
        '400':
          description: 'Rejected by the guardrails model (`DOWNSTREAM_VALIDATION_ERROR`, `guardrails:
            0`), unsupported `document_type` (`UNSUPPORTED_DOCUMENT_TYPE`), or a bad file / intake (empty,
            too large, unsupported type, unreadable, `file_url` refused)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              example:
                status_code: 400
                status_desc: Bad Request
                message: 'Document rejected by guardrails: 1/1 page(s) rejected (confidence 0.88)'
                errors: DOWNSTREAM_VALIDATION_ERROR
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                document_type: npwp
                job_status: failed
                guardrails: 0
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
        '422':
          description: A pipeline stage failed within the wait (`OCR_FAILED`, `STRUCTURING_FAILED`, `SCORING_FAILED`;
            `message` says why), `params` is not valid JSON (`INVALID_PARAMS`), or a required field is
            missing (`VALIDATION_ERROR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: No text lines to structure
                errors: STRUCTURING_FAILED
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                document_type: npwp
                job_status: failed
                guardrails: 1
        '500':
          description: The guardrails model or the ekstraksi service failed or answered in an unexpected
            shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 500
                status_desc: Internal Server Error
                message: guardrails model returned an unexpected response
                errors: guardrails model returned an unexpected response
        '503':
          description: The ekstraksi service (or the remote guardrails model) is unreachable; nothing
            was started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 503
                status_desc: Service Unavailable
                message: ekstraksi service is unavailable
                errors: ekstraksi service is unavailable
        '504':
          description: The ekstraksi service (or the remote guardrails model) did not answer in time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 504
                status_desc: Gateway Timeout
                message: ekstraksi service timed out after 10.0s
                errors: ekstraksi service timed out after 10.0s
      security:
      - APIKeyHeader: []
  /v1/guardrails/check:
    post:
      tags:
      - Guardrails
      summary: Judge a document only (internal)
      description: 'Runs the guardrails model on each page (a PDF is rendered page by page; an image is
        one page) and aggregates a document verdict, **without** starting anything: no OCR job, no callback.
        The model is either in this process (`efficientnet`) or the ML team''s model service (`remote`,
        POST /v1/predict/json); the report is the same either way. Used by the legacy synchronous `extract-ocr`
        on the ekstraksi service, and for debugging. Always 200 when the document was judged: read `data.passed`.'
      operationId: checkDocument
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_checkDocument'
      responses:
        '200':
          description: The document was judged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardrailReportResponse'
              examples:
                accepted:
                  summary: Accepted
                  value:
                    status_code: 200
                    status_desc: OK
                    message: OK
                    data:
                      passed: true
                      document:
                        verdict: accepted
                        confidence: 0.9821
                        n_pages: 1
                        n_approve: 1
                        n_reject: 0
                      pages:
                      - page_index: 0
                        proba_approve: 0.9821
                        proba_reject: 0.0179
                        verdict: accepted
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                rejected:
                  summary: Rejected
                  value:
                    status_code: 200
                    status_desc: OK
                    message: OK
                    data:
                      passed: false
                      reason: 'Document rejected by guardrails: 1/1 page(s) rejected (confidence 0.88)'
                      document:
                        verdict: reject
                        confidence: 0.8821
                        n_pages: 1
                        n_approve: 0
                        n_reject: 1
                      pages:
                      - page_index: 0
                        proba_approve: 0.1179
                        proba_reject: 0.8821
                        verdict: reject
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
        '400':
          description: Bad file (empty, too large, unsupported type, unreadable) or bad intake
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 400
                status_desc: Bad Request
                message: Uploaded file is empty
                errors: Uploaded file is empty
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'body.file: Field required'
                errors: VALIDATION_ERROR
        '500':
          description: The guardrails model failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 500
                status_desc: Internal Server Error
                message: guardrails model returned an unexpected response
                errors: guardrails model returned an unexpected response
      security:
      - APIKeyHeader: []
components:
  schemas:
    Body_checkDocument:
      properties:
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: Echoed in the response; optional
          examples:
          - OCR_9cb01af2-493d-446d-b191-af120333f6d0
        file:
          anyOf:
          - type: string
            format: binary
          - type: string
          - type: 'null'
          title: File
          description: Document image (JPEG/PNG/PDF). Omit when sending file_url.
        file_url:
          anyOf:
          - type: string
          - type: 'null'
          title: File Url
          description: URL this service fetches the document image from (e.g. a presigned MinIO GET).
            Omit when uploading file. The host must be listed in the service's `FILE_URL_ALLOWED_HOSTS`,
            or resolve to a public address when that is empty; redirects are not followed.
      type: object
      title: Body_checkDocument
    Body_extractOcr:
      properties:
        request_id:
          type: string
          title: Request Id
          description: request_id minted by the orchestrator
          examples:
          - OCR_9cb01af2-493d-446d-b191-af120333f6d0
        document_type:
          type: string
          title: Document Type
          description: Document type chosen by the client. Only `npwp` is supported
          default: npwp
          examples:
          - npwp
        params:
          anyOf:
          - type: string
          - type: 'null'
          title: Params
          description: 'Client metadata as JSON: an object, or a quoted string. Not interpreted; returned
            unchanged in `params`'
          examples:
          - '{"nik": "3123456711950001", "refno": "PK19039Y8U"}'
        file:
          anyOf:
          - type: string
            format: binary
          - type: string
          - type: 'null'
          title: File
          description: Document image (JPEG/PNG/PDF). Omit when sending file_url.
        file_url:
          anyOf:
          - type: string
          - type: 'null'
          title: File Url
          description: URL this service fetches the document image from (e.g. a presigned MinIO GET).
            Omit when uploading file. The host must be listed in the service's `FILE_URL_ALLOWED_HOSTS`,
            or resolve to a public address when that is empty; redirects are not followed.
      type: object
      required:
      - request_id
      title: Body_extractOcr
    ContractField:
      properties:
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
          description: The value read; null when the field was not found
          examples:
          - 12.345.678.9-012.345
        confidence:
          type: integer
          enum:
          - 0
          - 1
          title: Confidence
          description: 1 when the ML team's trust model gives this value a probability of being correct
            of at least `FIELD_CONFIDENCE_THRESHOLD` (0.5 by default); 0 when it is lower, or when there
            is no value
          examples:
          - 1
      type: object
      required:
      - confidence
      title: ContractField
    DocumentResult:
      properties:
        verdict:
          type: string
          enum:
          - accepted
          - reject
          title: Verdict
          description: 'Document verdict. Default policy `all`: accepted only when every page is accepted'
          examples:
          - accepted
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          description: Confidence in the verdict. accepted -> the lowest `proba_approve` over the pages
            (the weakest page decides); reject -> the highest `proba_reject` among the rejected pages
          examples:
          - 0.9821
        n_pages:
          type: integer
          minimum: 0.0
          title: N Pages
          description: Pages judged (a PDF is capped at 20)
          examples:
          - 2
        n_approve:
          type: integer
          minimum: 0.0
          title: N Approve
          description: Pages with verdict `accepted`
          examples:
          - 2
        n_reject:
          type: integer
          minimum: 0.0
          title: N Reject
          description: Pages with verdict `reject`
          examples:
          - 0
      type: object
      required:
      - verdict
      - confidence
      - n_pages
      - n_approve
      - n_reject
      title: DocumentResult
    ErrorResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          examples:
          - 400
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          examples:
          - Bad Request
        message:
          type: string
          title: Message
          description: Human-readable cause; safe to log
          examples:
          - Uploaded file is empty
        data:
          type: 'null'
          title: Data
          description: Always null on error
        errors:
          type: string
          title: Errors
          description: Machine-readable cause. `VALIDATION_ERROR` for 422 (branch on this, the message
            names a different field every time); for every other status it repeats `message`
          examples:
          - Uploaded file is empty
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: Present when the error is tied to a known request_id
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
      type: object
      required:
      - status_code
      - status_desc
      - message
      - errors
      title: ErrorResponse
    ExtractOcrResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          examples:
          - 200
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          examples:
          - OK
        message:
          type: string
          title: Message
          description: Human-readable; its wording may change, so branch on `errors` instead
          examples:
          - OCR extraction completed successfully
        data:
          anyOf:
          - $ref: '#/components/schemas/NpwpData'
          - type: 'null'
          description: The OCR fields when `job_status` is `completed`; null otherwise
        errors:
          anyOf:
          - type: string
          - type: 'null'
          title: Errors
          description: Failure code when the request failed or was refused; null otherwise
          examples:
          - null
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: The request_id this response belongs to
        document_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Type
          description: Document type of the request
          examples:
          - npwp
        job_status:
          anyOf:
          - type: string
            enum:
            - pending
            - processing
            - completed
            - failed
          - type: 'null'
          title: Job Status
          description: '`completed` (200), `processing` (202), or `failed`; null when the request was
            refused before anything was processed'
          examples:
          - completed
        guardrails:
          anyOf:
          - type: integer
            enum:
            - 0
            - 1
          - type: 'null'
          title: Guardrails
          description: '1: the document passed the guardrails model; 0: it was rejected. Null on 202,
            and when the request was refused before the check'
          examples:
          - 1
        params:
          title: Params
          description: The `params` sent with this request, returned unchanged; null when not sent
          examples:
          - nik: '3123456711950001'
            refno: PK19039Y8U
      type: object
      required:
      - status_code
      - status_desc
      - message
      title: ExtractOcrResponse
    GuardrailReport:
      properties:
        passed:
          type: boolean
          title: Passed
          description: 'true: the document may go on to the OCR stage. false: stop, and answer the client
            with `reason`'
          examples:
          - true
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Why the document was rejected; null when `passed`. The model is a binary classifier,
            so the reason can only state how many pages were rejected and how confidently, not *what*
            is wrong with them
          examples:
          - null
        document:
          $ref: '#/components/schemas/DocumentResult'
        pages:
          items:
            $ref: '#/components/schemas/PageResult'
          type: array
          title: Pages
          description: One entry per page, in page order
      type: object
      required:
      - passed
      - document
      - pages
      title: GuardrailReport
    GuardrailReportResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          default: 200
          examples:
          - 200
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          default: OK
          examples:
          - OK
        message:
          type: string
          title: Message
          description: Human-readable outcome
          default: OK
          examples:
          - OK
        errors:
          type: 'null'
          title: Errors
          description: Always null on success
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: 'The request_id this response belongs to: the one sent in the form / body / path,
            otherwise the `X-Request-ID` header, otherwise one generated by the service'
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        data:
          $ref: '#/components/schemas/GuardrailReport'
      type: object
      required:
      - data
      title: GuardrailReportResponse
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          description: Always `healthy` while the process is alive
          examples:
          - healthy
        version:
          type: string
          title: Version
          description: Service version
          examples:
          - 1.0.0
        device:
          type: string
          title: Device
          description: Where this service computes
          examples:
          - cpu
        backends:
          additionalProperties:
            type: string
          type: object
          title: Backends
          description: Active implementation per concern (model backend, storage). Useful to confirm a
            deployment
          examples:
          - ekstraksi: paddle
            storage: postgres
      type: object
      required:
      - status
      - version
      - device
      - backends
      title: HealthResponse
    NpwpData:
      properties:
        nomor_npwp:
          $ref: '#/components/schemas/ContractField'
          description: 15-digit number as `XX.XXX.XXX.X-XXX.XXX`, or a 16-digit NIK-based number as 16
            plain digits
        nama:
          $ref: '#/components/schemas/ContractField'
          description: 'The name on the card: the taxpayer''s name, or the registered name on a company''s
            card'
      type: object
      required:
      - nomor_npwp
      - nama
      title: NpwpData
    PageResult:
      properties:
        page_index:
          type: integer
          minimum: 0.0
          title: Page Index
          description: 0-based page number; an image is always page 0
          examples:
          - 0
        proba_approve:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Proba Approve
          description: Model probability of `accepted`
          examples:
          - 0.9821
        proba_reject:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Proba Reject
          description: Model probability of `reject`; `proba_approve + proba_reject = 1`
          examples:
          - 0.0179
        verdict:
          type: string
          enum:
          - accepted
          - reject
          title: Verdict
          description: '`reject` when `proba_reject` reaches the reject threshold (0.5 by default)'
          examples:
          - accepted
      type: object
      required:
      - page_index
      - proba_approve
      - proba_reject
      - verdict
      title: PageResult
    ReadyResponse:
      properties:
        status:
          type: string
          enum:
          - ready
          - not_ready
          title: Status
          description: '`ready` (HTTP 200) when every check is `ok`, else `not_ready` (HTTP 503)'
          examples:
          - ready
        checks:
          additionalProperties:
            type: string
            enum:
            - ok
            - failed
          type: object
          title: Checks
          description: One entry per REQUIRED dependency of this service; empty when it has none
          examples:
          - database: ok
      type: object
      required:
      - status
      - checks
      title: ReadyResponse
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: API key for this service
      in: header
      name: X-API-Key
tags:
- name: Guardrails
  description: 'Single entry point: guardrails check, then the OCR stage'
- name: Health
  description: Liveness and readiness probes; no API key
