openapi: 3.1.0
info:
  title: OCR NPWP Guardrails API
  description: 'Entry point of the OCR NPWP pipeline. `POST /v1/extract-ocr` classifies every page of
    the document (image or PDF) as accepted / reject with the guardrails model, aggregates a document
    verdict, and when it passes hands the document to the OCR stage (ekstraksi), which chains to structuring
    and scoring. The orchestrator makes this one call and then receives the stage callbacks. The model
    runs in this process (`efficientnet`) or in the ML team''s model service (`remote`). All endpoints
    except /health require an X-API-Key header.


    ## Conventions (the same for every nilam-ocr service)


    **Authentication.** Every endpoint except `/health` and `/ready` requires the header `X-API-Key`.

    A missing or wrong key answers `401`. The services are reachable only from inside the cluster.


    **Envelope.** Every JSON response, success or error, has the same shape:

    `{status_code, status_desc, message, data, errors, request_id}`. `status_code` always equals the HTTP

    status. On success `errors` is null; on error `data` is null.


    **Errors.** `errors` is machine-readable: `VALIDATION_ERROR` for `422`, otherwise the same text as

    `message`. `400` = the request or the document is unusable (do not retry unchanged). `401` = API key.

    `404` = unknown request_id. `409` = request_id already processed (legacy contract only). `422` = a

    field is missing or has the wrong type. `500` = this service or its model failed. `503` = a

    dependency is unreachable, `504` = it did not answer in time (both are safe to retry).


    **request_id.** Minted by the orchestrator and carried through every stage. Where an endpoint has
    no

    request_id of its own, the `X-Request-ID` request header is used (and echoed in the response header);

    without it the service generates one.


    **Asynchronous stages.** `POST .../jobs` answers `202` immediately and does the work in the

    background. The outcome is reported by a callback to the orchestrator (see *Webhooks*), and can be

    read at any time with `GET .../jobs/{request_id}`. Submitting the same request_id again is idempotent:

    `202` with `duplicate: true`, the work is not repeated, unless the earlier attempt `FAILED`. Because

    the request was already answered `202`, a problem with the document itself (unreadable file, no text,

    unsupported document type) shows up as a `FAILED` job and callback, not as a `4xx`.

    '
  version: 1.0.0
servers:
- url: /
  description: This host (where this page is served)
- url: http://guardrails.nilam-ocr-{environment}.svc.cluster.local:8031
  description: GKE, from another namespace (e.g. the orchestrator / gateway)
  variables:
    environment:
      enum:
      - dev
      - staging
      - production
      default: dev
      description: 'One namespace per environment: nilam-ocr-<environment>'
- url: http://guardrails:8031
  description: GKE from the same namespace, or the Docker Compose network
- url: http://127.0.0.1:8031
  description: Local development
paths:
  /health:
    get:
      tags:
      - Health
      summary: Liveness probe
      description: Says the process is alive and which implementations are active. Never touches a dependency.
        Does not require an API key.
      operationId: getHealth
      responses:
        '200':
          description: The process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: Healthy
                  value:
                    status: healthy
                    version: 1.0.0
                    device: cpu
                    backends:
                      guardrails: efficientnet
  /ready:
    get:
      tags:
      - Health
      summary: Readiness probe
      description: 'Liveness vs readiness: /health only says the process is alive and never touches a
        dependency (a database blip must not make Kubernetes restart every pod). /ready says whether this
        pod can do its job right now: 200 when every REQUIRED dependency of this service answers, 503
        otherwise, so the pod is taken out of the Service until it recovers. Downstream stages and model
        services are deliberately not checked: their outage is reported per job, not by refusing traffic.
        Does not require an API key.'
      operationId: getReadiness
      responses:
        '200':
          description: Every required dependency answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              examples:
                ready:
                  summary: Ready
                  value:
                    status: ready
                    checks: {}
        '503':
          description: A required dependency is unavailable; the pod is taken out of the Service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                status: not_ready
                checks: {}
  /v1/extract-ocr:
    post:
      tags:
      - Guardrails
      summary: Judge a document and, when it passes, start the pipeline
      description: '**The only call the orchestrator makes.** Runs the guardrails model on the document
        synchronously, then:


        - **passed** -> sends the same document on to the OCR stage (`POST /v1/ekstraksi/jobs` on the
        ekstraksi service) and returns the report with `data.job`. OCR -> structuring -> scoring then
        run in the background and report through the `OCR`, `STRUCTURING` and `SCORING` stage callbacks;
        the final result is in the `SCORING` callback.

        - **rejected** -> returns the report with `data.passed: false`, `data.reason` and `data.job: null`.
        Nothing else runs and no callback follows; the orchestrator answers the client 422 with `reason`.


        Always 200 when the document was judged: read `data.passed`, not the HTTP code.


        Runs the guardrails model on each page (a PDF is rendered page by page; an image is one page)
        and aggregates a document verdict. The model is either in this process (`efficientnet`) or the
        ML team''s model service (`remote`, POST /v1/predict/json); the response is the same either way.


        Send `request_id` plus the document as `file`, or as `file_url` (downloaded here once, then forwarded
        as a file, so the URL only has to live for this call); exactly one of the two.


        **Idempotency.** The same request_id again re-runs the guardrails check, but the OCR stage answers
        `duplicate: true` and does not run twice unless the earlier attempt `FAILED`.'
      operationId: extractOcr
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_extractOcr'
        required: true
      responses:
        '200':
          description: 'The document was judged. Always 200, accepted or not: read `data.passed`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardrailCheckResponse'
              examples:
                accepted:
                  summary: 'Accepted: the OCR stage was started, `job` is its answer'
                  value:
                    status_code: 200
                    status_desc: OK
                    message: OK
                    data:
                      passed: true
                      document:
                        verdict: accepted
                        confidence: 0.9821
                        n_pages: 1
                        n_approve: 1
                        n_reject: 0
                      pages:
                      - page_index: 0
                        proba_approve: 0.9821
                        proba_reject: 0.0179
                        verdict: accepted
                      job:
                        request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                        stage: OCR
                        status: PROCESSING
                        duplicate: false
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                duplicate:
                  summary: 'Same request_id sent again: the OCR stage did not start a second run'
                  value:
                    status_code: 200
                    status_desc: OK
                    message: OK
                    data:
                      passed: true
                      document:
                        verdict: accepted
                        confidence: 0.9821
                        n_pages: 1
                        n_approve: 1
                        n_reject: 0
                      pages:
                      - page_index: 0
                        proba_approve: 0.9821
                        proba_reject: 0.0179
                        verdict: accepted
                      job:
                        request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                        stage: OCR
                        status: DONE
                        duplicate: true
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                rejected:
                  summary: 'Rejected: nothing was started; answer the client with `reason`'
                  value:
                    status_code: 200
                    status_desc: OK
                    message: OK
                    data:
                      passed: false
                      reason: 'Document rejected by guardrails: 1/1 page(s) rejected (confidence 0.88)'
                      document:
                        verdict: reject
                        confidence: 0.8821
                        n_pages: 1
                        n_approve: 0
                        n_reject: 1
                      pages:
                      - page_index: 0
                        proba_approve: 0.1179
                        proba_reject: 0.8821
                        verdict: reject
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pdf_one_bad_page:
                  summary: 'PDF with one rejected page: the whole document is rejected (policy `all`)'
                  value:
                    status_code: 200
                    status_desc: OK
                    message: OK
                    data:
                      passed: false
                      reason: 'Document rejected by guardrails: 1/2 page(s) rejected (confidence 0.70)'
                      document:
                        verdict: reject
                        confidence: 0.7
                        n_pages: 2
                        n_approve: 1
                        n_reject: 1
                      pages:
                      - page_index: 0
                        proba_approve: 0.9821
                        proba_reject: 0.0179
                        verdict: accepted
                      - page_index: 1
                        proba_approve: 0.3
                        proba_reject: 0.7
                        verdict: reject
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
        '400':
          description: Bad file (empty, too large, unsupported type, unreadable), bad intake, or rejected
            by the OCR stage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 400
                status_desc: Bad Request
                message: Uploaded file is empty
                errors: Uploaded file is empty
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'body.request_id: Field required'
                errors: VALIDATION_ERROR
        '500':
          description: The guardrails model or the ekstraksi service failed or answered in an unexpected
            shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 500
                status_desc: Internal Server Error
                message: guardrails model returned an unexpected response
                errors: guardrails model returned an unexpected response
        '503':
          description: The ekstraksi service (or the remote guardrails model) is unreachable; nothing
            was started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 503
                status_desc: Service Unavailable
                message: ekstraksi service is unavailable
                errors: ekstraksi service is unavailable
        '504':
          description: The ekstraksi service (or the remote guardrails model) did not answer in time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 504
                status_desc: Gateway Timeout
                message: ekstraksi service timed out after 10.0s
                errors: ekstraksi service timed out after 10.0s
      security:
      - APIKeyHeader: []
components:
  schemas:
    Body_extractOcr:
      properties:
        request_id:
          type: string
          title: Request Id
          description: request_id minted by the orchestrator
          examples:
          - OCR_9cb01af2-493d-446d-b191-af120333f6d0
        document_type:
          type: string
          title: Document Type
          description: Document type chosen by the client. Only `npwp` is supported
          default: npwp
          examples:
          - npwp
        handoff:
          type: boolean
          title: Handoff
          description: 'false: judge only, start nothing, `job` stays null. Used by the legacy `extract-ocr`
            contract, which runs the stages itself; the orchestrator leaves it out'
          default: true
          examples:
          - true
        file:
          anyOf:
          - type: string
            format: binary
          - type: string
          - type: 'null'
          title: File
          description: Document image (JPEG/PNG/PDF). Omit when sending file_url.
        file_url:
          anyOf:
          - type: string
          - type: 'null'
          title: File Url
          description: URL this service fetches the document image from (e.g. a presigned MinIO GET).
            Omit when uploading file.
      type: object
      required:
      - request_id
      title: Body_extractOcr
    DocumentResult:
      properties:
        verdict:
          type: string
          enum:
          - accepted
          - reject
          title: Verdict
          description: 'Document verdict. Default policy `all`: accepted only when every page is accepted'
          examples:
          - accepted
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          description: Confidence in the verdict. accepted -> the lowest `proba_approve` over the pages
            (the weakest page decides); reject -> the highest `proba_reject` among the rejected pages
          examples:
          - 0.9821
        n_pages:
          type: integer
          minimum: 0.0
          title: N Pages
          description: Pages judged (a PDF is capped at 20)
          examples:
          - 2
        n_approve:
          type: integer
          minimum: 0.0
          title: N Approve
          description: Pages with verdict `accepted`
          examples:
          - 2
        n_reject:
          type: integer
          minimum: 0.0
          title: N Reject
          description: Pages with verdict `reject`
          examples:
          - 0
      type: object
      required:
      - verdict
      - confidence
      - n_pages
      - n_approve
      - n_reject
      title: DocumentResult
    ErrorResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          examples:
          - 400
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          examples:
          - Bad Request
        message:
          type: string
          title: Message
          description: Human-readable cause; safe to log
          examples:
          - Uploaded file is empty
        data:
          type: 'null'
          title: Data
          description: Always null on error
        errors:
          type: string
          title: Errors
          description: Machine-readable cause. `VALIDATION_ERROR` for 422 (branch on this, the message
            names a different field every time); for every other status it repeats `message`
          examples:
          - Uploaded file is empty
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: Present when the error is tied to a known request_id
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
      type: object
      required:
      - status_code
      - status_desc
      - message
      - errors
      title: ErrorResponse
    GuardrailCheckResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          default: 200
          examples:
          - 200
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          default: OK
          examples:
          - OK
        message:
          type: string
          title: Message
          description: Human-readable outcome
          default: OK
          examples:
          - OK
        errors:
          type: 'null'
          title: Errors
          description: Always null on success
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: 'The request_id this response belongs to: the one sent in the form / body / path,
            otherwise the `X-Request-ID` header, otherwise one generated by the service'
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        data:
          $ref: '#/components/schemas/GuardrailJobReport'
      type: object
      required:
      - data
      title: GuardrailCheckResponse
    GuardrailJobReport:
      properties:
        passed:
          type: boolean
          title: Passed
          description: 'true: send the document on to the OCR stage. false: stop, and answer the client
            with `reason` (the sequence diagram uses 422 for this)'
          examples:
          - true
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Why the document was rejected; null when `passed`. The model is a binary classifier,
            so the reason can only state how many pages were rejected and how confidently, not *what*
            is wrong with them
          examples:
          - null
        document:
          $ref: '#/components/schemas/DocumentResult'
        pages:
          items:
            $ref: '#/components/schemas/PageResult'
          type: array
          title: Pages
          description: One entry per page, in page order
        job:
          anyOf:
          - $ref: '#/components/schemas/JobAccepted'
          - type: 'null'
          description: The OCR job this service started on the ekstraksi service when `passed`; null when
            rejected (nothing runs and no callback follows) or when `handoff` was false
      type: object
      required:
      - passed
      - document
      - pages
      title: GuardrailJobReport
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          description: Always `healthy` while the process is alive
          examples:
          - healthy
        version:
          type: string
          title: Version
          description: Service version
          examples:
          - 1.0.0
        device:
          type: string
          title: Device
          description: Where this service computes
          examples:
          - cpu
        backends:
          additionalProperties:
            type: string
          type: object
          title: Backends
          description: Active implementation per concern (model backend, storage). Useful to confirm a
            deployment
          examples:
          - ekstraksi: paddle
            storage: postgres
      type: object
      required:
      - status
      - version
      - device
      - backends
      title: HealthResponse
    JobAccepted:
      properties:
        request_id:
          type: string
          title: Request Id
          description: Echo of the submitted request_id
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        stage:
          type: string
          enum:
          - OCR
          - STRUCTURING
          - SCORING
          title: Stage
          description: Pipeline stage that accepted the job
          examples:
          - OCR
        status:
          type: string
          enum:
          - PROCESSING
          - DONE
          - FAILED
          title: Status
          description: '`PROCESSING` for a newly accepted job. When `duplicate` is true: the current status
            of the job that already exists for this request_id'
          examples:
          - PROCESSING
        duplicate:
          type: boolean
          title: Duplicate
          description: 'true: this request_id was already accepted before and the work is NOT run again
            (idempotent). Exception: a job whose status is `FAILED` is re-claimed and run again, and answers
            `duplicate: false`'
          default: false
          examples:
          - false
      type: object
      required:
      - request_id
      - stage
      - status
      title: JobAccepted
    PageResult:
      properties:
        page_index:
          type: integer
          minimum: 0.0
          title: Page Index
          description: 0-based page number; an image is always page 0
          examples:
          - 0
        proba_approve:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Proba Approve
          description: Model probability of `accepted`
          examples:
          - 0.9821
        proba_reject:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Proba Reject
          description: Model probability of `reject`; `proba_approve + proba_reject = 1`
          examples:
          - 0.0179
        verdict:
          type: string
          enum:
          - accepted
          - reject
          title: Verdict
          description: '`reject` when `proba_reject` reaches the reject threshold (0.5 by default)'
          examples:
          - accepted
      type: object
      required:
      - page_index
      - proba_approve
      - proba_reject
      - verdict
      title: PageResult
    ReadyResponse:
      properties:
        status:
          type: string
          enum:
          - ready
          - not_ready
          title: Status
          description: '`ready` (HTTP 200) when every check is `ok`, else `not_ready` (HTTP 503)'
          examples:
          - ready
        checks:
          additionalProperties:
            type: string
            enum:
            - ok
            - failed
          type: object
          title: Checks
          description: One entry per REQUIRED dependency of this service; empty when it has none
          examples:
          - database: ok
      type: object
      required:
      - status
      - checks
      title: ReadyResponse
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: API key for this service
      in: header
      name: X-API-Key
tags:
- name: Guardrails
  description: 'Single entry point: guardrails check, then the OCR stage'
- name: Health
  description: Liveness and readiness probes; no API key
