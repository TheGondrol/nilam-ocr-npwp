openapi: 3.1.0
info:
  title: OCR NPWP Scoring API
  description: 'Pipeline step 4 (last) for Indonesian NPWP documents: the ML team''s trust model gives
    each extracted field (nomor_npwp, nama) the probability that it is correct. **Async pipeline:** the
    structuring service POSTs /v1/scoring/jobs and gets 202; this service scores in the background, stores
    the result, and POSTs the stage callback carrying the final result to the orchestrator. /v1/scoring-direct
    scores a structuring result synchronously, for testing this stage alone; /v1/scoring/confidence runs
    the trust model alone on the ML team''s payload. All endpoints except /health require an X-API-Key
    header.


    ## Conventions (the same for every nilam-ocr service)


    **Authentication.** Every endpoint except `/health`, `/ready` and `/metrics` requires the header `X-API-Key`.

    A missing or wrong key answers `401`. The services are reachable only from inside the cluster.


    **Envelope.** Every JSON response, success or error, has the same shape:

    `{status_code, status_desc, message, data, errors, request_id}`. `status_code` always equals the HTTP

    status. On success `errors` is null; on error `data` is null.


    **Errors.** `errors` is a stable, machine-readable code; branch on it, not on the wording of `message`.

    The document checks: `EMPTY_FILE`, `UNSUPPORTED_FILE_TYPE`, `UNREADABLE_FILE`, `TOO_MANY_PAGES`,

    `INVALID_FILE_SOURCE`, `FILE_URL_REJECTED` (400), `FILE_TOO_LARGE` (413). Otherwise the code of the
    status:

    `UNAUTHORIZED` (401), `REQUEST_ID_NOT_FOUND` (404, an unknown request_id), `NOT_FOUND` (404, a path
    that does

    not exist), `METHOD_NOT_ALLOWED` (405), `VALIDATION_ERROR` (422), `INTERNAL_SERVER_ERROR` (500),

    `DOWNSTREAM_UNAVAILABLE` (503), `DOWNSTREAM_TIMEOUT` (504), unless an endpoint documents a more precise
    one.

    `400` = the request or the document is unusable (do not retry unchanged). `503` / `504` are safe to
    retry.


    **request_id.** Minted by the central orchestrator and carried through every stage. Where an endpoint
    has

    no request_id of its own, the `X-Request-ID` request header is used (and echoed in the response header);

    without it the service generates one.


    **Asynchronous stages** (internal: only the orchestrator NPWP and the previous stage call them). `POST

    .../jobs` answers `202` immediately and does the work in the background. The outcome is reported by
    a

    callback to the central orchestrator (see *Webhooks*), and can be read at any time with

    `GET .../jobs/{request_id}`, which the orchestrator NPWP''s `GET /v1/extract-ocr/{request_id}` combines

    over the three stages. Submitting the same request_id again is idempotent:

    `202` with `duplicate: true`, the work is not repeated, unless the earlier attempt `FAILED` or has
    been

    `PROCESSING` for longer than the job lease (`PIPELINE_JOB_LEASE_SECONDS`, 5 minutes by default: the

    process running it died). A job still running when the service shuts down is reported `FAILED`. Because

    the request was already answered `202`, a problem with the document itself (unreadable file, no text,

    unsupported document type) shows up as a `FAILED` job and callback, not as a `4xx`.

    '
  version: 1.0.0
servers:
- url: /
  description: This host (where this page is served)
- url: http://nilam-ocr-npwp-scoring.{namespace}.svc.cluster.local:8033
  description: GKE, from inside the release's namespace (the other services of this pipeline)
  variables:
    namespace:
      default: nilam-ocr-npwp
      description: 'Namespace of the Helm release (deploy/helm/deploy.sh: nilam-ocr-npwp)'
- url: http://scoring:8033
  description: The Docker Compose network
- url: http://127.0.0.1:8033
  description: Local development
paths:
  /health:
    get:
      tags:
      - Health
      summary: Health check, including the database
      description: 'Says whether the service can reach what it depends on: 200 `healthy` when every dependency
        it checks answers (the database, for a service that has one), 503 `unhealthy` with the cause in
        `detail` otherwise. Each check gives up after 3 s. Also lists the active implementations (`backends`).
        Not used by the Kubernetes probes: liveness and startup check the port, readiness is `/ready`.
        Does not require an API key.'
      operationId: getHealth
      responses:
        '200':
          description: Every dependency answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: Healthy
                  value:
                    status: healthy
                    version: 1.0.0
                    device: cpu
                    backends:
                      scoring: trust_model
                      storage: postgres
        '503':
          description: A dependency does not answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: unhealthy
                version: 1.0.0
                detail: database unreachable
                device: cpu
                backends:
                  scoring: trust_model
                  storage: postgres
  /ready:
    get:
      tags:
      - Health
      summary: Readiness probe
      description: 'The readiness probe. Liveness is checked on the port, never on a dependency (a database
        blip must not make Kubernetes restart every pod). /ready says whether this pod can do its job
        right now: 200 when every REQUIRED dependency of this service answers, 503 otherwise, so the pod
        is taken out of the Service until it recovers. Downstream stages and model services are deliberately
        not checked: their outage is reported per job, not by refusing traffic. Does not require an API
        key.'
      operationId: getReadiness
      responses:
        '200':
          description: Every required dependency answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              examples:
                ready:
                  summary: Ready
                  value:
                    status: ready
                    checks:
                      database: ok
        '503':
          description: A required dependency is unavailable; the pod is taken out of the Service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                status: not_ready
                checks:
                  database: failed
  /metrics:
    get:
      tags:
      - Health
      summary: Prometheus metrics
      description: 'Prometheus text exposition of this process: `http_requests_total` and `http_request_duration_seconds`
        per route template, and for the pipeline stages `pipeline_jobs_total` (by outcome), `pipeline_job_duration_seconds`,
        `pipeline_stale_jobs_reclaimed_total`, `pipeline_outbox_deliveries_total` and the outbox backlog
        gauges (`pipeline_outbox_pending`, `_retrying`, `_dead_letters`, `_oldest_pending_seconds`). Scraped
        inside the cluster; does not require an API key.'
      operationId: getMetrics
      responses:
        '200':
          description: Metrics in the Prometheus text format
          content:
            text/plain:
              schema:
                type: string
  /v1/scoring/jobs:
    post:
      tags:
      - Pipeline
      summary: Hand a structured document to the scoring stage (last)
      description: '**Step 4 of the pipeline, asynchronous, the last stage. Called by the structuring
        service, not by the orchestrator.**


        Records the job (`nilam_scoring_jobs`, idempotent per request_id), answers **202 immediately**,
        then in the background: builds the ML team''s scoring payload from the chained guardrails + OCR
        + structuring results, runs the trust model, stores the result (`nilam_scoring_results`), and
        POSTs the `SCORING` callback, which carries the **final result** of the request.


        The outcome is two per-field confidences. There is no document-level score and no approve / reject
        decision. Each confidence is also turned into `0`/`1` with the field''s `column_confidence_threshold`
        from the central orchestrator, else `FIELD_CONFIDENCE_THRESHOLD`, and stored with the result (`fields`,
        with the threshold used); the outcome row (`ORCHESTRATION_OUTCOME_TABLE`) carries the same values.'
      operationId: submitScoringJob
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoringJobRequest'
        required: true
      responses:
        '202':
          description: The job was accepted (or already existed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
              examples:
                accepted:
                  summary: New job
                  value:
                    status_code: 202
                    status_desc: Accepted
                    message: Accepted
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: SCORING
                      status: PROCESSING
                      duplicate: false
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                duplicate:
                  summary: 'Same request_id sent again: nothing is re-run'
                  value:
                    status_code: 202
                    status_desc: Accepted
                    message: Accepted
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: SCORING
                      status: DONE
                      duplicate: true
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: UNAUTHORIZED
                pipeline_last_stage: scoring
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'body.request_id: Field required'
                errors: VALIDATION_ERROR
                pipeline_last_stage: scoring
      security:
      - APIKeyHeader: []
  /v1/scoring/jobs/{request_id}:
    get:
      tags:
      - Pipeline
      summary: Status and result of the scoring stage
      description: 'Status of this stage only and, once `DONE`, the two confidences, the 0/1 decision
        per field with the threshold used (`fields`), and the exact payload that was scored. Internal:
        the orchestrator NPWP reads it (while it waits, and for its `GET /v1/extract-ocr/{request_id}`);
        the central orchestrator receives the final result in the callback. Also useful to audit a score.'
      operationId: getScoringJob
      security:
      - APIKeyHeader: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      responses:
        '200':
          description: The job exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoringJobStatusResponse'
              examples:
                done:
                  summary: Finished
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: SCORING
                      created_at: '2026-09-18T04:00:01+00:00'
                      status: DONE
                      result:
                        npwp_confidence: 0.9806
                        name_confidence: 0.9948
                        fields:
                          nomor_npwp:
                            value: 12.345.678.9-012.000
                            confidence: 1
                            threshold: 0.9
                          nama:
                            value: PT CONTOH INDONESIA
                            confidence: 1
                            threshold: 0.5
                        payload:
                          npwp: 12.345.678.9-012.000
                          npwp_score: 0.98
                          npwp_candidate_count: 1
                          name_base: PT CONTOH INDONESIA
                          name_score: 0.95
                          avg_doc_score: 0.91
                          min_doc_score: 0.62
                          flag: false
                          guardrail_probability: 0.98
                      updated_at: '2026-09-18T04:00:01+00:00'
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                failed:
                  summary: Failed
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: SCORING
                      created_at: '2026-09-18T04:00:01+00:00'
                      status: FAILED
                      error_message: 'Unsupported document_type: ktp. Supported: [''npwp'']'
                      updated_at: '2026-09-18T04:00:01+00:00'
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: UNAUTHORIZED
                pipeline_last_stage: scoring
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No scoring job for this request_id
          content:
            application/json:
              example:
                status_code: 404
                status_desc: Not Found
                message: 'No SCORING job found for request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0'
                errors: REQUEST_ID_NOT_FOUND
                request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: scoring
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'path.request_id: Field required'
                errors: VALIDATION_ERROR
                request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: scoring
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/scoring/outbox:
    get:
      tags:
      - Pipeline
      summary: Backlog of this stage's undelivered callbacks and hand-offs
      description: 'Operational view of the transactional outbox (`PIPELINE_OUTBOX`): how many callbacks
        and hand-offs of this stage are still to be delivered, how old the oldest one is, and how many
        were given up on (dead letters). No other service watches the `nilam_pipeline_outbox` table, so
        this is where a monitor should look; the relay also logs a warning when the backlog is older than
        `PIPELINE_OUTBOX_STALE_AFTER_SECONDS` or a dead letter is waiting.'
      operationId: getScoringOutboxStatus
      responses:
        '200':
          description: The backlog of this stage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxStatusResponse'
              examples:
                idle:
                  summary: Nothing waiting
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      enabled: true
                      stage: SCORING
                      pending: 0
                      retrying: 0
                      dead_letters: 0
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                backlog:
                  summary: The orchestrator has been down for a while
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      enabled: true
                      stage: SCORING
                      pending: 12
                      retrying: 12
                      oldest_pending_seconds: 754.3
                      dead_letters: 1
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                disabled:
                  summary: '`PIPELINE_OUTBOX` is off'
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      enabled: false
                      stage: SCORING
                      pending: 0
                      retrying: 0
                      dead_letters: 0
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: UNAUTHORIZED
                pipeline_last_stage: scoring
      security:
      - APIKeyHeader: []
  /v1/scoring/outbox/release:
    post:
      tags:
      - Pipeline
      summary: Send this stage's dead letters again
      description: 'Puts the dead letters of this stage back in the outbox queue, due immediately, so
        the relay delivers them again: use it after the receiver was fixed (for example the orchestrator''s
        callback contract, or a next stage that was answering 4xx). Optional query `request_id` limits
        it to one request. A message that fails again goes through the same retry and dead-letter rules.
        `409` when `PIPELINE_OUTBOX` is off on this service.'
      operationId: releaseScoringOutbox
      security:
      - APIKeyHeader: []
      parameters:
      - name: request_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
      responses:
        '200':
          description: Dead letters released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxReleaseResponse'
              examples:
                released:
                  summary: One request
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      stage: SCORING
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      released: 1
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                nothing:
                  summary: Nothing to release
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      stage: SCORING
                      released: 0
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: UNAUTHORIZED
                pipeline_last_stage: scoring
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The outbox is off on this service
          content:
            application/json:
              example:
                status_code: 409
                status_desc: Conflict
                message: 'PIPELINE_OUTBOX is off: there is no outbox to release'
                errors: CONFLICT
                pipeline_last_stage: scoring
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'query.request_id: Input should be a valid string'
                errors: VALIDATION_ERROR
                pipeline_last_stage: scoring
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/scoring-direct:
    post:
      tags:
      - Direct
      summary: Score a structured document now, synchronous (no job, no callback)
      description: '**For testing one stage on its own (QC).** Takes the output of the previous stages,
        the structuring result (`data` of `POST /v1/structuring-direct`, or the `result` of a structuring
        job) and, like the pipeline, the OCR result and the guardrails report it depends on, builds the
        ML team''s scoring payload from them, runs the trust model, and answers with the scoring result
        in the body. Nothing is recorded: no `nilam_scoring_jobs` row, no callback, no outcome row, so
        it never touches the orchestrator''s data.


        The answer is exactly what `GET /v1/scoring/jobs/{request_id}` reports as `result`: the two probabilities,
        the 0/1 decision per field with the threshold used (`column_confidence_threshold` of the request,
        else `FIELD_CONFIDENCE_THRESHOLD`), and the exact payload that was scored. `ocr` left out gives
        null document scores, `guardrails` left out gives a null guardrails probability; the model''s
        imputer fills both.'
      operationId: scoreDirect
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoringDirectRequest'
        required: true
      responses:
        '200':
          description: The structured document was scored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoringDirectResponse'
              examples:
                scored:
                  summary: Both fields present
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      npwp_confidence: 0.9806
                      name_confidence: 0.9948
                      fields:
                        nomor_npwp:
                          value: 12.345.678.9-012.000
                          confidence: 1
                          threshold: 0.9
                        nama:
                          value: PT CONTOH INDONESIA
                          confidence: 1
                          threshold: 0.5
                      payload:
                        npwp: 12.345.678.9-012.000
                        npwp_score: 0.98
                        npwp_candidate_count: 1
                        name_base: PT CONTOH INDONESIA
                        name_score: 0.95
                        avg_doc_score: 0.91
                        min_doc_score: 0.62
                        flag: false
                        guardrail_probability: 0.98
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '400':
          description: An unsupported `document_type`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 400
                status_desc: Bad Request
                message: 'Unsupported document_type: ktp. Supported: [''npwp'']'
                errors: BAD_REQUEST
                pipeline_last_stage: scoring
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: UNAUTHORIZED
                pipeline_last_stage: scoring
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'body.structuring: Field required'
                errors: VALIDATION_ERROR
                pipeline_last_stage: scoring
      security:
      - APIKeyHeader: []
  /v1/scoring/confidence:
    post:
      tags:
      - Scoring
      summary: Per-field confidence from the trust model, synchronous (no job, no callback)
      description: 'The ML team''s scoring contract (`POST /v1/score` of their scoring service, model
        of 21 Sep 2026): the payload carries the signals of the previous stages, the answer is the probability
        that each extracted field is correct (`npwp_confidence`, `name_confidence`), from `weights/trust_model.joblib`
        (imputer -> scaler -> logistic regression, one feature row per field: `field_is_npwp`, `field_score`,
        `shape_confidence`, `field_multiple_candidates`, `name_max_char_len`, `avg_doc_score`, `min_doc_score`,
        `flag`, `guardrail_probability`). There is no document score and no approve/reject decision here;
        thresholds are the caller''s. A field whose value is null gets a null confidence. Any other null
        is treated as missing and filled by the model''s own median imputer.'
      operationId: predictConfidence
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfidenceRequest'
        required: true
      responses:
        '200':
          description: Probability that each extracted field is correct
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfidenceResponse'
              examples:
                both:
                  summary: Both fields present
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      npwp_confidence: 0.9835
                      name_confidence: 0.9806
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                flagged:
                  summary: '`flag: true` (a review flag of the structuring rules) lowers both confidences'
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      npwp_confidence: 0.9757
                      name_confidence: 0.9725
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                no_name:
                  summary: '`name_base` is null: a field that was not found has no confidence'
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      npwp_confidence: 0.9835
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: UNAUTHORIZED
                pipeline_last_stage: scoring
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'body.npwp_score: Input should be a valid number'
                errors: VALIDATION_ERROR
                pipeline_last_stage: scoring
      security:
      - APIKeyHeader: []
webhooks:
  stageCallback:
    post:
      tags:
      - Callbacks
      summary: Stage status callback (implemented by the orchestrator / gateway)
      description: '**This is a request this service SENDS, not one it accepts.** The orchestrator must
        expose it.


        `POST {ORCHESTRATION_URL}{ORCHESTRATION_CALLBACK_PATH}` (default path `/v1/callbacks/stage`),
        `Content-Type: application/json`.


        **When.** Once per job of `POST /v1/scoring/jobs`, the last callback of a request: `stage: SCORING`
        with `status: DONE` and `result` = the **final result** (fields, per-field confidences, and the
        guardrails result that was submitted), or `status: FAILED` with `error_message` and `result: null`.


        **Expected answer.** Any `2xx`; the body is ignored. `5xx`, a timeout or an unreachable host are
        retried (3 attempts by default, exponential back-off from 0.5 s). A `4xx` is NOT retried. A callback
        that still fails is logged and dropped: the job itself stays `DONE` / `FAILED`, so the orchestrator
        can reconcile with the orchestrator NPWP''s `GET /v1/extract-ocr/{request_id}` and should time
        a request out on its own. With `PIPELINE_OUTBOX` the callback is instead queued in the same transaction
        as the result and retried with back-off (up to 5 minutes apart) for up to `PIPELINE_OUTBOX_MAX_AGE_SECONDS`
        (24 h by default); a `4xx`, or that age, makes it a dead letter that stays in the table and is
        counted by `GET .../outbox`.


        **What the receiver must tolerate.** The same callback may arrive more than once (treat it as
        idempotent), and callbacks of different stages come from different services, so they may arrive
        out of order: only ever move a request''s status forward. Reject callbacks whose `X-API-Key` is
        wrong.'
      operationId: stageCallback
      parameters:
      - description: '`ORCHESTRATION_API_KEY` of the sending service; when unset, that service''s own
          `API_KEY`'
        required: true
        schema:
          type: string
          title: X-Api-Key
          description: '`ORCHESTRATION_API_KEY` of the sending service; when unset, that service''s own
            `API_KEY`'
        name: x-api-key
        in: header
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoringStageCallback'
        required: true
      responses:
        '200':
          description: Acknowledged. Any 2xx is accepted and the body is ignored.
          content:
            application/json:
              schema: {}
components:
  schemas:
    BoundingBoxPayload:
      properties:
        x1:
          type: number
          title: X1
          description: Left edge, pixels
          examples:
          - 271
        y1:
          type: number
          title: Y1
          description: Top edge, pixels
          examples:
          - 358
        x2:
          type: number
          title: X2
          description: Right edge, pixels
          examples:
          - 1347
        y2:
          type: number
          title: Y2
          description: Bottom edge, pixels
          examples:
          - 511
      additionalProperties: true
      type: object
      required:
      - x1
      - y1
      - x2
      - y2
      title: BoundingBoxPayload
      description: Upright box around a text line.
    ConfidenceRequest:
      properties:
        npwp:
          anyOf:
          - type: string
          - type: 'null'
          title: Npwp
          description: Extracted NPWP number, digits or printed form; null when not found
          examples:
          - 12.345.678.9-012.000
        npwp_score:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Npwp Score
          description: OCR score of the line the number came from
          examples:
          - 0.98
        npwp_candidate_count:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Npwp Candidate Count
          description: NPWP-shaped numbers found in the document (a card may print a 15- and a 16-digit
            one)
          examples:
          - 1
        name_base:
          anyOf:
          - type: string
          - type: 'null'
          title: Name Base
          description: The name as OCR read it, BEFORE any normalisation or correction (`signals.name_base`
            of the structuring result); null when not found. The model measures the name's shape on this
          examples:
          - PT CONTOH INDONESIA
        name_score:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Name Score
          description: OCR score of the line the name came from
          examples:
          - 0.95
        avg_doc_score:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Avg Doc Score
          description: Mean OCR score over all lines
          examples:
          - 0.91
        min_doc_score:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Min Doc Score
          description: Lowest OCR score over all lines
          examples:
          - 0.62
        flag:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Flag
          description: Review flag of the structuring rules (`flag` of the structuring result); null counts
            as false
          examples:
          - false
        guardrail_probability:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Guardrail Probability
          description: '`document.confidence` of the guardrails result when the document was accepted'
          examples:
          - 0.98
      type: object
      title: ConfidenceRequest
      description: The ML team's scoring payload (nilamnpwp `scoring/schemas.py`, model retrained 21 Sep
        2026).
    ConfidenceResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          default: 200
          examples:
          - 200
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          default: OK
          examples:
          - OK
        message:
          type: string
          title: Message
          description: Human-readable outcome
          default: Success
          examples:
          - Success
        errors:
          type: 'null'
          title: Errors
          description: Always null on success
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: 'The request_id this response belongs to: the one sent in the form / body / path,
            otherwise the `X-Request-ID` header, otherwise one generated by the service'
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        data:
          $ref: '#/components/schemas/FieldConfidences'
      type: object
      required:
      - data
      title: ConfidenceResponse
    ErrorResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          examples:
          - 400
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          examples:
          - Bad Request
        message:
          type: string
          title: Message
          description: Human-readable cause; safe to log
          examples:
          - Uploaded file is empty
        data:
          type: 'null'
          title: Data
          description: Always null on error
        errors:
          type: string
          title: Errors
          description: 'Stable, machine-readable cause (e.g. `EMPTY_FILE`, `UNAUTHORIZED`, `VALIDATION_ERROR`):
            branch on this, never on the wording of `message`'
          examples:
          - Uploaded file is empty
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: Present when the error is tied to a known request_id
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        pipeline_last_stage:
          anyOf:
          - type: string
          - type: 'null'
          title: Pipeline Last Stage
          description: 'The service the error comes from: this one (`orchestrator`, `guardrails`, `extraction`,
            `structuring`, `scoring`), or the pipeline service it called when that one failed'
          examples:
          - orchestrator
      type: object
      required:
      - status_code
      - status_desc
      - message
      - errors
      title: ErrorResponse
      description: Every error response.
    FieldConfidences:
      properties:
        npwp_confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Npwp Confidence
          description: P(the NPWP number is correct); null when no number was found
          examples:
          - 0.7296
        name_confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Name Confidence
          description: P(the name is correct); null when no name was found
          examples:
          - 0.9471
      type: object
      required:
      - npwp_confidence
      - name_confidence
      title: FieldConfidences
      description: 'Output of the ML team''s trust model: probability that each extracted field is correct.'
    FinalField:
      properties:
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
          description: null when the field was not found
          examples:
          - '3201234567890001'
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          description: OCR score of the line the value came from
          examples:
          - 0.9762
      type: object
      required:
      - confidence
      title: FinalField
      description: A field of the final result.
    FinalResult:
      properties:
        document_type:
          type: string
          title: Document Type
          description: Document type the fields were read as
          examples:
          - npwp
        fields:
          additionalProperties:
            $ref: '#/components/schemas/FinalField'
          type: object
          title: Fields
          description: '`nomor_npwp`, `nama`, `nama_badan`. A 15-digit number is formatted `XX.XXX.XXX.X-XXX.XXX`;
            a 16-digit (NIK-based) number is 16 plain digits. A card printing both reports the 16-digit
            one'
          examples:
          - nama:
              confidence: 0.9931
              value: BUDI SANTOSO
            nama_badan:
              confidence: 0.0
            nomor_npwp:
              confidence: 0.9762
              value: '3201234567890001'
        scoring:
          $ref: '#/components/schemas/FieldConfidences'
          description: 'Per-field trust. There is NO document-level score and NO approve / reject decision:
            thresholds belong to the caller'
        guardrails:
          anyOf:
          - $ref: '#/components/schemas/GuardrailsResult'
          - type: 'null'
          description: The guardrails result that was submitted with the job, returned unchanged
        flag:
          type: boolean
          title: Flag
          description: 'Flag of the structuring rules (see the structuring result), an input of the trust
            model. Only a tolerated flag (single-word name, letter in the number) reaches this result:
            any other rejects the document at structuring'
          default: false
          examples:
          - false
        flag_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Flag Reason
          description: Why `flag` is true, in Indonesian; null when not flagged
          examples:
          - null
      type: object
      required:
      - document_type
      - fields
      - scoring
      title: FinalResult
      description: What the pipeline produced for one request_id. Carried by the SCORING / DONE callback.
    GuardrailsDocument:
      properties:
        verdict:
          anyOf:
          - type: string
            enum:
            - accepted
            - reject
          - type: 'null'
          title: Verdict
          description: Document verdict
          examples:
          - accepted
        confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Confidence
          description: 'Confidence in the verdict: accepted -> lowest `proba_approve` over the pages.
            Sent to the scoring model as `guardrail_probability`'
          examples:
          - 0.9821
        n_pages:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: N Pages
          description: Pages that were checked
          examples:
          - 1
        n_approve:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: N Approve
          description: Pages with verdict `accepted`
          examples:
          - 1
        n_reject:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: N Reject
          description: Pages with verdict `rejected`
          examples:
          - 0
      additionalProperties: true
      type: object
      title: GuardrailsDocument
      description: The guardrails verdict for the whole document.
    GuardrailsPage:
      properties:
        page_index:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Page Index
          description: 0-based page number
          examples:
          - 0
        proba_approve:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Proba Approve
          description: Probability that this page is an acceptable document
          examples:
          - 0.9821
        proba_reject:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Proba Reject
          description: 1 - `proba_approve`
          examples:
          - 0.0179
        verdict:
          anyOf:
          - type: string
            enum:
            - accepted
            - reject
          - type: 'null'
          title: Verdict
          description: Verdict for this page alone
          examples:
          - accepted
      additionalProperties: true
      type: object
      title: GuardrailsPage
      description: One page of the guardrails report.
    GuardrailsResult:
      properties:
        passed:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Passed
          description: 'true: the document may proceed to OCR'
          examples:
          - true
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Why it was rejected; null when passed
          examples:
          - null
        document:
          anyOf:
          - $ref: '#/components/schemas/GuardrailsDocument'
          - type: 'null'
          description: Verdict for the document as a whole
        pages:
          items:
            $ref: '#/components/schemas/GuardrailsPage'
          type: array
          title: Pages
          description: One entry per page, in page order
      additionalProperties: true
      type: object
      title: GuardrailsResult
      description: The guardrails report (`data` of the guardrails service's POST /v1/guardrails/check,
        sent on by the orchestrator), forwarded unchanged down the pipeline.
    HealthResponse:
