openapi: 3.1.0
info:
  title: OCR NPWP Scoring API
  description: 'Pipeline step 4 (last) for Indonesian NPWP documents: combines per-field confidence and
    format validation into one document score plus an approve/review/reject decision. **Async pipeline:**
    the structuring service POSTs /v1/scoring/jobs and gets 202; this service scores in the background,
    stores the result, and POSTs the stage callback carrying the final result to the orchestrator. /v1/scoring/score
    is the same work, synchronous. All endpoints except /health require an X-API-Key header.'
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - Health
      summary: Health check
      description: Reports service liveness and the active model backend. Does not require an API key.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/scoring/jobs:
    post:
      tags:
      - Pipeline
      summary: Submit a structured document to the async pipeline (scoring stage, last)
      description: 'Called by the structuring service. Records the job (`scoring.jobs`, idempotent per
        request_id), answers **202 immediately**, then in the background: scores the document, stores
        the result (`scoring.results`), and POSTs the stage callback to the orchestrator. As the last
        stage, its callback carries the **final result** (`result`: document_type, fields, scoring, guardrails).


        Sending the same request_id again does not run the work twice (`duplicate: true`), unless the
        previous attempt FAILED.'
      operationId: submit_job_v1_scoring_jobs_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoringJobRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'body.structuring: Field required'
                errors: VALIDATION_ERROR
      security:
      - APIKeyHeader: []
  /v1/scoring/jobs/{request_id}:
    get:
      tags:
      - Pipeline
      summary: Get the scoring stage status / result of a request_id
      description: Status of this stage only (PROCESSING / DONE / FAILED) and its score report. For debugging
        and reconciliation; the orchestrator normally learns the status from the callback.
      operationId: get_job_v1_scoring_jobs__request_id__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No scoring job for this request_id
          content:
            application/json:
              example:
                status_code: 404
                status_desc: Not Found
                message: 'No SCORING job found for request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0'
                errors: 'No SCORING job found for request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0'
                request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'path.request_id: Field required'
                errors: VALIDATION_ERROR
                request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/scoring/score:
    post:
      tags:
      - Scoring
      summary: Score a structured document
      description: Combines per-field confidence and format validation into one document score (the `guardrails`
        value of extract-ocr), then applies the configured thresholds to decide approve / review / reject.
      operationId: score_v1_scoring_score_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreResponse'
        '400':
          description: Unsupported document_type or no fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 400
                status_desc: Bad Request
                message: No fields to score
                errors: No fields to score
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'body.fields: Field required'
                errors: VALIDATION_ERROR
      security:
      - APIKeyHeader: []
components:
  schemas:
    ErrorResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          examples:
          - 400
        status_desc:
          type: string
          title: Status Desc
          examples:
          - Bad Request
        message:
          type: string
          title: Message
          examples:
          - Uploaded file is empty
        data:
          type: 'null'
          title: Data
        errors:
          type: string
          title: Errors
          examples:
          - Uploaded file is empty
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: Present when the error is tied to a known request_id
      type: object
      required:
      - status_code
      - status_desc
      - message
      - errors
      title: ErrorResponse
    FieldScore:
      properties:
        name:
          type: string
          title: Name
          examples:
          - nomor_npwp
        score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Score
          examples:
          - 0.96
        issues:
          items:
            type: string
          type: array
          title: Issues
          examples:
          - - missing
      type: object
      required:
      - name
      - score
      title: FieldScore
    FieldValue:
      properties:
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
          examples:
          - 12.345.678.9-012.345
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          default: 1.0
          examples:
          - 0.96
      type: object
      title: FieldValue
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          examples:
          - healthy
        version:
          type: string
          title: Version
          examples:
          - 1.0.0
        device:
          type: string
          title: Device
          examples:
          - cpu
        backends:
          additionalProperties:
            type: string
          type: object
          title: Backends
          description: Backend model aktif di service ini
          examples:
          - ekstraksi: paddle
      type: object
      required:
      - status
      - version
      - device
      - backends
      title: HealthResponse
    JobAccepted:
      properties:
        request_id:
          type: string
          title: Request Id
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        stage:
          type: string
          enum:
          - OCR
          - STRUCTURING
          - SCORING
          title: Stage
          examples:
          - OCR
        status:
          type: string
          enum:
          - PROCESSING
          - DONE
          - FAILED
          title: Status
          description: PROCESSING untuk job baru; status terkini kalau request_id ini sudah pernah dikirim
        duplicate:
          type: boolean
          title: Duplicate
          description: 'true: request_id ini sudah pernah diterima, kerja TIDAK dijalankan ulang (idempoten)'
          default: false
      type: object
      required:
      - request_id
      - stage
      - status
      title: JobAccepted
    JobAcceptedResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          default: 202
          examples:
          - 202
        status_desc:
          type: string
          title: Status Desc
          default: Accepted
          examples:
          - Accepted
        message:
          type: string
          title: Message
          default: Accepted
          examples:
          - Accepted
        errors:
          type: 'null'
          title: Errors
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        data:
          $ref: '#/components/schemas/JobAccepted'
      type: object
      required:
      - data
      title: JobAcceptedResponse
    JobStatus:
      properties:
        request_id:
          type: string
          title: Request Id
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        stage:
          type: string
          enum:
          - OCR
          - STRUCTURING
          - SCORING
          title: Stage
          examples:
          - OCR
        status:
          type: string
          enum:
          - PROCESSING
          - DONE
          - FAILED
          title: Status
          examples:
          - DONE
        result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Result
          description: Hasil tahap ini saat DONE; null selain itu
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
          description: Pesan kegagalan saat FAILED; null selain itu
        created_at:
          type: string
          title: Created At
          examples:
          - '2026-09-18T04:00:00+00:00'
        updated_at:
          type: string
          title: Updated At
          examples:
          - '2026-09-18T04:00:01+00:00'
      type: object
      required:
      - request_id
      - stage
      - status
      - created_at
      - updated_at
      title: JobStatus
    JobStatusResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          default: 200
          examples:
          - 200
        status_desc:
          type: string
          title: Status Desc
          default: OK
          examples:
          - OK
        message:
          type: string
          title: Message
          default: Success
          examples:
          - Success
        errors:
          type: 'null'
          title: Errors
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        data:
          $ref: '#/components/schemas/JobStatus'
      type: object
      required:
      - data
      title: JobStatusResponse
    ScoreReport:
      properties:
        score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Score
          examples:
          - 0.91
        decision:
          type: string
          enum:
          - approve
          - review
          - reject
          title: Decision
          examples:
          - approve
        field_scores:
          items:
            $ref: '#/components/schemas/FieldScore'
          type: array
          title: Field Scores
        reasons:
          items:
            type: string
          type: array
          title: Reasons
      type: object
      required:
      - score
      - decision
      - field_scores
      title: ScoreReport
    ScoreRequest:
      properties:
        document_type:
          type: string
          title: Document Type
          default: npwp
          examples:
          - npwp
        fields:
          additionalProperties:
            $ref: '#/components/schemas/FieldValue'
          type: object
          title: Fields
          description: Field terstruktur (`data.fields` dari service structuring)
          examples:
          - nomor_npwp:
              confidence: 0.96
              value: 12.345.678.9-012.345
      type: object
      required:
      - fields
      title: ScoreRequest
    ScoreResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          default: 200
          examples:
          - 200
        status_desc:
          type: string
          title: Status Desc
          default: OK
          examples:
          - OK
        message:
          type: string
          title: Message
          default: Success
          examples:
          - Success
        errors:
          type: 'null'
          title: Errors
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        data:
          $ref: '#/components/schemas/ScoreReport'
      type: object
      required:
      - data
      title: ScoreResponse
    ScoringJobRequest:
      properties:
        request_id:
          type: string
          minLength: 1
          title: Request Id
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        document_type:
          type: string
          title: Document Type
          default: npwp
          examples:
          - npwp
        guardrails:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Guardrails
          description: Hasil guardrails dari orkestrator; ikut masuk ke hasil akhir
        ocr:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Ocr
          description: Hasil tahap OCR. Belum dipakai scorer heuristic; tersedia untuk model scoring nanti
        structuring:
          $ref: '#/components/schemas/StructuringPayload'
          description: Hasil tahap structuring
      type: object
      required:
      - request_id
      - structuring
      title: ScoringJobRequest
    StructuredField:
      properties:
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
          examples:
          - 12.345.678.9-012.345
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          default: 1.0
          examples:
          - 0.96
      additionalProperties: true
      type: object
      title: StructuredField
    StructuringPayload:
      properties:
        fields:
          additionalProperties:
            $ref: '#/components/schemas/StructuredField'
          type: object
          title: Fields
          description: Field terstruktur (`structuring.results`)
      additionalProperties: true
      type: object
      required:
      - fields
      title: StructuringPayload
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: API key for this service
      in: header
      name: X-API-Key
tags:
- name: Health
  description: Liveness check
- name: Pipeline
  description: 'Async pipeline stage: 202 + background work + callback'
- name: Scoring
  description: Document score & approve/review/reject decision, synchronous
