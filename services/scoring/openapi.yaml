          examples:
          - PT CONTOH INDONESIA
        name_score:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Name Score
          description: OCR score of the line the name came from
          examples:
          - 0.95
        avg_doc_score:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
