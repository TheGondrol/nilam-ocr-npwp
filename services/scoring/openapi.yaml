          title: Confidence
          description: 1 when the trust model's probability reached `threshold`, else 0 (also 0 when not
            found)
          examples:
          - 1
        threshold:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Threshold
          description: 'The threshold this field was decided with: its `column_confidence_threshold` from
            the central orchestrator, else `FIELD_CONFIDENCE_THRESHOLD`'
          examples:
          - 0.5
      type: object
      required:
      - value
      - confidence
      - threshold
      title: ScoredField
    ScoringDirectRequest:
      properties:
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: Echoed in the response; optional, nothing is recorded under it
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        document_type:
          type: string
          title: Document Type
          description: Only `npwp` is supported; anything else is 400
          default: npwp
          examples:
          - npwp
        guardrails:
          anyOf:
          - $ref: '#/components/schemas/GuardrailsResult'
          - type: 'null'
          description: 'The guardrails report (`data` of `POST /v1/guardrails/check`): `document.confidence`
            of an accepted document is the model''s `guardrail_probability`. Left out: null, filled by
            the model''s imputer'
        ocr:
          anyOf:
          - $ref: '#/components/schemas/OcrPayload'
          - type: 'null'
          description: 'The extraction service''s output (`data` of `POST /v1/extraction/extract`): `avg_doc_score`
            / `min_doc_score` are computed from its `blocks`. Left out: null, filled by the model''s imputer'
        structuring:
          $ref: '#/components/schemas/StructuringPayload'
          description: 'The structuring service''s output: `data` of `POST /v1/structuring-direct`, or
            the `result` of `GET /v1/structuring/jobs/{request_id}`'
        column_confidence_threshold:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Column Confidence Threshold
          description: 'Per field, from the central orchestrator: the trust model''s probability that
            the field''s value is correct must reach it for the field''s `confidence` to be `1` (else
            `0`), always on the accept side. Keys: `all_field` (every field), `nomor_npwp`, `nama`; a
            field''s own key wins over `all_field`, and a field left out (or the whole map omitted) uses
            `FIELD_CONFIDENCE_THRESHOLD`. Decides the 0/1 `confidence` of `fields` in the answer'
          examples:
          - all_field: 0.8
          - nama: 0.5
            nomor_npwp: 0.9
      type: object
      required:
      - structuring
      title: ScoringDirectRequest
      description: '`POST /v1/scoring-direct`: the previous stages'' outputs, nothing of the pipeline
        run.'
    ScoringDirectResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          default: 200
          examples:
          - 200
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          default: OK
          examples:
          - OK
        message:
          type: string
          title: Message
          description: Human-readable outcome
          default: Success
          examples:
          - Success
        errors:
          type: 'null'
          title: Errors
          description: Always null on success
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: 'The request_id this response belongs to: the one sent in the form / body / path,
            otherwise the `X-Request-ID` header, otherwise one generated by the service'
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        data:
          $ref: '#/components/schemas/ScoringJobResult'
      type: object
      required:
      - data
      title: ScoringDirectResponse
    ScoringJobRequest:
      properties:
        request_id:
          type: string
          minLength: 1
          title: Request Id
          description: request_id of the pipeline run
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        document_type:
          type: string
          title: Document Type
          description: Only `npwp` is supported; anything else fails the job
          default: npwp
          examples:
          - npwp
        guardrails:
          anyOf:
          - $ref: '#/components/schemas/GuardrailsResult'
          - type: 'null'
          description: Guardrails result submitted with the OCR job; returned unchanged in the final result
        ocr:
          anyOf:
          - $ref: '#/components/schemas/OcrPayload'
          - type: 'null'
          description: Result of the OCR stage; `avg_doc_score` / `min_doc_score` are computed from `blocks`
        structuring:
          anyOf:
          - $ref: '#/components/schemas/StructuringPayload'
          - type: 'null'
          description: 'Result of the structuring stage. Left out when the structuring service hands off
            by reference (`PIPELINE_HANDOFF_BY_REFERENCE`): this service then reads `nilam_structuring_results`
            (and `nilam_ocr_results`) of the shared database'
        pipeline_name_sequence:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Pipeline Name Sequence
          description: 'The services this request runs, in order, from the central orchestrator (forwarded
            by the orchestrator NPWP and each stage): `guardrails`, `extraction`, `structuring`, `scoring`,
            guardrails optional at the front and the end cut off, never one skipped in the middle. The
            last one ends the request: its result is the answer, as it is, and nothing is handed on. Omitted:
            the full pipeline'
          examples:
          - - guardrails
            - extraction
            - structuring
            - scoring
        column_confidence_threshold:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Column Confidence Threshold
          description: 'Per field, from the central orchestrator: the trust model''s probability that
            the field''s value is correct must reach it for the field''s `confidence` to be `1` (else
            `0`), always on the accept side. Keys: `all_field` (every field), `nomor_npwp`, `nama`; a
            field''s own key wins over `all_field`, and a field left out (or the whole map omitted) uses
            `FIELD_CONFIDENCE_THRESHOLD`. Applied to the outcome row (`ORCHESTRATION_OUTCOME_TABLE`);
            the callback keeps the raw probabilities'
          examples:
          - nama: 0.5
            nomor_npwp: 0.9
      type: object
      required:
      - request_id
      title: ScoringJobRequest
    ScoringJobResult:
      properties:
        npwp_confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Npwp Confidence
          description: P(the NPWP number is correct); null when no number was found
          examples:
          - 0.7296
        name_confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Name Confidence
          description: P(the name is correct); null when no name was found
          examples:
          - 0.9471
        fields:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/ScoredField'
            type: object
          - type: 'null'
          title: Fields
          description: 'The `extract-ocr` fields as scoring decided them (`nomor_npwp`, `nama`: the person''s
            name, or the company''s registered name): value, 0/1 confidence, and the threshold used. The
            outcome row (`ORCHESTRATION_OUTCOME_TABLE`) carries the same values. Null for a result stored
            before it existed'
          examples:
          - nama:
              confidence: 1
              threshold: 0.5
              value: BUDI SANTOSO
            nomor_npwp:
              confidence: 1
              threshold: 0.5
              value: 12.345.678.9-012.345
        payload:
          $ref: '#/components/schemas/ConfidenceRequest'
          description: 'Exactly what was scored, built from the chained results: an audit trail for the
            two numbers'
      type: object
      required:
      - npwp_confidence
      - name_confidence
      - payload
      title: ScoringJobResult
      description: 'Output of the ML team''s trust model: probability that each extracted field is correct.'
    ScoringJobStatus:
      properties:
        request_id:
          type: string
          title: Request Id
          description: request_id of the pipeline run
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        stage:
          type: string
          const: SCORING
          title: Stage
          description: Always `SCORING` on this service
          default: SCORING
          examples:
          - SCORING
        status:
          type: string
          enum:
          - PROCESSING
          - DONE
          - FAILED
          title: Status
          description: '`PROCESSING` -> `DONE` | `FAILED`. A `FAILED` job may go back to `PROCESSING`
            when resubmitted'
          examples:
          - DONE
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
          description: Why the stage failed; null unless `status` is `FAILED`. Same text as the FAILED
            callback
          examples:
          - null
        created_at:
          type: string
          title: Created At
          description: When the job was first accepted (ISO 8601, UTC)
          examples:
          - '2026-09-18T04:00:00+00:00'
        updated_at:
          type: string
          title: Updated At
          description: Last status change (ISO 8601, UTC)
          examples:
          - '2026-09-18T04:00:01+00:00'
        pipeline_name_sequence:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Pipeline Name Sequence
          description: 'The services this request runs, as the job was submitted with them; the last one
            ends the request. Null for a job submitted without it: the full pipeline'
          examples:
          - - guardrails
            - extraction
            - structuring
            - scoring
        column_confidence_threshold:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Column Confidence Threshold
          description: 'The central orchestrator''s per-field thresholds the job was submitted with (`nomor_npwp`,
            `nama`; an `all_field` it sent is already spread over them); null when none were given: `FIELD_CONFIDENCE_THRESHOLD`
            for every field'
          examples:
          - nama: 0.5
            nomor_npwp: 0.9
        result:
          anyOf:
          - $ref: '#/components/schemas/ScoringJobResult'
          - type: 'null'
          description: Confidences once `status` is `DONE`; null otherwise
      type: object
      required:
      - request_id
      - status
      - created_at
      - updated_at
      title: ScoringJobStatus
    ScoringJobStatusResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          default: 200
          examples:
          - 200
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          default: OK
          examples:
          - OK
        message:
          type: string
          title: Message
          description: Human-readable outcome
          default: Success
          examples:
          - Success
        errors:
          type: 'null'
          title: Errors
          description: Always null on success
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: 'The request_id this response belongs to: the one sent in the form / body / path,
            otherwise the `X-Request-ID` header, otherwise one generated by the service'
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        data:
          $ref: '#/components/schemas/ScoringJobStatus'
      type: object
      required:
      - data
      title: ScoringJobStatusResponse
    ScoringStageCallback:
      properties:
        request_id:
          type: string
          title: Request Id
          description: The request_id you submitted with `POST /v1/extraction/jobs`
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        stage:
          type: string
          const: SCORING
          title: Stage
          description: 'Always `SCORING`: the last stage'
          default: SCORING
          examples:
          - SCORING
        status:
          type: string
          enum:
          - DONE
          - FAILED
          title: Status
          description: Outcome of the stage. `FAILED` of any stage ends the request
          examples:
          - DONE
        result:
          anyOf:
          - $ref: '#/components/schemas/FinalResult'
          - type: 'null'
          description: The final result of the request when `status` is `DONE`; null when `FAILED`
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
          description: Why it failed; null when `status` is `DONE`
          examples:
          - null
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
          description: 'Only on a rejection: `DOWNSTREAM_VALIDATION_ERROR` when the stage rejected the
            document (a rejecting check of the structuring rules; `error_message` is the Indonesian reason).
            Absent when a stage broke'
          examples:
          - null
      type: object
      required:
      - request_id
      - status
      title: ScoringStageCallback
      description: Body of the callback a stage POSTs to the orchestrator when it finishes.
    StructuredFieldPayload:
      properties:
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
          description: null when the field was not found
          examples:
          - '3201234567890001'
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          description: OCR score of the line the value came from
          default: 1.0
          examples:
          - 0.9762
        source:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
          description: Raw OCR line the value came from
          examples:
          - NPWP16:3201 2345 6789 0001
        signals:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Signals
          description: 'Inputs for the scoring model and review signals of the ML team''s rules. nomor_npwp:
            `candidate_count` (NPWP-shaped numbers found in the document), `has_homoglyph` (OCR read a
            letter where a digit belongs), `invalid_province_prefix` / `invalid_kecamatan_prefix` / `invalid_birthdate`
            (16-digit NIK-based number fails the Kode Wilayah / birthdate check), `invalid_kpp_prefix`
            (15-digit number''s KPP office code is unknown). nama / nama_badan: `name_base` (the read
            before any normalisation; the trust model measures the name on this), `corrected` (the returned
            name differs from `name_base`)'
          examples:
          - candidate_count: 2
            has_homoglyph: false
      additionalProperties: true
      type: object
      title: StructuredFieldPayload
      description: One named field read by structuring.
    StructuringPayload:
      properties:
        document_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Type
          description: Document type the fields were read as
          examples:
          - npwp
        fields:
          additionalProperties:
            $ref: '#/components/schemas/StructuredFieldPayload'
          type: object
          title: Fields
          description: Always `nomor_npwp`, `nama`, `nama_badan`. A person's card fills `nama`, a company's
            `nama_badan`
        flag:
          type: boolean
          title: Flag
          description: 'Flag of the ML team''s rules, a feature of the trust model: another document bundled
            in, CAPTCHA or lookup screenshot, number or name not found, single-word name, letter in the
            number, invalid Kode Wilayah / birthdate / KPP code, more than 2 pages'
          default: false
          examples:
          - false
        flag_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Flag Reason
          description: Why `flag` is true, in Indonesian; null when not flagged
          examples:
          - null
        reject_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reject Reason
          description: Set when a check that rejects the document fired (all but a single-word name and
            a letter in the number). A rejected document is never handed to scoring; the client gets a
            400 with this message
          examples:
          - null
      additionalProperties: true
      type: object
      required:
      - fields
      title: StructuringPayload
      description: Result of the structuring stage (`nilam_structuring_results`), forwarded to scoring.
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: API key for this service
      in: header
      name: X-API-Key
tags:
- name: Pipeline
  description: 'Asynchronous pipeline stage: 202, background work, callback'
- name: Callbacks
  description: Requests this service SENDS to the orchestrator (see Webhooks)
- name: Direct
  description: 'This stage alone on the previous stages'' outputs, synchronous: nothing recorded (QC)'
- name: Scoring
  description: The trust model on one payload, synchronous (debugging)
- name: Health
  description: Health and readiness checks; no API key
