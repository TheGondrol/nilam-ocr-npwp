openapi: 3.1.0
info:
  title: OCR NPWP API
  description: 'OCR service for Indonesian NPWP (tax ID card) documents; ServiceOCR in the pipeline. **Async
    pipeline:** the orchestrator POSTs /v1/ekstraksi/jobs after guardrails passed and gets 202; this service
    runs OCR in the background, stores the result, POSTs a stage callback to the orchestrator, and hands
    the job to the structuring service. **Legacy contract:** generate-request-id -> extract-ocr -> get-ocr-result
    runs the whole chain synchronously and stays until the orchestrator has moved to the async flow. The
    raw OCR step is also exposed as /v1/ekstraksi/extract. All endpoints except /health require an X-API-Key
    header.


    ## Conventions (the same for every nilam-ocr service)


    **Authentication.** Every endpoint except `/health` and `/ready` requires the header `X-API-Key`.

    A missing or wrong key answers `401`. The services are reachable only from inside the cluster.


    **Envelope.** Every JSON response, success or error, has the same shape:

    `{status_code, status_desc, message, data, errors, request_id}`. `status_code` always equals the HTTP

    status. On success `errors` is null; on error `data` is null.


    **Errors.** `errors` is machine-readable: `VALIDATION_ERROR` for `422`, otherwise the same text as

    `message`. `400` = the request or the document is unusable (do not retry unchanged). `401` = API key.

    `404` = unknown request_id. `409` = request_id already processed (legacy contract only). `422` = a

    field is missing or has the wrong type. `500` = this service or its model failed. `503` = a

    dependency is unreachable, `504` = it did not answer in time (both are safe to retry).


    **request_id.** Minted by the orchestrator and carried through every stage. Where an endpoint has
    no

    request_id of its own, the `X-Request-ID` request header is used (and echoed in the response header);

    without it the service generates one.


    **Asynchronous stages.** `POST .../jobs` answers `202` immediately and does the work in the

    background. The outcome is reported by a callback to the orchestrator (see *Webhooks*), and can be

    read at any time with `GET .../jobs/{request_id}`. Submitting the same request_id again is idempotent:

    `202` with `duplicate: true`, the work is not repeated, unless the earlier attempt `FAILED`. Because

    the request was already answered `202`, a problem with the document itself (unreadable file, no text,

    unsupported document type) shows up as a `FAILED` job and callback, not as a `4xx`.

    '
  version: 1.0.0
servers:
- url: /
  description: This host (where this page is served)
- url: http://ekstraksi.nilam-ocr-{environment}.svc.cluster.local:8030
  description: GKE, from another namespace (e.g. the orchestrator / gateway)
  variables:
    environment:
      enum:
      - dev
      - staging
      - production
      default: dev
      description: 'One namespace per environment: nilam-ocr-<environment>'
- url: http://ekstraksi:8030
  description: GKE from the same namespace, or the Docker Compose network
- url: http://127.0.0.1:8030
  description: Local development
paths:
  /health:
    get:
      tags:
      - Health
      summary: Liveness probe
      description: Says the process is alive and which implementations are active. Never touches a dependency.
        Does not require an API key.
      operationId: getHealth
      responses:
        '200':
          description: The process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: Healthy
                  value:
                    status: healthy
                    version: 1.0.0
                    device: cpu
                    backends:
                      ekstraksi: paddle
                      storage: postgres
  /ready:
    get:
      tags:
      - Health
      summary: Readiness probe
      description: 'Liveness vs readiness: /health only says the process is alive and never touches a
        dependency (a database blip must not make Kubernetes restart every pod). /ready says whether this
        pod can do its job right now: 200 when every REQUIRED dependency of this service answers, 503
        otherwise, so the pod is taken out of the Service until it recovers. Downstream stages and model
        services are deliberately not checked: their outage is reported per job, not by refusing traffic.
        Does not require an API key.'
      operationId: getReadiness
      responses:
        '200':
          description: Every required dependency answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              examples:
                ready:
                  summary: Ready
                  value:
                    status: ready
                    checks:
                      database: ok
        '503':
          description: A required dependency is unavailable; the pod is taken out of the Service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                status: not_ready
                checks:
                  database: failed
  /v1/ekstraksi/jobs:
    post:
      tags:
      - Pipeline
      summary: Start the pipeline for a document (OCR stage)
      description: '**Step 2 of the pipeline, asynchronous: the entry point of the OCR -> structuring
        -> scoring chain.** Call it after `POST /v1/guardrails/check` answered `passed: true`.


        Records the job (`ocr.jobs`, idempotent per request_id), answers **202 immediately**, then in
        the background: reads the document (`file`, or downloads `file_url`), runs OCR, stores the result
        (`ocr.results`), POSTs the `OCR` callback, and hands the job to the structuring service, which
        hands it to scoring. The caller does nothing more: it receives one callback per stage, and the
        final result in the `SCORING` callback (see *Webhooks*).


        **Document.** Send `file` (multipart) or `file_url`, exactly one. JPEG, PNG or PDF, at most 5
        MB. `file_url` is downloaded in the background, so make a presigned URL live longer than the worst
        queueing time; an expired or unreachable URL becomes a `FAILED` job, not a `4xx`.


        **Idempotency.** The same request_id again answers `202` with `duplicate: true` and does not run
        OCR twice, unless the earlier attempt `FAILED`, in which case it is run again.'
      operationId: submitOcrJob
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_submitOcrJob'
        required: true
      responses:
        '202':
          description: The job was accepted (or already existed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
              examples:
                accepted:
                  summary: New job
                  value:
                    status_code: 202
                    status_desc: Accepted
                    message: Accepted
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: OCR
                      status: PROCESSING
                      duplicate: false
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                duplicate:
                  summary: 'Same request_id sent again: nothing is re-run, `status` is the existing job''s
                    status'
                  value:
                    status_code: 202
                    status_desc: Accepted
                    message: Accepted
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: OCR
                      status: DONE
                      duplicate: true
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '400':
          description: Neither or both of file / file_url, or `guardrails` is not a JSON object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 400
                status_desc: Bad Request
                message: Send exactly one of file or file_url
                errors: Send exactly one of file or file_url
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'body.request_id: Field required'
                errors: VALIDATION_ERROR
      security:
      - APIKeyHeader: []
  /v1/ekstraksi/jobs/{request_id}:
    get:
      tags:
      - Pipeline
      summary: Status and result of the OCR stage
      description: Status of this stage only, and its raw OCR result once `DONE`. The orchestrator normally
        learns the status from the callback; use this to reconcile after a missed callback, or to debug.
        The later stages have the same endpoint on their own service (`/v1/structuring/jobs/{request_id}`,
        `/v1/scoring/jobs/{request_id}`).
      operationId: getOcrJob
      security:
      - APIKeyHeader: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      responses:
        '200':
          description: The job exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrJobStatusResponse'
              examples:
                processing:
                  summary: Still running
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: OCR
                      created_at: '2026-09-18T04:00:00+00:00'
                      status: PROCESSING
                      updated_at: '2026-09-18T04:00:00+00:00'
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                done:
                  summary: Finished
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: OCR
                      created_at: '2026-09-18T04:00:00+00:00'
                      status: DONE
                      result:
                        engine: paddle
                        model: PP-OCRv6_medium_det+PP-OCRv6_medium_rec
                        elapsed_ms: 412.5
                        full_text: 'DIREKTORAT JENDERAL PAJAK

                          NPWP : 12.345.678.9-012.345

                          BUDI SANTOSO'
                        blocks:
                        - text: DIREKTORAT JENDERAL PAJAK
                          confidence: 0.9985
                          bbox:
                            x1: 175
                            y1: 247
                            x2: 887
                            y2: 308
                          page: 0
                        - text: 'NPWP : 12.345.678.9-012.345'
                          confidence: 0.9992
                          bbox:
                            x1: 35
                            y1: 389
                            x2: 637
                            y2: 437
                          page: 0
                        - text: BUDI SANTOSO
                          confidence: 0.9773
                          bbox:
                            x1: 33
                            y1: 480
                            x2: 483
                            y2: 523
                          page: 0
                      updated_at: '2026-09-18T04:00:01+00:00'
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                failed:
                  summary: 'Failed: same `error_message` as the FAILED callback. Resubmitting the request_id
                    runs it again'
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: OCR
                      created_at: '2026-09-18T04:00:00+00:00'
                      status: FAILED
                      error_message: ekstraksi OCR model is unavailable
                      updated_at: '2026-09-18T04:00:03+00:00'
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No OCR job for this request_id
          content:
            application/json:
              example:
                status_code: 404
                status_desc: Not Found
                message: 'No OCR job found for request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0'
                errors: 'No OCR job found for request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0'
                request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'path.request_id: Field required'
                errors: VALIDATION_ERROR
                request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/generate-request-id:
    post:
      tags:
      - NPWP OCR
      summary: 'Legacy: mint a request_id'
      description: '**Legacy synchronous contract**, kept until the orchestrator has moved to the asynchronous
        pipeline (`POST /v1/ekstraksi/jobs`). Mints a request_id that must be used once in POST /v1/extract-ocr.
        In the asynchronous pipeline the orchestrator mints the request_id itself.'
      operationId: generateRequestId
      responses:
        '200':
          description: A new request_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateRequestIdResponse'
              examples:
                minted:
                  summary: Use it once in POST /v1/extract-ocr
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
      deprecated: true
      security:
      - APIKeyHeader: []
  /v1/extract-ocr:
    post:
      tags:
      - NPWP OCR
      summary: 'Legacy: run the whole chain synchronously'
      description: '**Legacy synchronous contract**, kept until the orchestrator has moved to the asynchronous
        pipeline (`POST /v1/ekstraksi/jobs`). Runs the full pipeline (guardrails service -> this service''s
        OCR -> structuring service -> scoring service) on the uploaded NPWP image for the given request_id
        (from /v1/generate-request-id). A request_id can only be submitted once.


        Send the image as `file`, or send `file_url` and this service fetches it itself; exactly one of
        the two.'
      operationId: extractOcr
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_extractOcr'
        required: true
      responses:
        '200':
          description: The document was read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              examples:
                person:
                  summary: A person's card
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      nomor_npwp:
                        value: 12.345.678.9-012.345
                        confidence: 0.9992
                      nama:
                        value: BUDI SANTOSO
                        confidence: 0.9773
                      nama_badan:
                        confidence: 0.0
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                    guardrails: 0.9904
        '400':
          description: Unknown request_id, bad file, or rejected by guardrails
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 400
                status_desc: Bad Request
                message: 'Document rejected by guardrails: 1/1 page(s) rejected (confidence 0.88)'
                errors: 'Document rejected by guardrails: 1/1 page(s) rejected (confidence 0.88)'
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
        '409':
          description: request_id was already processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 409
                status_desc: Conflict
                message: request_id OCR_9cb01af2-493d-446d-b191-af120333f6d0 has already been processed
                errors: request_id OCR_9cb01af2-493d-446d-b191-af120333f6d0 has already been processed
        '500':
          description: OCR engine or a downstream stage failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 500
                status_desc: Internal Server Error
                message: Internal server error while processing OCR
                errors: Internal server error while processing OCR
        '503':
          description: OCR model or a downstream stage unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 503
                status_desc: Service Unavailable
                message: ekstraksi OCR model is unavailable
                errors: ekstraksi OCR model is unavailable
        '504':
          description: OCR model or a downstream stage did not answer in time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 504
                status_desc: Gateway Timeout
                message: ekstraksi OCR model timed out after 30.0s
                errors: ekstraksi OCR model timed out after 30.0s
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'body.request_id: Field required'
                errors: VALIDATION_ERROR
      deprecated: true
      security:
      - APIKeyHeader: []
  /v1/get-ocr-result/{request_id}:
    get:
      tags:
      - NPWP OCR
      summary: 'Legacy: status and result of an extract-ocr request'
      description: '**Legacy synchronous contract**, kept until the orchestrator has moved to the asynchronous
        pipeline (`POST /v1/ekstraksi/jobs`). Current status and, once completed, the result of a request_id
        minted by this service.'
      operationId: getOcrResult
      deprecated: true
      security:
      - APIKeyHeader: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      responses:
        '200':
          description: The request_id exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOcrResultResponse'
              examples:
                completed:
                  summary: Finished
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                      status: completed
                      result:
                        nomor_npwp:
                          value: 12.345.678.9-012.345
                          confidence: 0.9992
                        nama:
                          value: BUDI SANTOSO
                          confidence: 0.9773
                        nama_badan:
                          confidence: 0.0
                      created_at: '2026-03-06T07:01:59.976912+00:00'
                      updated_at: '2026-03-06T07:07:04.809697+00:00'
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                    guardrails: 0.9904
                pending:
                  summary: Minted, but extract-ocr has not been called (or is still running)
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                      status: pending
                      created_at: '2026-03-06T07:01:59.976912+00:00'
                      updated_at: '2026-03-06T07:01:59.976912+00:00'
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: request_id was never generated by this service
          content:
            application/json:
              example:
                status_code: 404
                status_desc: Not Found
                message: 'No data found for request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0'
                errors: 'No data found for request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0'
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'path.request_id: Field required'
                errors: VALIDATION_ERROR
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/ekstraksi/extract:
    post:
      tags:
      - Ekstraksi
      summary: Raw OCR of a document, synchronous (no job, no callback)
      description: Runs the OCR engine and returns raw text blocks with confidence and bounding boxes.
        Send the image as `file` or `file_url`; exactly one of the two.
      operationId: extractText
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_extractText'
      responses:
        '200':
          description: Text lines found in the document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractResponse'
              examples:
                npwp_card:
                  summary: An NPWP card
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      engine: paddle
                      model: PP-OCRv6_medium_det+PP-OCRv6_medium_rec
                      elapsed_ms: 412.5
                      full_text: 'DIREKTORAT JENDERAL PAJAK

                        NPWP : 12.345.678.9-012.345

                        BUDI SANTOSO'
                      blocks:
                      - text: DIREKTORAT JENDERAL PAJAK
                        confidence: 0.9985
                        bbox:
                          x1: 175
                          y1: 247
                          x2: 887
                          y2: 308
                        page: 0
                      - text: 'NPWP : 12.345.678.9-012.345'
                        confidence: 0.9992
                        bbox:
                          x1: 35
                          y1: 389
                          x2: 637
                          y2: 437
                        page: 0
                      - text: BUDI SANTOSO
                        confidence: 0.9773
                        bbox:
                          x1: 33
                          y1: 480
                          x2: 483
                          y2: 523
                        page: 0
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '400':
          description: Bad file (empty, too large, unsupported type) or bad intake
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 400
                status_desc: Bad Request
                message: Uploaded file is empty
                errors: Uploaded file is empty
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
        '500':
          description: OCR engine failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 500
                status_desc: Internal Server Error
                message: 'ekstraksi OCR model error (500): error: OpenCV ...'
                errors: 'ekstraksi OCR model error (500): error: OpenCV ...'
        '503':
          description: OCR model unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 503
                status_desc: Service Unavailable
                message: ekstraksi OCR model is unavailable
                errors: ekstraksi OCR model is unavailable
        '504':
          description: OCR model did not answer in time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 504
                status_desc: Gateway Timeout
                message: ekstraksi OCR model timed out after 30.0s
                errors: ekstraksi OCR model timed out after 30.0s
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'body.file: Expected UploadFile, received: str'
                errors: VALIDATION_ERROR
      security:
      - APIKeyHeader: []
webhooks:
  stageCallback:
    post:
      tags:
      - Callbacks
      summary: Stage status callback (implemented by the orchestrator / gateway)
      description: '**This is a request this service SENDS, not one it accepts.** The orchestrator must
        expose it.


        `POST {ORCHESTRATION_URL}{ORCHESTRATION_CALLBACK_PATH}` (default path `/v1/callbacks/stage`),
        `Content-Type: application/json`.


        **When.** Once per job of `POST /v1/ekstraksi/jobs`: `stage: OCR` with `status: DONE` after the
        OCR result is stored and BEFORE the job is handed to structuring, or `status: FAILED` with `error_message`
        when the document could not be read (the chain stops there). Additionally `stage: STRUCTURING`,
        `status: FAILED` when OCR succeeded but the structuring service could not be reached after retries.


        **Expected answer.** Any `2xx`; the body is ignored. `5xx`, a timeout or an unreachable host are
        retried (3 attempts by default, exponential back-off from 0.5 s). A `4xx` is NOT retried. A callback
        that still fails is logged and dropped: the job itself stays `DONE` / `FAILED`, so the orchestrator
        can reconcile with `GET .../jobs/{request_id}` and should time a stage out on its own.


        **What the receiver must tolerate.** The same callback may arrive more than once (treat it as
        idempotent), and callbacks of different stages come from different services, so they may arrive
        out of order: only ever move a request''s status forward. Reject callbacks whose `X-API-Key` is
        wrong.'
      operationId: stageCallback
      parameters:
      - description: '`ORCHESTRATION_API_KEY` of the sending service; when unset, that service''s own
          `API_KEY`'
        required: true
        schema:
          type: string
          title: X-Api-Key
          description: '`ORCHESTRATION_API_KEY` of the sending service; when unset, that service''s own
            `API_KEY`'
        name: x-api-key
        in: header
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageCallback'
        required: true
      responses:
        '200':
          description: Acknowledged. Any 2xx is accepted and the body is ignored.
          content:
            application/json:
              schema: {}
