          title: Guardrails
          description: 'The `data` object of `POST /v1/guardrails/check`, serialised as a JSON string.
            Forwarded down the chain: scoring uses `document.confidence`, and the final result returns
            it unchanged. Optional, but without it the scoring model works with one input missing'
          examples:
          - '{"passed": true, "reason": null, "document": {"verdict": "accepted", "confidence": 0.9821,
            "n_pages": 1, "n_approve": 1, "n_reject": 0}, "pages": [{"page_index": 0, "proba_approve":
            0.9821, "proba_reject": 0.0179, "verdict": "accepted"}]}'
        file:
          anyOf:
          - type: string
            format: binary
          - type: string
          - type: 'null'
          title: File
          description: Document image (JPEG/PNG/PDF). Omit when sending file_url.
        file_url:
          anyOf:
          - type: string
          - type: 'null'
          title: File Url
          description: URL this service fetches the document image from (e.g. a presigned MinIO GET).
            Omit when uploading file.
      type: object
      required:
      - request_id
      title: Body_submitOcrJob
