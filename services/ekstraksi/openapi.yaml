    StageCallback:
      properties:
        request_id:
          type: string
          title: Request Id
          description: The request_id you submitted with `POST /v1/ekstraksi/jobs`
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        stage:
          type: string
          enum:
          - OCR
          - STRUCTURING
          - SCORING
          title: Stage
          description: 'Stage the status is about. Usually the sender''s own stage; when the hand-off
            to the NEXT stage fails after retries, the sender reports `status: FAILED` with the next stage''s
            name, because that stage never received the job and cannot report for itself'
          examples:
          - OCR
        status:
          type: string
          enum:
          - DONE
          - FAILED
          title: Status
          description: Outcome of the stage. `FAILED` of any stage ends the request
          examples:
          - DONE
        result:
          type: 'null'
          title: Result
          description: Always null for OCR and STRUCTURING; read the stage result from GET .../jobs/{request_id}
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
          description: Why it failed; null when `status` is `DONE`
          examples:
          - null
      type: object
      required:
      - request_id
      - stage
      - status
      title: StageCallback
      description: Body of the callback a stage POSTs to the orchestrator when it finishes.
    TextBlock:
      properties:
        text:
          type: string
          title: Text
          description: One OCR text line, as read
          examples:
          - 'NPWP : 12.345.678.9-012.345'
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          description: Recognition score of this line
          examples:
          - 0.9992
        bbox:
          anyOf:
          - $ref: '#/components/schemas/BoundingBox'
          - type: 'null'
          description: Upright box around the line, in pixels of the ORIENTATION-CORRECTED image the OCR
            model worked on. The model straightens and unwarps the card first, so these are NOT coordinates
            in the uploaded photo
        page:
          type: integer
          minimum: 0.0
          title: Page
          description: 0-based page number (multi-page PDF)
          default: 0
          examples:
          - 0
      type: object
      required:
      - text
      - confidence
      title: TextBlock
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: API key for this service
      in: header
      name: X-API-Key
tags:
- name: Pipeline
  description: 'Asynchronous pipeline stage: 202, background work, callback, hand-off'
- name: Callbacks
  description: Requests this service SENDS to the orchestrator (see Webhooks)
- name: NPWP OCR
  description: Legacy synchronous contract used by ocr-orchestration
- name: Ekstraksi
  description: Raw OCR text, synchronous
- name: Health
  description: Liveness and readiness probes; no API key
