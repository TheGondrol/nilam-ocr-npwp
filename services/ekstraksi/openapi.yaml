          examples:
          - paddle
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
          description: Model identity reported by the OCR model service; null when it does not report
            one
          examples:
          - PP-OCRv6_medium_det+PP-OCRv6_medium_rec
        elapsed_ms:
          type: number
          title: Elapsed Ms
          description: Time spent in the OCR model, milliseconds
          examples:
          - 412.5
