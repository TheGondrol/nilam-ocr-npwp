    StructuredDocument:
      properties:
        document_type:
          type: string
          title: Document Type
          description: Document type the fields were read as
          examples:
          - npwp
        fields:
          additionalProperties:
            $ref: '#/components/schemas/StructuredField'
          type: object
          title: Fields
          description: 'Always `nomor_npwp`, `nama`, `nama_badan`; a field that was not found has `value:
            null`. A person''s card fills `nama`, a company''s (PT, CV, ...) fills `nama_badan`. A 15-digit
            number is formatted `XX.XXX.XXX.X-XXX.XXX`; a 16-digit NIK-based number is 16 plain digits,
            and wins when a card prints both'
          examples:
          - nama:
              confidence: 0.9773
              signals:
                corrected: false
                name_base: BUDI SANTOSO
              source: BUDI SANTOSO
              value: BUDI SANTOSO
            nama_badan:
              confidence: 0.0
            nomor_npwp:
              confidence: 0.9992
              signals:
                candidate_count: 1
                has_homoglyph: false
              source: 'NPWP : 12.345.678.9-012.345'
              value: 12.345.678.9-012.345
        flag:
          type: boolean
          title: Flag
          description: 'Flag of the ML team''s rules, a feature of the trust model. True when: another
            document is bundled in (KTP, KK, Akta), the page is a CAPTCHA or a screenshot of the DJP lookup,
            the number or the name was not found, the name is a single word, the number contains a letter,
            its province / kecamatan / birthdate / KPP code is invalid, or the upload has more than 2
            pages'
          examples:
          - false
        flag_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Flag Reason
          description: The first reason `flag` is true, in Indonesian; null when not flagged
          examples:
          - null
        reject_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reject Reason
          description: The first reason that rejects the document, in Indonesian; null when the document
            is accepted. Every check rejects except a single-word name and a letter in the number, which
            only raise `flag`. In the pipeline a rejected document stops here (no scoring) and the client
            gets a 400 with this message
          examples:
          - null
      type: object
      required:
      - document_type
      - fields
      - flag
      title: StructuredDocument
    StructuredField:
      properties:
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
          description: null when the field was not found
          examples:
          - 12.345.678.9-012.345
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          description: OCR score of the line the value came from; 0 when not found
          examples:
          - 0.9992
        source:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
          description: Raw OCR line the value came from
          examples:
          - 'NPWP : 12.345.678.9-012.345'
        signals:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Signals
          description: 'Inputs for the scoring model and review signals (backend `npwp_rules` only; null
            otherwise). nomor_npwp: `candidate_count` (NPWP-shaped numbers found in the document), `has_homoglyph`
            (OCR read a letter where a digit belongs; the letter is dropped, not corrected), `invalid_province_prefix`
            / `invalid_kecamatan_prefix` / `invalid_birthdate` (a 16-digit NIK-based number fails the
            Kode Wilayah or birthdate check), `invalid_kpp_prefix` (a 15-digit number''s KPP office code
            is unknown). nama / nama_badan: `name_base` (the read before any normalisation; the trust
            model measures the name on this), `corrected` (`value` differs from `name_base`)'
          examples:
          - candidate_count: 1
            has_homoglyph: false
      type: object
      required:
      - confidence
      title: StructuredField
