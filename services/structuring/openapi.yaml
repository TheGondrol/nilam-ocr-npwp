openapi: 3.1.0
info:
  title: OCR NPWP Structuring API
  description: 'Pipeline step 3 for Indonesian NPWP documents: turns raw OCR text lines into named fields
    (nomor_npwp, nama, nama_badan) with per-field confidence. **Async pipeline:** the OCR service POSTs
    /v1/structuring/jobs and gets 202; this service structures in the background, stores the result, POSTs
    a stage callback to the orchestrator, and hands the job to the scoring service. /v1/structuring/structure
    is the same work, synchronous. All endpoints except /health require an X-API-Key header.'
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - Health
      summary: Health check
      description: Reports service liveness and the active model backend. Does not require an API key.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      tags:
      - Health
      summary: Readiness check
      description: 'Liveness vs readiness: /health only says the process is alive and never touches a
        dependency (a database blip must not make Kubernetes restart every pod). /ready says whether this
        pod can do its job right now: 200 when every REQUIRED dependency of this service answers, 503
        otherwise, so the pod is taken out of the Service until it recovers. Downstream stages and model
        services are deliberately not checked: their outage is reported per job, not by refusing traffic.
        Does not require an API key.'
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: A required dependency is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /v1/structuring/jobs:
    post:
      tags:
      - Pipeline
      summary: Submit OCR output to the async pipeline (structuring stage)
      description: 'Called by the OCR service. Records the job (`structuring.jobs`, idempotent per request_id),
        answers **202 immediately**, then in the background: turns the OCR blocks into named fields, stores
        the result (`structuring.results`), POSTs the stage callback to the orchestrator, and hands the
        job (guardrails + OCR + structuring results) to the scoring service.


        Sending the same request_id again does not run the work twice (`duplicate: true`), unless the
        previous attempt FAILED.'
      operationId: submit_job_v1_structuring_jobs_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StructuringJobRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'body.ocr: Field required'
                errors: VALIDATION_ERROR
      security:
      - APIKeyHeader: []
  /v1/structuring/jobs/{request_id}:
    get:
      tags:
      - Pipeline
      summary: Get the structuring stage status / result of a request_id
      description: Status of this stage only (PROCESSING / DONE / FAILED) and its structured fields. For
        debugging and reconciliation; the orchestrator normally learns the status from the callback.
      operationId: get_job_v1_structuring_jobs__request_id__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No structuring job for this request_id
          content:
            application/json:
              example:
                status_code: 404
                status_desc: Not Found
                message: 'No STRUCTURING job found for request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0'
                errors: 'No STRUCTURING job found for request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0'
                request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'path.request_id: Field required'
                errors: VALIDATION_ERROR
                request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/structuring/structure:
    post:
      tags:
      - Structuring
      summary: Turn raw OCR lines into named fields
      description: Maps raw text lines (e.g. from the ekstraksi service) to named document fields with
        per-field confidence.
      operationId: structure_v1_structuring_structure_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StructureRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructureResponse'
        '400':
          description: No usable text lines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 400
                status_desc: Bad Request
                message: No text lines to structure
                errors: No text lines to structure
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'body.lines: Field required'
                errors: VALIDATION_ERROR
      security:
      - APIKeyHeader: []
components:
  schemas:
    BoundingBox:
      properties:
        x1:
          type: number
          title: X1
        y1:
          type: number
          title: Y1
        x2:
          type: number
          title: X2
        y2:
          type: number
          title: Y2
      type: object
      required:
      - x1
      - y1
      - x2
      - y2
      title: BoundingBox
    ErrorResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          examples:
          - 400
        status_desc:
          type: string
          title: Status Desc
          examples:
          - Bad Request
        message:
          type: string
          title: Message
          examples:
          - Uploaded file is empty
        data:
          type: 'null'
          title: Data
        errors:
          type: string
          title: Errors
          examples:
          - Uploaded file is empty
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: Present when the error is tied to a known request_id
      type: object
      required:
      - status_code
      - status_desc
      - message
      - errors
      title: ErrorResponse
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          examples:
          - healthy
        version:
          type: string
          title: Version
          examples:
          - 1.0.0
        device:
          type: string
          title: Device
          examples:
          - cpu
        backends:
          additionalProperties:
            type: string
          type: object
          title: Backends
          description: Backend model aktif di service ini
          examples:
          - ekstraksi: paddle
      type: object
      required:
      - status
      - version
      - device
      - backends
      title: HealthResponse
    JobAccepted:
      properties:
        request_id:
          type: string
          title: Request Id
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        stage:
          type: string
          enum:
          - OCR
          - STRUCTURING
          - SCORING
          title: Stage
          examples:
          - OCR
        status:
          type: string
          enum:
          - PROCESSING
          - DONE
          - FAILED
          title: Status
          description: PROCESSING untuk job baru; status terkini kalau request_id ini sudah pernah dikirim
        duplicate:
          type: boolean
          title: Duplicate
          description: 'true: request_id ini sudah pernah diterima, kerja TIDAK dijalankan ulang (idempoten)'
          default: false
      type: object
      required:
      - request_id
      - stage
      - status
      title: JobAccepted
    JobAcceptedResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          default: 202
          examples:
          - 202
        status_desc:
          type: string
          title: Status Desc
          default: Accepted
          examples:
          - Accepted
        message:
          type: string
          title: Message
          default: Accepted
          examples:
          - Accepted
        errors:
          type: 'null'
          title: Errors
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        data:
          $ref: '#/components/schemas/JobAccepted'
      type: object
      required:
      - data
      title: JobAcceptedResponse
    JobStatus:
      properties:
        request_id:
          type: string
          title: Request Id
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        stage:
          type: string
          enum:
          - OCR
          - STRUCTURING
          - SCORING
          title: Stage
          examples:
          - OCR
        status:
          type: string
          enum:
          - PROCESSING
          - DONE
          - FAILED
          title: Status
          examples:
          - DONE
        result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Result
          description: Hasil tahap ini saat DONE; null selain itu
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
          description: Pesan kegagalan saat FAILED; null selain itu
        created_at:
          type: string
          title: Created At
          examples:
          - '2026-09-18T04:00:00+00:00'
        updated_at:
          type: string
          title: Updated At
          examples:
          - '2026-09-18T04:00:01+00:00'
      type: object
      required:
      - request_id
      - stage
      - status
      - created_at
      - updated_at
      title: JobStatus
    JobStatusResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          default: 200
          examples:
          - 200
        status_desc:
          type: string
          title: Status Desc
          default: OK
          examples:
          - OK
        message:
          type: string
          title: Message
          default: Success
          examples:
          - Success
        errors:
          type: 'null'
          title: Errors
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        data:
          $ref: '#/components/schemas/JobStatus'
      type: object
      required:
      - data
      title: JobStatusResponse
    OcrBlock:
      properties:
        text:
          type: string
          title: Text
          examples:
          - 'NPWP : 12.345.678.9-012.345'
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          default: 1.0
          examples:
          - 0.96
      additionalProperties: true
      type: object
      required:
      - text
      title: OcrBlock
    OcrPayload:
      properties:
        blocks:
          items:
            $ref: '#/components/schemas/OcrBlock'
          type: array
          title: Blocks
          description: Blok teks hasil OCR, urut atas ke bawah
      additionalProperties: true
      type: object
      required:
      - blocks
      title: OcrPayload
    ReadyResponse:
      properties:
        status:
          type: string
          enum:
          - ready
          - not_ready
          title: Status
          examples:
          - ready
        checks:
          additionalProperties:
            type: string
            enum:
            - ok
            - failed
          type: object
          title: Checks
          description: Dependensi wajib service ini, satu entri per dependensi
          examples:
          - database: ok
      type: object
      required:
      - status
      - checks
      title: ReadyResponse
    StructureRequest:
      properties:
        lines:
          items:
            $ref: '#/components/schemas/TextLine'
          type: array
          minItems: 1
          title: Lines
          description: Baris teks hasil OCR, urut atas ke bawah
      type: object
      required:
      - lines
      title: StructureRequest
    StructureResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          default: 200
          examples:
          - 200
        status_desc:
          type: string
          title: Status Desc
          default: OK
          examples:
          - OK
        message:
          type: string
          title: Message
          default: Success
          examples:
          - Success
        errors:
          type: 'null'
          title: Errors
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        data:
          $ref: '#/components/schemas/StructuredDocument'
      type: object
      required:
      - data
      title: StructureResponse
    StructuredDocument:
      properties:
        document_type:
          type: string
          title: Document Type
          examples:
          - npwp
        fields:
          additionalProperties:
            $ref: '#/components/schemas/StructuredField'
          type: object
          title: Fields
          description: Selalu berisi semua field dokumen (nomor_npwp, nama, nama_badan); yang tidak ditemukan
            bernilai null
      type: object
      required:
      - document_type
      - fields
      title: StructuredDocument
    StructuredField:
      properties:
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
          description: null kalau field tidak ditemukan
          examples:
          - 12.345.678.9-012.345
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          examples:
          - 0.96
        source:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
          description: Baris mentah asal nilai ini
          examples:
          - 'NPWP : 12.345.678.9-012.345'
        signals:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Signals
          description: 'Sinyal untuk payload scoring (backend `npwp_rules`): nomor_npwp -> `has_homoglyph`,
            `candidate_count`; nama / nama_badan -> `corrected`. null untuk backend `rule_based`'
          examples:
          - candidate_count: 2
            has_homoglyph: false
      type: object
      required:
      - confidence
      title: StructuredField
    StructuringJobRequest:
      properties:
        request_id:
          type: string
          minLength: 1
          title: Request Id
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        document_type:
          type: string
          title: Document Type
          default: npwp
          examples:
          - npwp
        guardrails:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Guardrails
          description: Hasil guardrails dari orkestrator; hanya diteruskan ke tahap berikutnya
        ocr:
          $ref: '#/components/schemas/OcrPayload'
          description: Hasil tahap OCR (`ocr.results`)
      type: object
      required:
      - request_id
      - ocr
      title: StructuringJobRequest
    TextLine:
      properties:
        text:
          type: string
          title: Text
          examples:
          - 95.844.800.1-805.000
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          default: 1.0
          examples:
          - 0.96
        bbox:
          anyOf:
          - $ref: '#/components/schemas/BoundingBox'
          - type: 'null'
          description: Posisi baris (`blocks[].bbox` dari service ekstraksi). Backend `npwp_rules` mencari
            nama dari jaraknya ke nomor NPWP; tanpa bbox posisi diturunkan dari urutan baris
        page:
          type: integer
          minimum: 0.0
          title: Page
          description: Indeks halaman 0-based
          default: 0
      type: object
      required:
      - text
      title: TextLine
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: API key for this service
      in: header
      name: X-API-Key
tags:
- name: Health
  description: Liveness check
- name: Pipeline
  description: 'Async pipeline stage: 202 + background work + callback + handoff'
- name: Structuring
  description: Raw text -> named fields, synchronous
