            by the orchestrator NPWP and each stage): `guardrails`, `extraction`, `structuring`, `scoring`,
            guardrails optional at the front and the end cut off, never one skipped in the middle. The
            last one ends the request: its result is the answer, as it is, and nothing is handed on. Omitted:
            the full pipeline'
          examples:
          - - guardrails
            - extraction
            - structuring
            - scoring
        column_confidence_threshold:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Column Confidence Threshold
          description: 'Per field, from the central orchestrator: the trust model''s probability that
            the field''s value is correct must reach it for the field''s `confidence` to be `1` (else
            `0`), always on the accept side. Keys: `all_field` (every field), `nomor_npwp`, `nama`; a
            field''s own key wins over `all_field`. A field left out (or the whole map omitted) gets that
            probability itself as `confidence`, a float from 0 to 1. Only carried on to scoring'
          examples:
          - nama: 0.5
            nomor_npwp: 0.9
      type: object
      required:
      - request_id
      title: StructuringJobRequest
    StructuringJobStatus:
      properties:
        request_id:
          type: string
          title: Request Id
          description: request_id of the pipeline run
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        stage:
          type: string
          const: STRUCTURING
          title: Stage
          description: Always `STRUCTURING` on this service
          default: STRUCTURING
          examples:
          - STRUCTURING
        status:
          type: string
          enum:
          - PROCESSING
          - DONE
          - FAILED
          title: Status
          description: '`PROCESSING` -> `DONE` | `FAILED`. A `FAILED` job may go back to `PROCESSING`
            when resubmitted'
          examples:
          - DONE
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
          description: Why the stage failed; null unless `status` is `FAILED`. Same text as the FAILED
            callback
          examples:
          - null
        created_at:
          type: string
          title: Created At
          description: When the job was first accepted (ISO 8601, UTC)
          examples:
          - '2026-09-18T04:00:00+00:00'
        updated_at:
          type: string
          title: Updated At
          description: Last status change (ISO 8601, UTC)
          examples:
          - '2026-09-18T04:00:01+00:00'
        pipeline_name_sequence:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Pipeline Name Sequence
          description: 'The services this request runs, as the job was submitted with them; the last one
            ends the request. Null for a job submitted without it: the full pipeline'
          examples:
          - - guardrails
            - extraction
            - structuring
            - scoring
        column_confidence_threshold:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Column Confidence Threshold
          description: 'The central orchestrator''s per-field thresholds the job was submitted with (`nomor_npwp`,
            `nama`; an `all_field` it sent is already spread over them); null when none were given: every
            field''s confidence is then the trust model''s probability'
          examples:
          - nama: 0.5
            nomor_npwp: 0.9
        guardrails:
          anyOf:
          - type: integer
          - type: number
          - type: 'null'
          title: Guardrails
          description: 'The `guardrails` of the request''s extract-ocr answer, from the guardrails report
            the job was submitted with: `0` when the document passed with the central orchestrator''s
            threshold, the model''s accepted probability when it sent none; null when guardrails did not
            run'
          examples:
          - 0.9821
        result:
          anyOf:
          - $ref: '#/components/schemas/StructuredDocument'
          - type: 'null'
          description: Structured fields once `status` is `DONE`; null otherwise
      type: object
      required:
      - request_id
      - status
      - created_at
      - updated_at
      title: StructuringJobStatus
    StructuringJobStatusResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          default: 200
          examples:
          - 200
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          default: OK
          examples:
          - OK
        message:
          type: string
          title: Message
          description: Human-readable outcome
          default: Success
          examples:
          - Success
        errors:
          type: 'null'
          title: Errors
          description: Always null on success
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: 'The request_id this response belongs to: the one sent in the form / body / path,
            otherwise the `X-Request-ID` header, otherwise one generated by the service'
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        data:
          $ref: '#/components/schemas/StructuringJobStatus'
      type: object
      required:
      - data
      title: StructuringJobStatusResponse
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: API key for this service
      in: header
      name: X-API-Key
tags:
- name: Pipeline
  description: 'Asynchronous pipeline stage: 202, background work, callback, hand-off'
- name: Callbacks
  description: Requests this service SENDS to the orchestrator (see Webhooks)
- name: Direct
  description: 'This stage alone on the previous stage''s output, synchronous: nothing recorded (QC)'
- name: Health
  description: Health and readiness checks; no API key
