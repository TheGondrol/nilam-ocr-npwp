[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-common"
version = "0.1.0"
description = "Kode bersama untuk service OCR NPWP (orchestrator, guardrails, extraction, structuring, scoring)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
db = ["sqlalchemy>=2.0", "greenlet>=3.0"]

[tool.setuptools.packages.find]
include = ["ocr_common*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ty.environment]
root = ["."]
extra-paths = ["."]

[tool.pyrefly]
search-path = ["."]

[tool.pyrefly.errors]
# Pydantic models narrow a field in a subclass (`stage: Literal["OCR"]` over `stage: str`); that is the
# intended schema, not an unsafe override.
bad-override-mutable-attribute = false
# yaml / openpyxl ship no type stubs; the libraries work, only their types are unknown.
untyped-import = false
# str()/int() around data from JSON or FastAPI (Any at runtime) are deliberate.
unnecessary-type-conversion = false
