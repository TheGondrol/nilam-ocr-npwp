# Recapture Detection Service Configuration

# Model Configuration
model:
  # Path to the trained ResNet-50 model file
  path: ./src/models/recapture_model.pth
  # Number of output classes for the model
  num_classes: 2
  # Preprocessing resize strategy — must match training (`resize_mode` in
  # configs/recapture.yaml of the model_training repo). One of:
  #   pad    : aspect-preserving + white padding to crop_size x crop_size (current default)
  #   crop   : aspect-preserving resize short side to crop_size*1.14 + CenterCrop
  #   squash : direct resize to (crop_size, crop_size), distorts aspect ratio
  resize_mode: pad
  # Padding fill value used when resize_mode=pad (0-255). 255 = white.
  pad_fill: 255
  # Center crop size (must match training: 224x224). Also used as the
  # target square size for pad/squash modes.
  crop_size: 224
  # Legacy short-side normalize size; only consumed by the deprecated
  # _resize_image_sync helper. NOT used in the active inference path.
  normalize_size: 512
  # ImageNet normalization statistics (must match training)
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]
  # Enable torch.compile for faster inference (PyTorch 2.0+ required)
  use_compile: true
  # Compile mode: 'default', 'reduce-overhead' (best for small batches), 'max-autotune'
  compile_mode: "reduce-overhead"

# Prediction Configuration
prediction:
  # Threshold for classification (0.0 - 1.0)
  # This threshold is used for logging/reference
  # Actual prediction is based on argmax of softmax probabilities
  threshold: 0.5
  # Maximum number of images allowed per batch request
  batch_max_files: 10

# Image Upload Configuration
image:
  # Maximum allowed size per uploaded image in megabytes
  max_size_mb: 1

# Server Configuration
server:
  # Host address to bind the server
  host: 0.0.0.0
  # Port number for the service
  port: 8000
  # Number of worker threads for async image processing
  thread_pool_workers: 4
  # CORS allowed origins
  cors_allowed_origins:
    - "https://api-bribrain.dev.example.com"
    - "https://api-brispot.dev.example.com"
    - "https://api-brispot-testing.dev.example.com"
    - "https://api-brispot-staging.dev.example.com"
    - "https://api-staging.example.com"
  # CORS allowed credentials
  cors_allowed_credentials: true
  # CORS allowed methods
  cors_allowed_methods: ["*"]
  # CORS allowed headers
  cors_allowed_headers: ["*"]

# Logging configuration
logging:
  # Logger name for the application
  logger_name: "recapture"
  log_to_database: true
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - [%(request_id)s] - %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
  file:
    enabled: true
    path: "logs/ocr_recapture.log"
    max_bytes: 10485760
    backup_count: 5
  console:
    enabled: true
    level: INFO

# Device Configuration
device:
  # Force CPU mode even if GPU is available (useful for testing)
  force_cpu: true

database:
  table_name: "bribrain_ocr_ktp_recapture"
  schema: "public"
  pool_size: 5
  max_overflow: 10
  pool_pre_ping: true
  pool_recycle: 3600
  pool_timeout: 10
  connect_timeout: 5

gcs:
  bucket_name: "gc-bribrain-dev-gcs-iguru-01"
  prefix: "ocr_models/recapture_models/"
  model_prefix: "recapture_model"

# MinIO Configuration
minio:
  bucket: bribrain-webviewasset-dev
  object: ocr_ktp_models/recapture_model.pth

# API Metadata
api:
  title: "Screen Recapture Detection API"
  description: "API for detecting recaptured screen photos vs original captures using ResNet-50"
  version: "1.0.0"

# Elastic APM Configuration
elastic_apm:
  enabled: true
  server_url: "${ELASTIC_APM_SERVER_URL}"
  service_name: "${ELASTIC_APM_SERVICE_NAME:-ocr-ktp-recapture-classifier}"
  environment: "${ELASTIC_APM_ENVIRONMENT:-dev}"
  secret_token: "${ELASTIC_APM_SECRET_TOKEN}"
  verify_server_cert: false

# Threshold provider — periodically refreshes thresholds from
# `ms-bribrain-manage-thservice` so model thresholds can be updated
# centrally without redeploying this service.
threshold_provider:
  refresh_interval_seconds: 3600 # how often to re-read from DB (seconds)
  table_name: "bribrain_model_thresholds"
  schema: "public"
  pool_size: 2
  max_overflow: 2
  pool_recycle: 3600
