[project]
name = "ocr-recapture"
version = "1.0.0"
description = "Screen Recapture Detection API using ResNet-50"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "python-multipart==0.0.6",
    "torch==2.2.0",
    "torchvision==0.17.0",
    "pillow==10.2.0",
    "numpy==1.26.0",
    "requests==2.31.0",
    "pydantic==2.5.3",
    "pyyaml==6.0.1",
    "psycopg-binary>=3.3.2",
    "sqlalchemy>=2.0.45",
    "psycopg>=3.3.2",
    "minio>=7.2.20",
    "asyncpg>=0.29.0",
    "mypy>=1.19.1",
    "google-auth>=2.48.0",
    "google-cloud-storage>=3.9.0",
    "elastic-apm>=6.20.0",
    "python-dotenv>=1.2.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.24.0,<0.27.0",
    "faker>=22.0.0",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests",
]
asyncio_mode = "auto"
