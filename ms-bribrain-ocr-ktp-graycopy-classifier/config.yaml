# Graycopy Detection Service Configuration

# Model Configuration
model:
  # Path to the trained ResNet-50 model file
  path: ./src/models/graycopy_model.pth
  # Image size for center crop (must match training: 224x224)
  image_size: 224
  # Normalize size for preprocessing (resize shorter side to this value before crop)
  normalize_size: 512
  # Dropout rate (should match training configuration)
  dropout_rate: 0.6
  # Normalization parameters (ImageNet standard)
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

# Prediction Configuration
prediction:
  # Threshold for classification (0.0 - 1.0)
  # This threshold is used for logging/reference
  # Actual prediction is based on argmax of softmax probabilities
  threshold: 0.5

# Server Configuration
server:
  # Host address to bind the server
  host: 0.0.0.0
  # Port number for the service (aligned with Dockerfile)
  port: 8040
  # Number of thread pool workers for CPU-bound operations
  thread_pool_workers: 4
  # Maximum uploaded image size in MB
  max_file_size_mb: 1

# CORS Configuration
cors:
  # Allowed origins (use ["*"] to allow all)
  allow_origins:
    - "https://api-bribrain.dev.example.com"
    - "https://api-brispot.dev.example.com"
    - "https://api-brispot-testing.dev.example.com"
    - "https://api-brispot-staging.dev.example.com"
    - "https://api-staging.example.com"
  # Allow credentials (cookies, authorization headers)
  allow_credentials: true
  # Allowed HTTP methods (use ["*"] to allow all)
  allow_methods:
    - "POST"
    - "GET"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  # Allowed headers (use ["*"] to allow all)
  allow_headers:
    - "*"

# Logging Configuration
logging:
  log_to_database: true
  # Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: INFO
  # Log file path
  file: logs/ocr_graycopy.log
  # Maximum log file size before rotation (in bytes, default: 10MB)
  max_bytes: 10485760
  # Number of backup log files to keep
  backup_count: 5

# Device Configuration
device:
  # Prefer GPU if available, fallback to CPU if not
  prefer_gpu: false
  # Force CPU usage even if GPU is available
  force_cpu: true
  # Enable torch.compile() optimization for CUDA devices (PyTorch 2.0+)
  # Improves inference performance by compiling the model
  compile_model: true
  # Enable JIT (TorchScript) optimization for CPU devices
  # Improves CPU inference performance via torch.jit.trace
  use_jit_cpu: true
  # Compilation mode:
  #   'default' - Safe and compatible
  #   'reduce-overhead' - Optimized for production performance (recommended)
  #   'max-autotune' - Maximum optimization (slower compilation)
  compile_mode: reduce-overhead

minio:
  bucket: bribrain-webviewasset-dev
  object: ocr_ktp_models/graycopy_model.pth

gcs:
  bucket: gc-bribrain-dev-gcs-iguru-01
  prefix: ocr_models/graycopy_models/
  model_prefix: graycopy_model

database:
  pool_size: 5
  max_overflow: 10
  pool_pre_ping: true
  pool_recycle: 3600
  pool_timeout: 10
  connect_timeout: 5

# Elastic APM Configuration
elastic_apm:
  enabled: true
  server_url: "${ELASTIC_APM_SERVER_URL}"
  service_name: "${ELASTIC_APM_SERVICE_NAME:-ocr-ktp-graycopy-classifier}"
  environment: "${ELASTIC_APM_ENVIRONMENT:-dev}"
  secret_token: "${ELASTIC_APM_SECRET_TOKEN}"
  verify_server_cert: false

# Threshold provider — periodically refreshes thresholds from
# `ms-bribrain-manage-thservice` so model thresholds can be updated
# centrally without redeploying this service.
threshold_provider:
  refresh_interval_seconds: 3600   # how often to re-read from DB (seconds)
  table_name: "bribrain_model_thresholds"
  schema: "public"
  pool_size: 2
  max_overflow: 2
  pool_recycle: 3600
