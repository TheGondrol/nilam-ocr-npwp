[project]
name = "ocr-graycopy"
version = "1.0.0"
description = "FastAPI service for graycopy/photocopy detection using ResNet-50"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "python-multipart==0.0.6",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "Pillow==10.2.0",
    "numpy>=1.26.0",
    "requests==2.31.0",
    "pydantic==2.5.3",
    "PyYAML==6.0.1",
    "psycopg-binary>=3.3.2",
    "sqlalchemy>=2.0.45",
    "psycopg>=3.3.2",
    "python-dotenv>=1.0.0",
    "ruff>=0.14.10",
    "minio>=7.2.20",
    "asyncpg>=0.29.0",
    "mypy>=1.19.1",
    "google-cloud-storage>=3.9.0",
    "google-auth>=2.48.0",
    "elastic-apm>=6.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests (requires running service or real model)",
]
