# Lamination Detection Service Configuration

# Model Configuration
model:
  # Path to the trained model file
  path: ./src/models/laminate_model.pth
  # Input image size for the model
  image_size: 224
  # Enable torch.compile for faster inference (requires PyTorch 2.0+)
  # Note: First inference will be slower due to compilation
  torch_compile: true

# Prediction Configuration
prediction:
  # Threshold for classification (0.0 - 1.0)
  # Values above this threshold are classified as UNLAMINATED (spoof)
  # Values below this threshold are classified as LAMINATED (genuine)
  threshold: 0.5

# Server Configuration
server:
  # Host address to bind the server
  host: 0.0.0.0
  # Port number for the service
  port: 8000
  # Thread pool workers for image processing
  thread_pool_workers: 4
  # Maximum file size in MB
  max_file_size_mb: 1
  # Maximum images per batch request
  max_batch_size: 10

# CORS Configuration
cors:
  # Allowed origins (use ["*"] to allow all)
  allow_origins:
    - "https://api-bribrain.dev.example.com"
    - "https://api-brispot.dev.example.com"
    - "https://api-brispot-testing.dev.example.com"
    - "https://api-brispot-staging.dev.example.com"
    - "https://api-staging.example.com"
  # Allow credentials (cookies, authorization headers)
  allow_credentials: true
  # Allowed HTTP methods (use ["*"] to allow all)
  allow_methods:
    - "POST"
    - "GET"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  # Allowed headers (use ["*"] to allow all)
  allow_headers:
    - "*"

# Logging Configuration
logging:
  # Log to database
  log_to_database: true
  # Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: INFO
  # Log format
  format: "%(asctime)s - %(name)s - %(levelname)s - [%(request_id)s] - %(message)s"
  # File logging configuration
  file:
    enabled: true
    directory: ./logs
    filename: "ocr_laminate.log"
    # Maximum file size in bytes (10MB)
    max_bytes: 10485760
    # Number of backup files to keep
    backup_count: 5

# Device Configuration
device:
  # Prefer GPU if available
  prefer_gpu: true
  # Force CPU mode (overrides prefer_gpu)
  force_cpu: false

#Minio Configuration
minio:
  bucket: bribrain-webviewasset-dev
  object: ocr_ktp_models/laminate_model.pth

# Database Configuration
database:
  pool_size: 5
  max_overflow: 10
  pool_pre_ping: true
  pool_recycle: 3600
  pool_timeout: 10
  connect_timeout: 5

gcs:
  bucket_name: "gc-bribrain-dev-gcs-iguru-01"
  prefix: "ocr_models/laminate_models/"
  model_prefix: "laminate_model"

# Elastic APM Configuration
elastic_apm:
  enabled: true
  server_url: "${ELASTIC_APM_SERVER_URL}"
  service_name: "${ELASTIC_APM_SERVICE_NAME:-ocr-ktp-laminate-classifier}"
  environment: "${ELASTIC_APM_ENVIRONMENT:-dev}"
  secret_token: "${ELASTIC_APM_SECRET_TOKEN}"
  verify_server_cert: false

# Threshold provider — periodically refreshes thresholds from
# `ms-bribrain-manage-thservice` so model thresholds can be updated
# centrally without redeploying this service.
threshold_provider:
  refresh_interval_seconds: 3600   # how often to re-read from DB (seconds)
  table_name: "bribrain_model_thresholds"
  schema: "public"
  pool_size: 2
  max_overflow: 2
  pool_recycle: 3600
