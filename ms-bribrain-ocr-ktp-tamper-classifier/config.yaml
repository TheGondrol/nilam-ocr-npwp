# Tamper Detection Service Configuration

# Model Configuration
model:
  path: ./src/models/tamper_model/
  file_path: ./src/models/tamper_model/model.safetensors
  # Image size for preprocessing (must match training)
  image_size: 320

# Device Configuration
device:
  # Force CPU usage even if GPU is available (useful for testing or deployment)
  force_cpu: true

# Prediction Configuration
prediction:
  # Threshold for classification (0.0 - 1.0)
  # This threshold is used for logging/reference
  # Actual prediction is based on argmax of softmax probabilities
  threshold: 0.5
  # Maximum number of files allowed per batch request
  batch_size_limit: 10

# Image Upload Configuration
image:
  # Maximum uploaded image size in MB
  max_size_mb: 1

# Server Configuration
server:
  # Host address to bind the server
  host: 0.0.0.0
  # Port number for the service
  port: 8000

# CORS Configuration
cors:
  # Allowed origins (use ["*"] to allow all)
  allow_origins:
    - "https://api-bribrain.dev.example.com"
    - "https://api-brispot.dev.example.com"
    - "https://api-brispot-testing.dev.example.com"
    - "https://api-brispot-staging.dev.example.com"
    - "https://api-staging.example.com"
  # Allow credentials (cookies, authorization headers)
  allow_credentials: true
  # Allowed HTTP methods (use ["*"] to allow all)
  allow_methods:
    - "POST"
    - "GET"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  # Allowed headers (use ["*"] to allow all)
  allow_headers:
    - "*"

# Logging Configuration
logging:
  log_to_database: true
  # Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: INFO
  # Log file path (directory will be created if not exists)
  file: ./logs/ocr_tamper.log
  # Maximum log file size before rotation (in bytes, 10MB default)
  max_bytes: 10485760
  # Number of backup log files to keep
  backup_count: 5
  # Log message format
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

database:
  pool_size: 5
  max_overflow: 10
  pool_pre_ping: true
  pool_recycle: 3600
  pool_timeout: 10
  connect_timeout: 5

gcs:
  bucket_name: "gc-bribrain-dev-gcs-iguru-01"
  prefix: "ocr_models/tamper_models/"
  model_prefix: "tamper_model"

minio:
  bucket: bribrain-webviewasset-dev
  object: ocr_ktp_models/tamper_model.safetensors

# Elastic APM Configuration
elastic_apm:
  enabled: true
  server_url: "${ELASTIC_APM_SERVER_URL:-}"
  service_name: "${ELASTIC_APM_SERVICE_NAME:-ocr-ktp-tamper-classifier}"
  environment: "${ELASTIC_APM_ENVIRONMENT:-dev}"
  secret_token: "${ELASTIC_APM_SECRET_TOKEN:-}"
  verify_server_cert: false

# Threshold provider — periodically refreshes thresholds from
# `ms-bribrain-manage-thservice` so model thresholds can be updated
# centrally without redeploying this service.
threshold_provider:
  refresh_interval_seconds: 3600   # how often to re-read from DB (seconds)
  table_name: "bribrain_model_thresholds"
  schema: "public"
  pool_size: 2
  max_overflow: 2
  pool_recycle: 3600
