name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/*/requirements.txt
            libs/ocr_common/pyproject.toml
      - run: python -m pip install -r requirements-dev.txt
      - run: make lint
      - run: python -m ruff format --check .
      - run: make typecheck
      - run: make test

  image:
    name: Image ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: guardrails
            port: 8031
            env: -e GUARDRAILS_BACKEND=mock
          - service: ekstraksi
            port: 8030
            env: -e EKSTRAKSI_BACKEND=mock
          - service: structuring
            port: 8032
            env: ""
          - service: scoring
            port: 8033
            env: ""
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder weights (the checkpoint is not in git; this image is never pushed)
        if: matrix.service == 'guardrails'
        run: touch services/guardrails/weights/best_model.pt
      - name: Build
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t ci/${{ matrix.service }} .
      - name: Starts, then stops gracefully on SIGTERM
        run: |
          cid=$(docker run -d -e API_KEY=ci -e ENVIRONMENT=local ${{ matrix.env }} ci/${{ matrix.service }})
          healthy=""
          for _ in $(seq 1 60); do
            if docker exec "$cid" python -c "import urllib.request; urllib.request.urlopen('http://localhost:${{ matrix.port }}/health', timeout=2)"; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ -z "$healthy" ]; then docker logs "$cid"; exit 1; fi
          docker stop -t 20 "$cid"
          docker logs "$cid" 2>&1 | tail -5
          code=$(docker inspect -f '{{.State.ExitCode}}' "$cid")
          if [ "$code" != 0 ]; then echo "exit code $code: SIGTERM did not reach uvicorn"; exit 1; fi
