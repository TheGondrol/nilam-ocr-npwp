# OCR Postprocess Configuration

# Threshold values for fuzzy matching and confidence
thresholds:
  partial: 75
  ratio: 80
  confidence: 0.8

# Regex patterns for text extraction
regex:
  AMBIL_DIGIT: "\\d+"
  AMBIL_HURUF: "[A-Za-z]+"
  AMBIL_KATA_KAPITAL: "([A-Z]{2,}.*)"
  AMBIL_KOMA_TITIK: "[,.]"
  AMBIL_SATU_DIGIT: "\\d"
  AMBIL_NON_ALFANUMERIK: "[^a-zA-Z0-9]"
  AMBIL_KAPITAL_DENGAN_KHUSUS: "[A-Z][A-Z\\.\\- ]+"
  AMBIL_TITIK_SEBELUM_KAPITAL: "\\.(?=[A-Z])"
  AMBIL_DUA_DIGIT_ALFANUMERIK_DASH: "\\b\\d{2}[A-Za-z0-9\\-]*"
  AMBIL_NON_HURUF_AWAL: "^[^A-Za-z]+"
  AMBIL_KONTEN_SETELAH_COLON: "[：:]\\s*(\\S+)"
  AMBIL_HURUF_SPASI: "([A-Za-z\\s]+)"
  AMBIL_HURUF_LALU_DIGIT: "([A-Za-z]+)(\\d+)"
  AMBIL_HURUF_LALU_TANGGAL: "([A-Za-z]+)([\\d\\-\\/\\.]+)"
  AMBIL_FORMAT_TANGGAL1: "([A-Za-z]+)(\\d{2})[\\/\\-.](\\d{2})[\\/\\-.](\\d{4})"
  AMBIL_FORMAT_TANGGAL2: "([A-Za-z]+)[\\s\\.\\-]?(\\d{2})(\\d{2})[\\/\\-.](\\d{4})"
  AMBIL_COLON_SPASI_AWAL: "^[:\\s]+"
  AMBIL_NON_ALFANUMERIK_SPASI: "[^A-Za-z0-9\\s]"
  AMBIL_KATA_KAPITAL_BATAS: "\\b([A-Z][A-Z]+.*)"
  AMBIL_PEMISAH: "[ /,\\-\\.]+"
  AMBIL_NON_DIGIT: "\\D"
  AMBIL_SPASI: "\\s+"
  AMBIL_KAPITAL_KHUSUS: "[A-Z][A-Z\\.\\- ]+"
  AMBIL_COLON_APAPUN: "[：:]\\s*(.*)"
  AMBIL_TANDA_BACA: "[,.-]"
  AMBIL_MINIMAL_DUA_KAPITAL: "[A-Z]{2,}"
  AMBIL_DUA_KAPITAL_LALU_HURUF: "[A-Z]{2}[A-Za-z]+"
  AMBIL_KAPITAL_LOOKAHEAD: "[A-Z]{2,}.*?(?=\\s+Jen|$)"
  AMBIL_BUKAN_DIGIT_SLASH_SEBELUM_DIGIT: "[^0-9/](?=\\d)"
  AMBIL_KAPITAL_HURUF_TITIK: "([A-Z]{2,}[A-Za-z\\.]*)"
  AMBIL_DUA_DIGIT_ALFANUMERIK: "\\b\\d{2}[A-Za-z0-9]*"
  AMBIL_KAPITAL_QUOTES: "([A-Z]{2,}[A-Za-z\\.'\\\"]*)"

# CORS Configuration
cors:
  # Allowed origins (use ["*"] to allow all)
  allow_origins:
    - "https://api-bribrain.dev.example.com"
    - "https://api-brispot.dev.example.com"
    - "https://api-brispot-testing.dev.example.com"
    - "https://api-brispot-staging.dev.example.com"
    - "https://api-staging.example.com"
  # Allow credentials (cookies, authorization headers)
  allow_credentials: true
  # Allowed HTTP methods (use ["*"] to allow all)
  allow_methods:
    - "POST"
    - "GET"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  # Allowed headers (use ["*"] to allow all)
  allow_headers:
    - "*"

# Logging configuration
logging:
  insert_to_database: true
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - [%(request_id)s] - %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
  file:
    enabled: true
    path: "logs/ocr_postprocess.log"
    max_bytes: 10485760
    backup_count: 5
  console:
    enabled: true
    level: INFO

# API configuration
api:
  title: "OCR Postprocess API"
  description: "API for post-processing OCR text extraction from KTP"
  version: "1.0.0"
  host: "0.0.0.0"
  port: 8000
  timeout_keep_alive: 60
database:
  table_name: "bribrain_ocr_ktp_postprocessor"
  schema: "public"
  pool_size: 5
  max_overflow: 10
  pool_pre_ping: true
  pool_recycle: 3600
  pool_timeout: 10
  connect_timeout: 5

# KTP Field Constants
