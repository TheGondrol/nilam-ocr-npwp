# Error messages
messages:
  glare: "glare"
  blur: "blur"
  rotated: "tidak sejajar"

# Character correction mappings for OCR
character_mappings:
  # Alphabet to digit corrections (when between digits)
  alphabet_to_digit:
    "O": "0"
    "o": "0"
    "A": "4"
    "q": "9"
    "l": "1"
    "z": "2"
    "Z": "2"
    "I": "1"
    "B": "8"
    "S": "5"
    "s": "5"
    "G": "6"
    "g": "9"
    "E": "3"
    "e": "3"
    "b": "6"
    "P": "9"
    "D": "0"
    "Q": "9"
    "C": "0"
    "c": "0"
    "L": "1"
    "T": "7"

  # Digit to alphabet corrections (when between letters)
  digit_to_alphabet:
    "0": "O"
    "4": "A"
    "9": "P"
    "1": "I"
    "2": "Z"
    "8": "B"
    "5": "S"
    "6": "G"
    "3": "e"
    "7": "T"

  # Symbol corrections (when between digits)
  symbol_to_digit:
    "+": "7"
    "[": "1"
    "]": "1"
    "!": "1"
    "|": "1"
    "/": "1"
    "\\": "1"
    "&": "8"
    "?": "7"

# Elastic APM Configuration
elastic_apm:
  enabled: true
  server_url: "${ELASTIC_APM_SERVER_URL}"
  service_name: "${ELASTIC_APM_SERVICE_NAME:-ocr-ktp-postprocessor}"
  environment: "${ELASTIC_APM_ENVIRONMENT:-dev}"
  secret_token: "${ELASTIC_APM_SECRET_TOKEN}"
  verify_server_cert: false

# Threshold provider — periodically refreshes thresholds from
# `ms-bribrain-manage-thservice` so model thresholds can be updated
# centrally without redeploying this service.
threshold_provider:
  refresh_interval_seconds: 3600 # how often to re-read from DB (seconds)
  table_name: "bribrain_model_thresholds"
  schema: "public"
  pool_size: 2
  max_overflow: 2
  pool_recycle: 3600
