        errors:
          anyOf:
          - type: string
          - type: 'null'
          title: Errors
          description: Failure code when the request failed or was refused; null otherwise
          examples:
          - null
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: The request_id this response belongs to
        document_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Type
          description: Document type of the request
          examples:
          - npwp
        job_status:
          anyOf:
