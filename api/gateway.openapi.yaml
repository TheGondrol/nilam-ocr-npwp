          examples:
          - 412.5
        full_text:
          type: string
          title: Full Text
          description: All blocks joined by newline, in reading order
          examples:
          - 'DIREKTORAT JENDERAL PAJAK

            NPWP : 12.345.678.9-012.345

            BUDI SANTOSO'
        blocks:
          items:
            $ref: '#/components/schemas/TextBlock'
          type: array
          title: Blocks
          description: Text lines in reading order (top to bottom)
