openapi: 3.1.0
info:
  title: 'NILAM OCR NPWP: gateway integration API'
  version: 1.0.0
  description: "Everything the gateway / orchestrator needs to integrate the NPWP OCR pipeline, merged\
    \ from the four\nservices' own specs. Each service also serves its full Swagger UI at `/docs`.\n\n\
    ## The flow\n\n1. **`POST /v1/guardrails/check`** on the *guardrails* service, synchronous. `data.passed:\
    \ false` ->\n   stop and answer the client with `data.reason`. `data.passed: true` -> go on.\n2. **`POST\
    \ /v1/ekstraksi/jobs`** on the *ekstraksi* service with your `request_id`, the document\n   (`file`\
    \ or `file_url`), and the guardrails `data` from step 1 as the `guardrails` form field.\n   It answers\
    \ **202** at once. You are done calling.\n3. **Receive callbacks** (see *Webhooks*): `OCR` -> `STRUCTURING`\
    \ -> `SCORING`, each `DONE` or\n   `FAILED`. The `SCORING` / `DONE` callback carries the **final result**.\
    \ A `FAILED` callback of any\n   stage ends the request.\n4. **Reconcile when needed** with `GET /v1/<stage>/jobs/{request_id}`\
    \ on the stage's own service.\n\nTime a request out on your side: a stage that crashes mid-job cannot\
    \ send its callback.\n\n## What the result is, and is not\n\n`fields` holds `nomor_npwp`, `nama`,\
    \ `nama_badan`. `scoring` holds `npwp_confidence` and\n`name_confidence`: the probability, from the\
    \ ML team's trust model, that each extracted field is\ncorrect. There is **no document-level score\
    \ and no approve / reject decision**; thresholds are yours.\n\n## Addresses\n\nEach operation lists\
    \ the servers of the service that owns it. Inside GKE, from another namespace:\n`http://<service>.nilam-ocr-<environment>.svc.cluster.local:<port>`\
    \ with guardrails `8031`,\nekstraksi `8030`, structuring `8032`, scoring `8033`. Nothing is exposed\
    \ outside the cluster.\n\n\n## Conventions (the same for every nilam-ocr service)\n\n**Authentication.**\
    \ Every endpoint except `/health` and `/ready` requires the header `X-API-Key`.\nA missing or wrong\
    \ key answers `401`. The services are reachable only from inside the cluster.\n\n**Envelope.** Every\
    \ JSON response, success or error, has the same shape:\n`{status_code, status_desc, message, data,\
    \ errors, request_id}`. `status_code` always equals the HTTP\nstatus. On success `errors` is null;\
    \ on error `data` is null.\n\n**Errors.** `errors` is machine-readable: `VALIDATION_ERROR` for `422`,\
    \ otherwise the same text as\n`message`. `400` = the request or the document is unusable (do not retry\
    \ unchanged). `401` = API key.\n`404` = unknown request_id. `409` = request_id already processed (legacy\
    \ contract only). `422` = a\nfield is missing or has the wrong type. `500` = this service or its model\
    \ failed. `503` = a\ndependency is unreachable, `504` = it did not answer in time (both are safe to\
    \ retry).\n\n**request_id.** Minted by the orchestrator and carried through every stage. Where an\
    \ endpoint has no\nrequest_id of its own, the `X-Request-ID` request header is used (and echoed in\
    \ the response header);\nwithout it the service generates one.\n\n**Asynchronous stages.** `POST .../jobs`\
    \ answers `202` immediately and does the work in the\nbackground. The outcome is reported by a callback\
    \ to the orchestrator (see *Webhooks*), and can be\nread at any time with `GET .../jobs/{request_id}`.\
    \ Submitting the same request_id again is idempotent:\n`202` with `duplicate: true`, the work is not\
    \ repeated, unless the earlier attempt `FAILED`. Because\nthe request was already answered `202`,\
    \ a problem with the document itself (unreadable file, no text,\nunsupported document type) shows\
    \ up as a `FAILED` job and callback, not as a `4xx`.\n"
tags:
- name: 1. Guardrails (synchronous)
  description: Ask whether the document may be processed at all.
- name: 2. Start the pipeline (asynchronous)
  description: One call starts OCR -> structuring -> scoring. Answers 202; the rest arrives by callback.
- name: 3. Callbacks (you implement this)
  description: 'Listed under **Webhooks**: the request each stage sends to you when it finishes.'
- name: 4. Reconciliation
  description: Read a stage's status and result directly, e.g. after a missed callback or a timeout.
- name: Legacy synchronous contract (deprecated)
  description: generate-request-id -> extract-ocr -> get-ocr-result. Kept until the move to the async
    flow.
paths:
  /v1/guardrails/check:
    post:
      tags:
      - 1. Guardrails (synchronous)
      summary: Decide whether a document may proceed to OCR
      description: '**Step 1 of the pipeline, synchronous.** Call this first; submit the OCR job only
        when `data.passed` is true, and pass this response''s `data` along as the `guardrails` form field
        of `POST /v1/ekstraksi/jobs`.


        Runs the guardrails model on each page (a PDF is rendered page by page; an image is one page)
        and aggregates a document verdict. The model is either in this process (`efficientnet`) or the
        ML team''s model service (`remote`, POST /v1/predict/json); the response is the same either way.
        Always returns 200 with a report; `data.passed` tells whether the document should proceed to OCR,
        and `data.reason` says why not (the orchestrator answers 422 with it). The orchestrator forwards
        `data` to the OCR service as the guardrails result.


        Send `request_id` plus the document as `file`, or as `file_url` and this service fetches it itself;
        exactly one of the two.'
      operationId: checkGuardrails
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_checkGuardrails'
        required: true
      responses:
        '200':
          description: 'The document was judged. Always 200, accepted or not: read `data.passed`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardrailCheckResponse'
              examples:
                accepted:
                  summary: 'Accepted: proceed to OCR'
                  value:
                    status_code: 200
                    status_desc: OK
                    message: OK
                    data:
                      passed: true
                      document:
                        verdict: accepted
                        confidence: 0.9821
                        n_pages: 1
                        n_approve: 1
                        n_reject: 0
                      pages:
                      - page_index: 0
                        proba_approve: 0.9821
                        proba_reject: 0.0179
                        verdict: accepted
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                rejected:
                  summary: 'Rejected: stop and answer the client with `reason`'
                  value:
                    status_code: 200
                    status_desc: OK
                    message: OK
                    data:
                      passed: false
                      reason: 'Document rejected by guardrails: 1/1 page(s) rejected (confidence 0.88)'
                      document:
                        verdict: reject
                        confidence: 0.8821
                        n_pages: 1
                        n_approve: 0
                        n_reject: 1
                      pages:
                      - page_index: 0
                        proba_approve: 0.1179
                        proba_reject: 0.8821
                        verdict: reject
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pdf_one_bad_page:
                  summary: 'PDF with one rejected page: the whole document is rejected (policy `all`)'
                  value:
                    status_code: 200
                    status_desc: OK
                    message: OK
                    data:
                      passed: false
                      reason: 'Document rejected by guardrails: 1/2 page(s) rejected (confidence 0.70)'
                      document:
                        verdict: reject
                        confidence: 0.7
                        n_pages: 2
                        n_approve: 1
                        n_reject: 1
                      pages:
                      - page_index: 0
                        proba_approve: 0.9821
                        proba_reject: 0.0179
                        verdict: accepted
                      - page_index: 1
                        proba_approve: 0.3
                        proba_reject: 0.7
                        verdict: reject
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
        '400':
          description: Bad file (empty, too large, unsupported type, unreadable) or bad intake
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 400
                status_desc: Bad Request
                message: Uploaded file is empty
                errors: Uploaded file is empty
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'body.request_id: Field required'
                errors: VALIDATION_ERROR
        '500':
          description: Guardrails model service failed or answered in an unexpected shape (backend `remote`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 500
                status_desc: Internal Server Error
                message: guardrails model returned an unexpected response
                errors: guardrails model returned an unexpected response
        '503':
          description: Guardrails model service unreachable (backend `remote`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 503
                status_desc: Service Unavailable
                message: guardrails model is unavailable
                errors: guardrails model is unavailable
        '504':
          description: Guardrails model service did not answer in time (backend `remote`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 504
                status_desc: Gateway Timeout
                message: guardrails model timed out after 30.0s
                errors: guardrails model timed out after 30.0s
      security:
      - APIKeyHeader: []
      servers:
      - url: http://guardrails.nilam-ocr-{environment}.svc.cluster.local:8031
        description: GKE, from another namespace (e.g. the orchestrator / gateway)
        variables:
          environment:
            enum:
            - dev
            - staging
            - production
            default: dev
            description: 'One namespace per environment: nilam-ocr-<environment>'
      - url: http://guardrails:8031
        description: GKE from the same namespace, or the Docker Compose network
      - url: http://127.0.0.1:8031
        description: Local development
  /v1/ekstraksi/jobs:
    post:
      tags:
      - 2. Start the pipeline (asynchronous)
      summary: Start the pipeline for a document (OCR stage)
      description: '**Step 2 of the pipeline, asynchronous: the entry point of the OCR -> structuring
        -> scoring chain.** Call it after `POST /v1/guardrails/check` answered `passed: true`.


        Records the job (`ocr_jobs`, idempotent per request_id), answers **202 immediately**, then in
        the background: reads the document (`file`, or downloads `file_url`), runs OCR, stores the result
        (`ocr_results`), POSTs the `OCR` callback, and hands the job to the structuring service, which
        hands it to scoring. The caller does nothing more: it receives one callback per stage, and the
        final result in the `SCORING` callback (see *Webhooks*).


        **Document.** Send `file` (multipart) or `file_url`, exactly one. JPEG, PNG or PDF, at most 5
        MB. `file_url` is downloaded in the background, so make a presigned URL live longer than the worst
        queueing time; an expired or unreachable URL becomes a `FAILED` job, not a `4xx`.


        **Idempotency.** The same request_id again answers `202` with `duplicate: true` and does not run
        OCR twice, unless the earlier attempt `FAILED`, in which case it is run again.'
      operationId: submitOcrJob
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_submitOcrJob'
        required: true
      responses:
        '202':
          description: The job was accepted (or already existed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
              examples:
                accepted:
                  summary: New job
                  value:
                    status_code: 202
                    status_desc: Accepted
                    message: Accepted
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: OCR
                      status: PROCESSING
                      duplicate: false
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                duplicate:
                  summary: 'Same request_id sent again: nothing is re-run, `status` is the existing job''s
                    status'
                  value:
                    status_code: 202
                    status_desc: Accepted
                    message: Accepted
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: OCR
                      status: DONE
                      duplicate: true
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '400':
          description: Neither or both of file / file_url, or `guardrails` is not a JSON object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 400
                status_desc: Bad Request
                message: Send exactly one of file or file_url
                errors: Send exactly one of file or file_url
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'body.request_id: Field required'
                errors: VALIDATION_ERROR
      security:
      - APIKeyHeader: []
      servers: &id001
      - url: http://ekstraksi.nilam-ocr-{environment}.svc.cluster.local:8030
        description: GKE, from another namespace (e.g. the orchestrator / gateway)
        variables:
          environment:
            enum:
            - dev
            - staging
            - production
            default: dev
            description: 'One namespace per environment: nilam-ocr-<environment>'
      - url: http://ekstraksi:8030
        description: GKE from the same namespace, or the Docker Compose network
      - url: http://127.0.0.1:8030
        description: Local development
  /v1/ekstraksi/jobs/{request_id}:
    get:
      tags:
      - 4. Reconciliation
      summary: Status and result of the OCR stage
      description: Status of this stage only, and its raw OCR result once `DONE`. The orchestrator normally
        learns the status from the callback; use this to reconcile after a missed callback, or to debug.
        The later stages have the same endpoint on their own service (`/v1/structuring/jobs/{request_id}`,
        `/v1/scoring/jobs/{request_id}`).
      operationId: getOcrJob
      security:
      - APIKeyHeader: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      responses:
        '200':
          description: The job exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrJobStatusResponse'
              examples:
                processing:
                  summary: Still running
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: OCR
                      created_at: '2026-09-18T04:00:00+00:00'
                      status: PROCESSING
                      updated_at: '2026-09-18T04:00:00+00:00'
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                done:
                  summary: Finished
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: OCR
                      created_at: '2026-09-18T04:00:00+00:00'
                      status: DONE
                      result:
                        engine: paddle
                        model: PP-OCRv6_medium_det+PP-OCRv6_medium_rec
                        elapsed_ms: 412.5
                        full_text: 'DIREKTORAT JENDERAL PAJAK

                          NPWP : 12.345.678.9-012.345

                          BUDI SANTOSO'
                        blocks:
                        - text: DIREKTORAT JENDERAL PAJAK
                          confidence: 0.9985
                          bbox:
                            x1: 175
                            y1: 247
                            x2: 887
                            y2: 308
                          page: 0
                        - text: 'NPWP : 12.345.678.9-012.345'
                          confidence: 0.9992
                          bbox:
                            x1: 35
                            y1: 389
                            x2: 637
                            y2: 437
                          page: 0
                        - text: BUDI SANTOSO
                          confidence: 0.9773
                          bbox:
                            x1: 33
                            y1: 480
                            x2: 483
                            y2: 523
                          page: 0
                      updated_at: '2026-09-18T04:00:01+00:00'
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                failed:
                  summary: 'Failed: same `error_message` as the FAILED callback. Resubmitting the request_id
                    runs it again'
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: OCR
                      created_at: '2026-09-18T04:00:00+00:00'
                      status: FAILED
                      error_message: ekstraksi OCR model is unavailable
                      updated_at: '2026-09-18T04:00:03+00:00'
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No OCR job for this request_id
          content:
            application/json:
              example:
                status_code: 404
                status_desc: Not Found
                message: 'No OCR job found for request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0'
                errors: 'No OCR job found for request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0'
                request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'path.request_id: Field required'
                errors: VALIDATION_ERROR
                request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      servers: *id001
  /v1/generate-request-id:
    post:
      tags:
      - Legacy synchronous contract (deprecated)
      summary: 'Legacy: mint a request_id'
      description: '**Legacy synchronous contract**, kept until the orchestrator has moved to the asynchronous
        pipeline (`POST /v1/ekstraksi/jobs`). Mints a request_id that must be used once in POST /v1/extract-ocr.
        In the asynchronous pipeline the orchestrator mints the request_id itself.'
      operationId: generateRequestId
      responses:
        '200':
          description: A new request_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateRequestIdResponse'
              examples:
                minted:
                  summary: Use it once in POST /v1/extract-ocr
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
      deprecated: true
      security:
      - APIKeyHeader: []
      servers: *id001
  /v1/extract-ocr:
    post:
      tags:
      - Legacy synchronous contract (deprecated)
      summary: 'Legacy: run the whole chain synchronously'
      description: '**Legacy synchronous contract**, kept until the orchestrator has moved to the asynchronous
        pipeline (`POST /v1/ekstraksi/jobs`). Runs the full pipeline (guardrails service -> this service''s
        OCR -> structuring service -> scoring service) on the uploaded NPWP image for the given request_id
        (from /v1/generate-request-id). A request_id can only be submitted once.


        Send the image as `file`, or send `file_url` and this service fetches it itself; exactly one of
        the two.'
      operationId: extractOcr
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_extractOcr'
        required: true
      responses:
        '200':
          description: The document was read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              examples:
                person:
                  summary: A person's card
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      nomor_npwp:
                        value: 12.345.678.9-012.345
                        confidence: 0.9992
                      nama:
                        value: BUDI SANTOSO
                        confidence: 0.9773
                      nama_badan:
                        confidence: 0.0
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                    guardrails: 0.9904
        '400':
          description: Unknown request_id, bad file, or rejected by guardrails
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 400
                status_desc: Bad Request
                message: 'Document rejected by guardrails: 1/1 page(s) rejected (confidence 0.88)'
                errors: 'Document rejected by guardrails: 1/1 page(s) rejected (confidence 0.88)'
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
        '409':
          description: request_id was already processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 409
                status_desc: Conflict
                message: request_id OCR_9cb01af2-493d-446d-b191-af120333f6d0 has already been processed
                errors: request_id OCR_9cb01af2-493d-446d-b191-af120333f6d0 has already been processed
        '500':
          description: OCR engine or a downstream stage failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 500
                status_desc: Internal Server Error
                message: Internal server error while processing OCR
                errors: Internal server error while processing OCR
        '503':
          description: OCR model or a downstream stage unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 503
                status_desc: Service Unavailable
                message: ekstraksi OCR model is unavailable
                errors: ekstraksi OCR model is unavailable
        '504':
          description: OCR model or a downstream stage did not answer in time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 504
                status_desc: Gateway Timeout
                message: ekstraksi OCR model timed out after 30.0s
                errors: ekstraksi OCR model timed out after 30.0s
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'body.request_id: Field required'
                errors: VALIDATION_ERROR
      deprecated: true
      security:
      - APIKeyHeader: []
      servers: *id001
  /v1/get-ocr-result/{request_id}:
    get:
      tags:
      - Legacy synchronous contract (deprecated)
      summary: 'Legacy: status and result of an extract-ocr request'
      description: '**Legacy synchronous contract**, kept until the orchestrator has moved to the asynchronous
        pipeline (`POST /v1/ekstraksi/jobs`). Current status and, once completed, the result of a request_id
        minted by this service.'
      operationId: getOcrResult
      deprecated: true
      security:
      - APIKeyHeader: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      responses:
        '200':
          description: The request_id exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOcrResultResponse'
              examples:
                completed:
                  summary: Finished
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
