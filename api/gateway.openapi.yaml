openapi: 3.1.0
info:
  title: 'NILAM OCR NPWP: gateway integration API'
  version: 1.0.0
  description: "Everything the central orchestrator / gateway needs to integrate the NPWP OCR pipeline,\
    \ merged from the\nservices' own specs. Each service also serves its full Swagger UI at `/docs`.\n\
    \n## The flow\n\n1. **`POST /v1/extract-ocr`** on the *orchestrator* service (port `8034`) with your\
    \ `request_id` and the\n   document (`file` or `file_url`, optional `params`). It answers in the central\
    \ orchestrator's\n   `extract-ocr` contract (`job_status`, `data`, `guardrails`, `params`):\n   -\
    \ rejected by the guardrails model -> **400**, `errors: DOWNSTREAM_VALIDATION_ERROR`, `guardrails:\
    \ 1`;\n     nothing runs and no callback follows.\n   - passed -> the document goes on to the OCR\
    \ stage and the service waits for the pipeline for up to\n     `PIPELINE_WAIT_SECONDS` (15 s by default,\
    \ counted from the request's arrival). Finished in time ->\n     **200**, `job_status: completed`,\
    \ `data` = `nomor_npwp` and `nama` as `{value, confidence}` with\n     confidence 0/1; a stage failed\
    \ -> **422** `OCR_FAILED` / `STRUCTURING_FAILED` / `SCORING_FAILED`; still\n     running -> **202**,\
    \ `job_status: processing`. Give this call an HTTP timeout well above the wait.\n2. **Receive callbacks**\
    \ (see *Webhooks*), sent by the pipeline stages themselves after a hand-off. The\n   `SCORING` / `DONE`\
    \ callback carries the **final result** (richer than `data`: OCR scores, trust\n   probabilities,\
    \ the guardrails report). A `FAILED` callback of any stage ends the request.\n3. **Read the status\
    \ when needed** with `GET /v1/extract-ocr/{request_id}` on the same service: the same\n   contract,\
    \ without waiting.\n\nTime a request out on your side: a stage that crashes mid-job cannot send its\
    \ callback.\n\n## What the result is, and is not\n\n`fields` holds `nomor_npwp`, `nama`, `nama_badan`.\
    \ `scoring` holds `npwp_confidence` and\n`name_confidence`: the probability, from the ML team's trust\
    \ model, that each extracted field is\ncorrect. There is **no document-level score and no approve\
    \ / reject decision**; thresholds are yours.\n\n## Addresses\n\nThe orchestrator is the only service\
    \ you call. From another namespace in GKE:\n`http://nilam-ocr-npwp.nilam-ocr-npwp.svc.cluster.local:8034`\
    \ (the release's entry Service). The\nguardrails and pipeline stage services are internal. Nothing\
    \ is exposed outside the cluster.\n\n\n## Conventions (the same for every nilam-ocr service)\n\n**Authentication.**\
    \ Every endpoint except `/health`, `/ready` and `/metrics` requires the header `X-API-Key`.\nA missing\
    \ or wrong key answers `401`. The services are reachable only from inside the cluster.\n\n**Envelope.**\
    \ Every JSON response, success or error, has the same shape:\n`{status_code, status_desc, message,\
    \ data, errors, request_id}`. `status_code` always equals the HTTP\nstatus. On success `errors` is\
    \ null; on error `data` is null.\n\n**Errors.** `errors` is machine-readable: `VALIDATION_ERROR` for\
    \ `422`, otherwise the same text as\n`message`. `400` = the request or the document is unusable (do\
    \ not retry unchanged). `401` = API key.\n`404` = unknown request_id. `409` = request_id already processed\
    \ (legacy contract only). `422` = a\nfield is missing or has the wrong type. `500` = this service\
    \ or its model failed. `503` = a\ndependency is unreachable, `504` = it did not answer in time (both\
    \ are safe to retry).\n\n**request_id.** Minted by the central orchestrator and carried through every\
    \ stage. Where an endpoint has\nno request_id of its own, the `X-Request-ID` request header is used\
    \ (and echoed in the response header);\nwithout it the service generates one.\n\n**Asynchronous stages**\
    \ (internal: only the orchestrator NPWP and the previous stage call them). `POST\n.../jobs` answers\
    \ `202` immediately and does the work in the background. The outcome is reported by a\ncallback to\
    \ the central orchestrator (see *Webhooks*), and can be read at any time with\n`GET .../jobs/{request_id}`,\
    \ which the orchestrator NPWP's `GET /v1/extract-ocr/{request_id}` combines\nover the three stages.\
    \ Submitting the same request_id again is idempotent:\n`202` with `duplicate: true`, the work is not\
    \ repeated, unless the earlier attempt `FAILED` or has been\n`PROCESSING` for longer than the job\
    \ lease (`PIPELINE_JOB_LEASE_SECONDS`, 5 minutes by default: the\nprocess running it died). A job\
    \ still running when the service shuts down is reported `FAILED`. Because\nthe request was already\
    \ answered `202`, a problem with the document itself (unreadable file, no text,\nunsupported document\
    \ type) shows up as a `FAILED` job and callback, not as a `4xx`.\n"
tags:
- name: 1. Start the pipeline
  description: 'The call you make: guardrails check, then OCR -> structuring -> scoring, waited on for
    up to PIPELINE_WAIT_SECONDS; answers in the central orchestrator''s extract-ocr contract. 200: `completed`
    with the fields. 202: still `processing`, the result arrives by callback. 400: rejected. 422: a stage
    failed.'
- name: 2. Callbacks (you implement this)
  description: 'Listed under **Webhooks**: the request each stage sends to you when it finishes.'
- name: 3. Status
  description: 'Where a request is now, in the same contract, without waiting: e.g. after a 202 whose
    callback did not arrive.'
paths:
  /v1/extract-ocr:
    post:
      tags:
      - 1. Start the pipeline
      summary: Judge a document, run the pipeline, answer with the OCR result or 202
      description: '**The call the central orchestrator makes.** Checks the file, has the guardrails service
        judge it, hands it to the OCR stage when it passes, then waits for OCR -> structuring -> scoring
        (or the services `pipeline_name_sequence` names, see below) for up to `PIPELINE_WAIT_SECONDS`
        (15 s by default), counted from when this request arrived. The response follows the central orchestrator''s
        `extract-ocr` contract ("Finished" meaning finished within the wait):


        | Outcome | HTTP | `job_status` | `data` | `guardrails` | `errors` |

        |---|---|---|---|---|---|

        | Finished | 200 | `completed` | the fields | `0` | null |

        | Still running | 202 | `processing` | null | null | null |

        | Rejected by the guardrails model | 400 | `failed` | null | `1` | `DOWNSTREAM_VALIDATION_ERROR`
        |

        | Rejected by the structuring rules | 400 | `failed` | null | `1` | `DOWNSTREAM_VALIDATION_ERROR`
        |

        | A stage failed | 422 | `failed` | null | `0` | `OCR_FAILED`, `STRUCTURING_FAILED` or `SCORING_FAILED`
        |


        `data` holds `nomor_npwp` and `nama` as `{value, confidence}`; `nama` is the taxpayer''s name,
        or the registered name on a company''s card. `confidence` is `1` when the ML team''s trust model
        gives the value a probability of being correct of at least `FIELD_CONFIDENCE_THRESHOLD` (0.5 by
        default), else `0`. `params` is returned as sent.


        **Rejected by the structuring rules**: the ML team''s rules reject a document that is blurred
        or blank, not in the standard NPWP format, another document or bundled with one, a screenshot
        of the online NPWP lookup, longer than the page limit, or whose number carries an invalid birthdate,
        province, kecamatan or KPP code. `message` is the rules'' Indonesian reason, e.g. `Kode provinsi
        pada NPWP tidak valid, mohon dicek kembali`. A single-word name or a letter in the number is tolerated:
        the fields are returned, and the trust model''s confidence already accounts for it.


        **Refused before anything runs** (plain error envelope, no `job_status`): a document above `MAX_UPLOAD_BYTES`
        (2.5 MB by default) answers `413`, one with more than `MAX_DOCUMENT_PAGES` (2) pages answers `400`,
        both with an Indonesian `message` the client can show as is.


        **Which services run: `pipeline_name_sequence`.** The services of this request, in order: `guardrails`,
        `extraction`, `structuring`, `scoring`. Guardrails may be left out at the front and the end cut
        off, never one skipped in the middle or the order changed (else `422` `INVALID_PIPELINE_SEQUENCE`
        and nothing runs). Omitted: all four. The last service ends the request and its result is `data`,
        **as it is**: the guardrails report (`{passed, reason, document, pages}`) when only `guardrails`
        runs, the OCR result (`{text, blocks, ...}`) after `extraction`, the structuring result (`{fields,
        flag, reject_reason, ...}`) after `structuring`, and the fields above only after `scoring`. The
        rest of the body is the same. The structuring rules still reject when `structuring` runs. Leaving
        `guardrails` out is only allowed when this service allows it (`GUARDRAILS_SKIP_ALLOWED`; otherwise
        `403` `GUARDRAILS_SKIP_NOT_ALLOWED` and nothing runs); the file checks above always run, and the
        trust model then works without a guardrails probability. A `guardrails`-only request stores nothing:
        its POST answer is final, and `GET /v1/extract-ocr/{request_id}` answers 404 for it.


        On 202 the result arrives by callback (sent by the pipeline stages), and can be read with `GET
        /v1/extract-ocr/{request_id}`. Give this call an HTTP timeout well above `PIPELINE_WAIT_SECONDS`
        (e.g. +15 s) to cover a slow guardrails check or hand-off.


        Send `request_id` plus the document as `file`, or as `file_url`; exactly one of the two. A `file_url`
        is downloaded here for the guardrails check, and the URL itself (not the bytes) is handed to the
        OCR stage, which downloads it again, also when it re-runs a job left behind by a dead process:
        the URL must stay valid for longer than the job lease. The raw guardrails report (per-page probabilities)
        is not part of this response: it travels down the pipeline and comes back in the SCORING callback.


        **Idempotency.** The same request_id again re-runs the guardrails check, but the pipeline does
        not run twice unless the earlier OCR attempt `FAILED` or outlived the job lease (`PIPELINE_JOB_LEASE_SECONDS`);
        a request_id that already finished answers again with its stored outcome.'
      operationId: extractOcr
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_extractOcr'
        required: true
      responses:
        '200':
          description: Accepted and finished within the wait
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              examples:
                completed:
                  summary: The OCR result
                  value:
                    status_code: 200
                    status_desc: OK
                    message: OCR extraction completed successfully
                    data:
                      nomor_npwp:
                        value: 12.345.678.9-012.345
                        confidence: 1
                      nama:
                        value: BUDI SANTOSO
                        confidence: 1
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                    document_type: npwp
                    job_status: completed
                    guardrails: 0
                    params:
                      nik: '3123456711950001'
                      refno: PK19039Y8U
                guardrails_only:
                  summary: '`pipeline_name_sequence: ["guardrails"]`: the guardrails report as it is'
                  value:
                    status_code: 200
                    status_desc: OK
                    message: OCR extraction completed successfully
                    data:
                      passed: true
                      document:
                        verdict: accepted
                        confidence: 0.9821
                        n_pages: 1
                        n_approve: 1
                        n_reject: 0
                        reject_threshold: 0.5
                      pages:
                      - page_index: 0
                        proba_approve: 0.9821
                        proba_reject: 0.0179
                        verdict: accepted
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                    document_type: npwp
                    job_status: completed
                    guardrails: 0
                    params:
                      nik: '3123456711950001'
                      refno: PK19039Y8U
        '202':
          description: 'Accepted, but still running when the wait ran out: the result follows by callback'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              examples:
                processing:
                  summary: Still processing
                  value:
                    status_code: 202
                    status_desc: Accepted
                    message: OCR job accepted; still processing
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                    document_type: npwp
                    job_status: processing
                    params:
                      nik: '3123456711950001'
                      refno: PK19039Y8U
        '400':
          description: 'Rejected by the guardrails model or by the structuring rules (`DOWNSTREAM_VALIDATION_ERROR`,
            `guardrails: 1`), unsupported `document_type` (`UNSUPPORTED_DOCUMENT_TYPE`), more than `MAX_DOCUMENT_PAGES`
            pages (`Jumlah halaman melebihi batas, pastikan hanya mengunggah dokumen NPWP`), or a bad
            file / intake (empty, unsupported type, unreadable, `file_url` refused)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              example:
                status_code: 400
                status_desc: Bad Request
                message: 'Document rejected by guardrails: 1/1 page(s) rejected (confidence 0.88)'
                errors: DOWNSTREAM_VALIDATION_ERROR
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                document_type: npwp
                job_status: failed
                guardrails: 1
                params:
                  nik: '3123456711950001'
                  refno: PK19039Y8U
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
        '403':
          description: A `pipeline_name_sequence` without `guardrails` while `GUARDRAILS_SKIP_ALLOWED`
            is off (`GUARDRAILS_SKIP_NOT_ALLOWED`); nothing was started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              example:
                status_code: 403
                status_desc: Forbidden
                message: 'a pipeline_name_sequence without guardrails is not allowed here: GUARDRAILS_SKIP_ALLOWED
                  is off'
                errors: GUARDRAILS_SKIP_NOT_ALLOWED
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                document_type: npwp
        '413':
          description: The document exceeds `MAX_UPLOAD_BYTES` (2.5 MB by default); nothing was started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 413
                status_desc: Payload Too Large
                message: Ukuran dokumen melebihi batas 2,5 MB, pastikan hanya mengunggah dokumen NPWP
                errors: Ukuran dokumen melebihi batas 2,5 MB, pastikan hanya mengunggah dokumen NPWP
        '422':
          description: A pipeline stage failed within the wait (`OCR_FAILED`, `STRUCTURING_FAILED`, `SCORING_FAILED`;
            `message` says why), `params` is not valid JSON (`INVALID_PARAMS`), `pipeline_name_sequence`
            breaks the order rules (`INVALID_PIPELINE_SEQUENCE`), or a required field is missing (`VALIDATION_ERROR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: No text lines to structure
                errors: STRUCTURING_FAILED
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                document_type: npwp
                job_status: failed
                guardrails: 0
                params:
                  nik: '3123456711950001'
                  refno: PK19039Y8U
        '500':
          description: The guardrails or extraction service failed, or answered in an unexpected shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 500
                status_desc: Internal Server Error
                message: guardrails service returned an unexpected response
                errors: guardrails service returned an unexpected response
        '503':
          description: The guardrails service, its model, or the extraction service is unreachable; nothing
            was started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 503
                status_desc: Service Unavailable
                message: extraction service is unavailable
                errors: extraction service is unavailable
        '504':
          description: The guardrails service, its model, or the extraction service did not answer in
            time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 504
                status_desc: Gateway Timeout
                message: extraction service timed out after 10.0s
                errors: extraction service timed out after 10.0s
      security:
      - APIKeyHeader: []
      servers: &id001
      - url: http://nilam-ocr-npwp.{namespace}.svc.cluster.local:8034
        description: 'GKE, from another namespace: the entry Service (the central orchestrator / gateway)'
        variables:
          namespace:
            default: nilam-ocr-npwp
            description: 'Namespace of the Helm release (deploy/helm/deploy.sh: nilam-ocr-npwp)'
      - url: http://nilam-ocr-npwp-orchestrator.{namespace}.svc.cluster.local:8034
        description: GKE, from inside the release's namespace (the other services of this pipeline)
        variables:
          namespace:
            default: nilam-ocr-npwp
            description: 'Namespace of the Helm release (deploy/helm/deploy.sh: nilam-ocr-npwp)'
      - url: http://orchestrator:8034
        description: The Docker Compose network
      - url: http://127.0.0.1:8034
        description: Local development
  /v1/extract-ocr/{request_id}:
    get:
      tags:
      - 3. Status
      summary: 'Where a request is now: the extract-ocr answer, without waiting'
      description: 'Reads the OCR, structuring and scoring jobs of `request_id` once each, in pipeline
        order, and answers in the same contract as `POST /v1/extract-ocr` ("Finished" meaning finished
        by now):


        | Outcome | HTTP | `job_status` | `data` | `guardrails` | `errors` |

        |---|---|---|---|---|---|

        | Finished | 200 | `completed` | the fields | `0` | null |

        | Still running | 202 | `processing` | null | null | null |

        | Rejected by the guardrails model | 400 | `failed` | null | `1` | `DOWNSTREAM_VALIDATION_ERROR`
        |

        | Rejected by the structuring rules | 400 | `failed` | null | `1` | `DOWNSTREAM_VALIDATION_ERROR`
        |

        | A stage failed | 422 | `failed` | null | `0` | `OCR_FAILED`, `STRUCTURING_FAILED` or `SCORING_FAILED`
        |


        Use it for a request that was answered `202`, e.g. when a callback did not arrive. `params` is
        always null here (it is not stored) and `document_type` is `npwp`.


        **404** means no stage has a job for this request_id: it was refused or rejected by the guardrails
        model (the `400` of the POST is its final answer), refused before the check, or its POST is still
        being judged by guardrails.


        **Limitation.** A hand-off between two stages that failed for good (its retries ran out, or it
        became a dead letter in the outbox) leaves the next stage without a job, so this endpoint keeps
        answering `202` for it. The `FAILED` callback and the central orchestrator''s own tables carry
        that final state; this endpoint only reads the stages'' jobs.'
      operationId: getExtractOcr
      security:
      - APIKeyHeader: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      responses:
        '200':
          description: Finished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              examples:
                completed:
                  summary: The OCR result
                  value:
                    status_code: 200
                    status_desc: OK
                    message: OCR extraction completed successfully
                    data:
                      nomor_npwp:
                        value: 12.345.678.9-012.345
                        confidence: 1
                      nama:
                        value: BUDI SANTOSO
                        confidence: 1
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                    document_type: npwp
                    job_status: completed
                    guardrails: 0
        '202':
          description: Still running
          content:
            application/json:
              examples:
                processing:
                  summary: Still processing
                  value:
                    status_code: 202
                    status_desc: Accepted
                    message: OCR job accepted; still processing
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                    document_type: npwp
                    job_status: processing
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
        '400':
          description: 'Rejected by the structuring rules (`DOWNSTREAM_VALIDATION_ERROR`, `guardrails:
            1`)'
          content:
            application/json:
              example:
                status_code: 400
                status_desc: Bad Request
                message: Kode provinsi pada NPWP tidak valid, mohon dicek kembali
                errors: DOWNSTREAM_VALIDATION_ERROR
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                document_type: npwp
                job_status: failed
                guardrails: 1
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No stage has a job for this request_id (rejected by the guardrails model, or not
            submitted yet)
          content:
            application/json:
              example:
                status_code: 404
                status_desc: Not Found
                message: No request found for request_id OCR_9cb01af2-493d-446d-b191-af120333f6d0
                errors: No request found for request_id OCR_9cb01af2-493d-446d-b191-af120333f6d0
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: A pipeline stage failed (`OCR_FAILED`, `STRUCTURING_FAILED`, `SCORING_FAILED`)
          content:
            application/json:
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: No text lines to structure
                errors: STRUCTURING_FAILED
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                document_type: npwp
                job_status: failed
                guardrails: 0
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
        '500':
          description: A stage answered in an unexpected shape, or refused this service (e.g. a wrong
            API key)
          content:
            application/json:
              example:
                status_code: 500
                status_desc: Internal Server Error
                message: 'structuring service error (401): Invalid or missing API key'
                errors: 'structuring service error (401): Invalid or missing API key'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: A stage service is unreachable
          content:
            application/json:
              example:
                status_code: 503
                status_desc: Service Unavailable
                message: structuring service is unavailable
                errors: structuring service is unavailable
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: A stage service did not answer in time
          content:
            application/json:
              example:
                status_code: 504
                status_desc: Gateway Timeout
                message: structuring service timed out after 10.0s
                errors: structuring service timed out after 10.0s
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      servers: *id001
webhooks:
  stageCallback:
    post:
      tags:
      - 2. Callbacks (you implement this)
      summary: Stage status callback (implemented by the orchestrator / gateway)
      description: '**This is a request this service SENDS, not one it accepts.** The orchestrator must
        expose it.


        `POST {ORCHESTRATION_URL}{ORCHESTRATION_CALLBACK_PATH}` (default path `/v1/callbacks/stage`),
        `Content-Type: application/json`.


        **When.** Once per stage, from the service that ran it:


        - **extraction**: Once per job of `POST /v1/extraction/jobs`: `stage: OCR` with `status: DONE`
        once the OCR result is stored, or `status: FAILED` with `error_message` when the document could
        not be read (the chain stops there). Additionally `stage: STRUCTURING`, `status: FAILED` when
        OCR succeeded but the structuring service could not be reached after retries. Without `PIPELINE_OUTBOX`
        the `OCR` callback is sent before the hand-off to structuring; with it the hand-off goes first,
        so the `STRUCTURING` callback may arrive before this one.

        - **structuring**: Once per job of `POST /v1/structuring/jobs`: `stage: STRUCTURING` with `status:
        DONE` once the fields are stored, or `status: FAILED` with `error_message` when the upload is
        not a lone NPWP card or has no text (the chain stops there). Additionally `stage: SCORING`, `status:
        FAILED` when structuring succeeded but the scoring service could not be reached after retries.
        Without `PIPELINE_OUTBOX` the `STRUCTURING` callback is sent before the hand-off to scoring; with
        it the hand-off goes first, so the `SCORING` callback may arrive before this one.

        - **scoring**: Once per job of `POST /v1/scoring/jobs`, the last callback of a request: `stage:
        SCORING` with `status: DONE` and `result` = the **final result** (fields, per-field confidences,
        and the guardrails result that was submitted), or `status: FAILED` with `error_message` and `result:
        null`.


        **Expected answer.** Any `2xx`; the body is ignored. `5xx`, a timeout or an unreachable host are
        retried (3 attempts by default, exponential back-off from 0.5 s). A `4xx` is NOT retried. A callback
        that still fails is logged and dropped: the job itself stays `DONE` / `FAILED`, so the orchestrator
        can reconcile with the orchestrator NPWP''s `GET /v1/extract-ocr/{request_id}` and should time
        a request out on its own. With `PIPELINE_OUTBOX` the callback is instead queued in the same transaction
        as the result and retried with back-off (up to 5 minutes apart) for up to `PIPELINE_OUTBOX_MAX_AGE_SECONDS`
        (24 h by default); a `4xx`, or that age, makes it a dead letter that stays in the table and is
        counted by `GET .../outbox`.


        **What the receiver must tolerate.** The same callback may arrive more than once (treat it as
        idempotent), and callbacks of different stages come from different services, so they may arrive
        out of order: only ever move a request''s status forward. Reject callbacks whose `X-API-Key` is
        wrong.'
      operationId: stageCallback
      parameters:
      - description: '`ORCHESTRATION_API_KEY` of the sending service; when unset, that service''s own
          `API_KEY`'
        required: true
        schema:
          type: string
          title: X-Api-Key
          description: '`ORCHESTRATION_API_KEY` of the sending service; when unset, that service''s own
            `API_KEY`'
        name: x-api-key
        in: header
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/StageCallback'
              - $ref: '#/components/schemas/ScoringStageCallback'
              description: '`stage: SCORING` carries the final result in `result`; for the other stages
                `result` is null.'
        required: true
      responses:
        '200':
          description: Acknowledged. Any 2xx is accepted and the body is ignored.
          content:
            application/json:
              schema: {}
components:
  schemas:
    Body_extractOcr:
      properties:
        request_id:
          type: string
          title: Request Id
          description: request_id minted by the central orchestrator
          examples:
          - OCR_9cb01af2-493d-446d-b191-af120333f6d0
        document_type:
          type: string
          title: Document Type
          description: Document type chosen by the client. Only `npwp` is supported
          default: npwp
          examples:
          - npwp
        params:
          anyOf:
          - type: string
          - type: 'null'
          title: Params
          description: 'Client metadata as JSON: an object, or a quoted string. Not interpreted; returned
            unchanged in `params`'
          examples:
          - '{"nik": "3123456711950001", "refno": "PK19039Y8U"}'
        file:
          anyOf:
          - type: string
            format: binary
          - type: string
          - type: 'null'
          title: File
          description: Document image (JPEG/PNG/PDF). Omit when sending file_url.
        file_url:
          anyOf:
          - type: string
          - type: 'null'
          title: File Url
          description: URL this service fetches the document image from (e.g. a presigned MinIO GET).
            Omit when uploading file. The host must be listed in the service's `FILE_URL_ALLOWED_HOSTS`,
            or resolve to a public address when that is empty; redirects are not followed.
        pipeline_name_sequence:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Pipeline Name Sequence
          description: 'The services to run, in order: `guardrails`, `extraction`, `structuring`, `scoring`;
            guardrails optional at the front, the end may be cut off, nothing skipped in the middle. Repeated
            form fields, or one JSON array string. Omitted: all four. The last one''s result is `data`,
            as it is. Without `guardrails` only when `GUARDRAILS_SKIP_ALLOWED` is on, else `403` `GUARDRAILS_SKIP_NOT_ALLOWED`'
          examples:
          - - guardrails
            - extraction
            - structuring
            - scoring
      type: object
      required:
      - request_id
      title: Body_extractOcr
    ContractField:
      properties:
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
          description: The value read; null when the field was not found
          examples:
          - 12.345.678.9-012.345
        confidence:
          type: integer
          enum:
          - 0
          - 1
          title: Confidence
          description: 1 when the ML team's trust model gives this value a probability of being correct
            of at least `FIELD_CONFIDENCE_THRESHOLD` (0.5 by default); 0 when it is lower, or when there
            is no value
          examples:
          - 1
      type: object
      required:
      - confidence
      title: ContractField
    ErrorResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          examples:
          - 400
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          examples:
          - Bad Request
        message:
          type: string
          title: Message
          description: Human-readable cause; safe to log
          examples:
          - Uploaded file is empty
        data:
          type: 'null'
          title: Data
          description: Always null on error
        errors:
          type: string
          title: Errors
          description: Machine-readable cause. `VALIDATION_ERROR` for 422 (branch on this, the message
            names a different field every time); for every other status it repeats `message`
          examples:
          - Uploaded file is empty
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: Present when the error is tied to a known request_id
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
      type: object
      required:
      - status_code
      - status_desc
      - message
      - errors
      title: ErrorResponse
      description: Every error response.
    ExtractOcrResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          examples:
          - 200
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          examples:
          - OK
        message:
          type: string
          title: Message
          description: Human-readable; its wording may change, so branch on `errors` instead
          examples:
          - OCR extraction completed successfully
        data:
          anyOf:
          - $ref: '#/components/schemas/NpwpData'
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Data
          description: The result when `job_status` is `completed`; null otherwise. The fields (`nomor_npwp`,
            `nama`) when scoring ended the request; the result of the last service of `pipeline_name_sequence`,
            as it is, when the sequence ends earlier (the guardrails report, the OCR result, or the structuring
            result)
        errors:
          anyOf:
          - type: string
          - type: 'null'
          title: Errors
          description: Failure code when the request failed or was refused; null otherwise
          examples:
          - null
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: The request_id this response belongs to
        document_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Type
          description: Document type of the request
          examples:
          - npwp
        job_status:
          anyOf:
          - type: string
            enum:
            - pending
            - processing
            - completed
            - failed
          - type: 'null'
          title: Job Status
          description: '`completed` (200), `processing` (202), or `failed`; null when the request was
            refused before anything was processed'
          examples:
          - completed
        guardrails:
          anyOf:
          - type: integer
            enum:
            - 0
            - 1
          - type: 'null'
          title: Guardrails
          description: '0: the document passed the guardrails model (and the pipeline ran); 1: it was
            rejected by the guardrails model or by the structuring rules. Null on 202, and when the request
            was refused before the check'
          examples:
          - 0
        params:
          title: Params
          description: The `params` sent with `POST /v1/extract-ocr`, returned unchanged; null when not
            sent. Not stored, so always null on `GET /v1/extract-ocr/{request_id}`
          examples:
          - nik: '3123456711950001'
            refno: PK19039Y8U
      type: object
      required:
      - status_code
      - status_desc
      - message
      title: ExtractOcrResponse
    FieldConfidences:
      properties:
        npwp_confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Npwp Confidence
          description: P(the NPWP number is correct); null when no number was found
          examples:
          - 0.7296
        name_confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Name Confidence
          description: P(the name is correct); null when no name was found
          examples:
          - 0.9471
      type: object
      required:
      - npwp_confidence
      - name_confidence
      title: FieldConfidences
      description: 'Output of the ML team''s trust model: probability that each extracted field is correct.'
    FinalField:
      properties:
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
          description: null when the field was not found
          examples:
          - '3201234567890001'
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          description: OCR score of the line the value came from
          examples:
          - 0.9762
      type: object
      required:
      - confidence
      title: FinalField
      description: A field of the final result.
    FinalResult:
      properties:
        document_type:
          type: string
          title: Document Type
          description: Document type the fields were read as
          examples:
          - npwp
        fields:
          additionalProperties:
            $ref: '#/components/schemas/FinalField'
          type: object
          title: Fields
          description: '`nomor_npwp`, `nama`, `nama_badan`. A 15-digit number is formatted `XX.XXX.XXX.X-XXX.XXX`;
            a 16-digit (NIK-based) number is 16 plain digits. A card printing both reports the 16-digit
            one'
          examples:
          - nama:
              confidence: 0.9931
              value: BUDI SANTOSO
            nama_badan:
              confidence: 0.0
            nomor_npwp:
              confidence: 0.9762
              value: '3201234567890001'
        scoring:
          $ref: '#/components/schemas/FieldConfidences'
          description: 'Per-field trust. There is NO document-level score and NO approve / reject decision:
            thresholds belong to the caller'
        guardrails:
          anyOf:
          - $ref: '#/components/schemas/GuardrailsResult'
          - type: 'null'
          description: The guardrails result that was submitted with the job, returned unchanged
        flag:
          type: boolean
          title: Flag
          description: 'Flag of the structuring rules (see the structuring result), an input of the trust
            model. Only a tolerated flag (single-word name, letter in the number) reaches this result:
            any other rejects the document at structuring'
          default: false
          examples:
          - false
        flag_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Flag Reason
          description: Why `flag` is true, in Indonesian; null when not flagged
          examples:
          - null
      type: object
      required:
      - document_type
      - fields
      - scoring
      title: FinalResult
      description: What the pipeline produced for one request_id. Carried by the SCORING / DONE callback.
    GuardrailsDocument:
      properties:
        verdict:
          anyOf:
          - type: string
            enum:
            - accepted
            - reject
          - type: 'null'
          title: Verdict
          description: Document verdict
          examples:
          - accepted
        confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Confidence
          description: 'Confidence in the verdict: accepted -> lowest `proba_approve` over the pages.
            Sent to the scoring model as `guardrail_probability`'
          examples:
          - 0.9821
        n_pages:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: N Pages
          description: Pages that were checked
          examples:
          - 1
        n_approve:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: N Approve
          description: Pages with verdict `accepted`
          examples:
          - 1
        n_reject:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: N Reject
          description: Pages with verdict `rejected`
          examples:
          - 0
      additionalProperties: true
      type: object
      title: GuardrailsDocument
      description: The guardrails verdict for the whole document.
    GuardrailsPage:
      properties:
        page_index:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Page Index
          description: 0-based page number
          examples:
          - 0
        proba_approve:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Proba Approve
          description: Probability that this page is an acceptable document
          examples:
          - 0.9821
        proba_reject:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Proba Reject
          description: 1 - `proba_approve`
          examples:
          - 0.0179
        verdict:
          anyOf:
          - type: string
            enum:
            - accepted
            - reject
          - type: 'null'
          title: Verdict
          description: Verdict for this page alone
          examples:
          - accepted
      additionalProperties: true
      type: object
      title: GuardrailsPage
      description: One page of the guardrails report.
    GuardrailsResult:
      properties:
        passed:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Passed
          description: 'true: the document may proceed to OCR'
          examples:
          - true
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Why it was rejected; null when passed
          examples:
          - null
        document:
          anyOf:
          - $ref: '#/components/schemas/GuardrailsDocument'
          - type: 'null'
          description: Verdict for the document as a whole
        pages:
          items:
            $ref: '#/components/schemas/GuardrailsPage'
          type: array
          title: Pages
          description: One entry per page, in page order
      additionalProperties: true
      type: object
      title: GuardrailsResult
      description: The guardrails report (`data` of the guardrails service's POST /v1/guardrails/check,
        sent on by the orchestrator), forwarded unchanged down the pipeline.
    NpwpData:
      properties:
        nomor_npwp:
          $ref: '#/components/schemas/ContractField'
          description: 15-digit number as `XX.XXX.XXX.X-XXX.XXX`, or a 16-digit NIK-based number as 16
            plain digits
        nama:
          $ref: '#/components/schemas/ContractField'
          description: 'The name on the card: the taxpayer''s name, or the registered name on a company''s
            card'
      type: object
      required:
      - nomor_npwp
      - nama
      title: NpwpData
    ScoringStageCallback:
      properties:
        request_id:
          type: string
          title: Request Id
          description: The request_id you submitted with `POST /v1/extraction/jobs`
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        stage:
          type: string
          const: SCORING
          title: Stage
          description: 'Always `SCORING`: the last stage'
          default: SCORING
          examples:
          - SCORING
        status:
          type: string
          enum:
          - DONE
          - FAILED
          title: Status
          description: Outcome of the stage. `FAILED` of any stage ends the request
          examples:
          - DONE
        result:
          anyOf:
          - $ref: '#/components/schemas/FinalResult'
          - type: 'null'
          description: The final result of the request when `status` is `DONE`; null when `FAILED`
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
          description: Why it failed; null when `status` is `DONE`
          examples:
          - null
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
          description: 'Only on a rejection: `DOWNSTREAM_VALIDATION_ERROR` when the stage rejected the
            document (a rejecting check of the structuring rules; `error_message` is the Indonesian reason).
            Absent when a stage broke'
          examples:
          - null
      type: object
      required:
      - request_id
      - status
      title: ScoringStageCallback
      description: Body of the callback a stage POSTs to the orchestrator when it finishes.
    StageCallback:
      properties:
        request_id:
          type: string
          title: Request Id
          description: The request_id you submitted with `POST /v1/extraction/jobs`
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        stage:
          type: string
          enum:
          - OCR
          - STRUCTURING
          - SCORING
          title: Stage
          description: 'Stage the status is about. Usually the sender''s own stage; when the hand-off
            to the NEXT stage fails after retries, the sender reports `status: FAILED` with the next stage''s
            name, because that stage never received the job and cannot report for itself'
          examples:
          - OCR
        status:
          type: string
          enum:
          - DONE
          - FAILED
          title: Status
          description: Outcome of the stage. `FAILED` of any stage ends the request
          examples:
          - DONE
        result:
          type: 'null'
          title: Result
          description: Always null for OCR and STRUCTURING; read the stage result from GET .../jobs/{request_id}
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
          description: Why it failed; null when `status` is `DONE`
          examples:
          - null
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
          description: 'Only on a rejection: `DOWNSTREAM_VALIDATION_ERROR` when the stage rejected the
            document (a rejecting check of the structuring rules; `error_message` is the Indonesian reason).
            Absent when a stage broke'
          examples:
          - null
      type: object
      required:
      - request_id
      - stage
      - status
      title: StageCallback
      description: Body of the callback a stage POSTs to the orchestrator when it finishes.
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: API key for this service
      in: header
      name: X-API-Key
