webhooks:
  stageCallback:
    post:
      tags:
      - 2. Callbacks (you implement this)
      summary: Stage status callback (implemented by the orchestrator / gateway)
      description: '**This is a request this service SENDS, not one it accepts.** The orchestrator must
        expose it.


        `POST {ORCHESTRATION_URL}{ORCHESTRATION_CALLBACK_PATH}` (default path `/v1/callbacks/stage`),
        `Content-Type: application/json`.


        **When.** Once per stage, from the service that ran it:


        - **ekstraksi**: Once per job of `POST /v1/ekstraksi/jobs`: `stage: OCR` with `status: DONE` once
        the OCR result is stored, or `status: FAILED` with `error_message` when the document could not
        be read (the chain stops there). Additionally `stage: STRUCTURING`, `status: FAILED` when OCR
        succeeded but the structuring service could not be reached after retries. Without `PIPELINE_OUTBOX`
        the `OCR` callback is sent before the hand-off to structuring; with it the hand-off goes first,
        so the `STRUCTURING` callback may arrive before this one.

        - **structuring**: Once per job of `POST /v1/structuring/jobs`: `stage: STRUCTURING` with `status:
        DONE` once the fields are stored, or `status: FAILED` with `error_message` when the upload is
        not a lone NPWP card or has no text (the chain stops there). Additionally `stage: SCORING`, `status:
        FAILED` when structuring succeeded but the scoring service could not be reached after retries.
        Without `PIPELINE_OUTBOX` the `STRUCTURING` callback is sent before the hand-off to scoring; with
        it the hand-off goes first, so the `SCORING` callback may arrive before this one.

        - **scoring**: Once per job of `POST /v1/scoring/jobs`, the last callback of a request: `stage:
        SCORING` with `status: DONE` and `result` = the **final result** (fields, per-field confidences,
        and the guardrails result that was submitted), or `status: FAILED` with `error_message` and `result:
        null`.


        **Expected answer.** Any `2xx`; the body is ignored. `5xx`, a timeout or an unreachable host are
        retried (3 attempts by default, exponential back-off from 0.5 s). A `4xx` is NOT retried. A callback
        that still fails is logged and dropped: the job itself stays `DONE` / `FAILED`, so the orchestrator
        can reconcile with `GET .../jobs/{request_id}` and should time a stage out on its own. With `PIPELINE_OUTBOX`
        the callback is instead queued in the same transaction as the result and retried with back-off
        (up to 5 minutes apart) for up to `PIPELINE_OUTBOX_MAX_AGE_SECONDS` (24 h by default); a `4xx`,
        or that age, makes it a dead letter that stays in the table and is counted by `GET .../outbox`.


        **What the receiver must tolerate.** The same callback may arrive more than once (treat it as
        idempotent), and callbacks of different stages come from different services, so they may arrive
        out of order: only ever move a request''s status forward. Reject callbacks whose `X-API-Key` is
        wrong.'
      operationId: stageCallback
      parameters:
      - description: '`ORCHESTRATION_API_KEY` of the sending service; when unset, that service''s own
          `API_KEY`'
        required: true
        schema:
          type: string
          title: X-Api-Key
          description: '`ORCHESTRATION_API_KEY` of the sending service; when unset, that service''s own
            `API_KEY`'
        name: x-api-key
        in: header
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/StageCallback'
              - $ref: '#/components/schemas/ScoringStageCallback'
              description: '`stage: SCORING` carries the final result in `result`; for the other stages
                `result` is null.'
        required: true
      responses:
        '200':
          description: Acknowledged. Any 2xx is accepted and the body is ignored.
          content:
            application/json:
              schema: {}
components:
  schemas:
    Body_extractOcr:
      properties:
        request_id:
          type: string
          title: Request Id
          description: request_id minted by the orchestrator
          examples:
          - OCR_9cb01af2-493d-446d-b191-af120333f6d0
        document_type:
          type: string
          title: Document Type
          description: Document type chosen by the client. Only `npwp` is supported
          default: npwp
          examples:
          - npwp
        params:
          anyOf:
          - type: string
          - type: 'null'
          title: Params
          description: 'Client metadata as JSON: an object, or a quoted string. Not interpreted; returned
            unchanged in `params`'
          examples:
          - '{"nik": "3123456711950001", "refno": "PK19039Y8U"}'
        file:
          anyOf:
          - type: string
            format: binary
          - type: string
          - type: 'null'
          title: File
          description: Document image (JPEG/PNG/PDF). Omit when sending file_url.
        file_url:
          anyOf:
          - type: string
          - type: 'null'
          title: File Url
          description: URL this service fetches the document image from (e.g. a presigned MinIO GET).
            Omit when uploading file. The host must be listed in the service's `FILE_URL_ALLOWED_HOSTS`,
            or resolve to a public address when that is empty; redirects are not followed.
      type: object
      required:
      - request_id
      title: Body_extractOcr
    BoundingBox:
      properties:
        x1:
          type: integer
          title: X1
          description: Left
          examples:
          - 190
        y1:
          type: integer
          title: Y1
          description: Top
          examples:
          - 320
        x2:
          type: integer
          title: X2
          description: Right
          examples:
          - 760
        y2:
          type: integer
          title: Y2
          description: Bottom
          examples:
          - 366
      type: object
      required:
      - x1
      - y1
      - x2
      - y2
      title: BoundingBox
    ConfidenceRequest:
      properties:
        npwp:
          anyOf:
          - type: string
          - type: 'null'
          title: Npwp
          description: Extracted NPWP number, digits or printed form; null when not found
          examples:
          - 12.345.678.9-012.000
        npwp_score:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Npwp Score
          description: OCR score of the line the number came from
          examples:
          - 0.98
        npwp_candidate_count:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Npwp Candidate Count
          description: NPWP-shaped numbers found in the document (a card may print a 15- and a 16-digit
            one)
          examples:
          - 1
        name_base:
          anyOf:
          - type: string
          - type: 'null'
          title: Name Base
          description: The name as OCR read it, BEFORE any normalisation or correction (`signals.name_base`
            of the structuring result); null when not found. The model measures the name's shape on this
          examples:
          - PT CONTOH INDONESIA
        name_score:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Name Score
          description: OCR score of the line the name came from
          examples:
          - 0.95
        avg_doc_score:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Avg Doc Score
          description: Mean OCR score over all lines
          examples:
          - 0.91
        min_doc_score:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Min Doc Score
          description: Lowest OCR score over all lines
          examples:
          - 0.62
        flag:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Flag
          description: Review flag of the structuring rules (`flag` of the structuring result); null counts
            as false
          examples:
          - false
        guardrail_probability:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Guardrail Probability
          description: '`document.confidence` of the guardrails result when the document was accepted'
          examples:
          - 0.98
      type: object
      title: ConfidenceRequest
      description: The ML team's scoring payload (nilamnpwp `scoring/schemas.py`, model retrained 21 Sep
        2026).
    ContractField:
      properties:
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
          description: The value read; null when the field was not found
          examples:
          - 12.345.678.9-012.345
        confidence:
          type: integer
          enum:
          - 0
          - 1
          title: Confidence
          description: 1 when the ML team's trust model gives this value a probability of being correct
            of at least `FIELD_CONFIDENCE_THRESHOLD` (0.5 by default); 0 when it is lower, or when there
            is no value
          examples:
          - 1
      type: object
      required:
      - confidence
      title: ContractField
    ErrorResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
