    StageCallback:
      properties:
        request_id:
          type: string
          title: Request Id
          description: The request_id you submitted with `POST /v1/ekstraksi/jobs`
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        stage:
          type: string
          enum:
          - OCR
          - STRUCTURING
          - SCORING
          title: Stage
          description: 'Stage the status is about. Usually the sender''s own stage; when the hand-off
            to the NEXT stage fails after retries, the sender reports `status: FAILED` with the next stage''s
            name, because that stage never received the job and cannot report for itself'
          examples:
          - OCR
        status:
          type: string
          enum:
          - DONE
          - FAILED
          title: Status
          description: Outcome of the stage. `FAILED` of any stage ends the request
          examples:
          - DONE
        result:
          type: 'null'
          title: Result
          description: Always null for OCR and STRUCTURING; read the stage result from GET .../jobs/{request_id}
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
          description: Why it failed; null when `status` is `DONE`
          examples:
          - null
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
          description: 'Only on a rejection: `DOWNSTREAM_VALIDATION_ERROR` when the stage rejected the
            document (a rejecting check of the structuring rules; `error_message` is the Indonesian reason).
            Absent when a stage broke'
          examples:
          - null
      type: object
      required:
      - request_id
      - stage
      - status
      title: StageCallback
      description: Body of the callback a stage POSTs to the orchestrator when it finishes.
    StructuredDocument:
      properties:
        document_type:
          type: string
          title: Document Type
          description: Document type the fields were read as
          examples:
          - npwp
        fields:
          additionalProperties:
            $ref: '#/components/schemas/StructuredField'
          type: object
          title: Fields
          description: 'Always `nomor_npwp`, `nama`, `nama_badan`; a field that was not found has `value:
            null`. A person''s card fills `nama`, a company''s (PT, CV, ...) fills `nama_badan`. A 15-digit
            number is formatted `XX.XXX.XXX.X-XXX.XXX`; a 16-digit NIK-based number is 16 plain digits,
            and wins when a card prints both'
          examples:
          - nama:
              confidence: 0.9773
              signals:
                corrected: false
                name_base: BUDI SANTOSO
              source: BUDI SANTOSO
              value: BUDI SANTOSO
            nama_badan:
              confidence: 0.0
            nomor_npwp:
              confidence: 0.9992
              signals:
                candidate_count: 1
                has_homoglyph: false
              source: 'NPWP : 12.345.678.9-012.345'
              value: 12.345.678.9-012.345
        flag:
          type: boolean
          title: Flag
          description: 'Flag of the ML team''s rules, a feature of the trust model. True when: another
            document is bundled in (KTP, KK, Akta), the page is a CAPTCHA or a screenshot of the DJP lookup,
            the number or the name was not found, the name is a single word, the number contains a letter,
            its province / kecamatan / birthdate / KPP code is invalid, or the upload has more than 2
            pages'
          examples:
          - false
        flag_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Flag Reason
          description: The first reason `flag` is true, in Indonesian; null when not flagged
          examples:
          - null
        reject_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reject Reason
          description: The first reason that rejects the document, in Indonesian; null when the document
            is accepted. Every check rejects except a single-word name and a letter in the number, which
            only raise `flag`. In the pipeline a rejected document stops here (no scoring) and the client
            gets a 400 with this message
          examples:
          - null
      type: object
      required:
      - document_type
      - fields
      - flag
      title: StructuredDocument
    StructuredField:
      properties:
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
          description: null when the field was not found
          examples:
          - 12.345.678.9-012.345
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          description: OCR score of the line the value came from; 0 when not found
          examples:
          - 0.9992
        source:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
          description: Raw OCR line the value came from
          examples:
          - 'NPWP : 12.345.678.9-012.345'
        signals:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Signals
          description: 'Inputs for the scoring model and review signals (backend `npwp_rules` only; null
            otherwise). nomor_npwp: `candidate_count` (NPWP-shaped numbers found in the document), `has_homoglyph`
            (OCR read a letter where a digit belongs; the letter is dropped, not corrected), `invalid_province_prefix`
            / `invalid_kecamatan_prefix` / `invalid_birthdate` (a 16-digit NIK-based number fails the
            Kode Wilayah or birthdate check), `invalid_kpp_prefix` (a 15-digit number''s KPP office code
            is unknown). nama / nama_badan: `name_base` (the read before any normalisation; the trust
            model measures the name on this), `corrected` (`value` differs from `name_base`)'
          examples:
          - candidate_count: 1
            has_homoglyph: false
      type: object
      required:
      - confidence
      title: StructuredField
    StructuringJobStatus:
      properties:
        request_id:
          type: string
          title: Request Id
          description: request_id of the pipeline run
          examples:
