openapi: 3.1.0
info:
  title: 'NILAM OCR NPWP: gateway integration API'
  version: 1.0.0
  description: "Everything the gateway / orchestrator needs to integrate the NPWP OCR pipeline, merged\
    \ from the four\nservices' own specs. Each service also serves its full Swagger UI at `/docs`.\n\n\
    ## The flow\n\n1. **`POST /v1/extract-ocr`** on the *guardrails* service (port `8031`) with your `request_id`\
    \ and the document\n   (`file` or `file_url`, optional `params`). This is the only call you make,\
    \ and it answers in the\n   orchestrator's `extract-ocr` contract (`job_status`, `data`, `guardrails`,\
    \ `params`):\n   - rejected by the guardrails model -> **400**, `errors: DOWNSTREAM_VALIDATION_ERROR`,\
    \ `guardrails: 0`;\n     nothing runs and no callback follows.\n   - passed -> the document goes on\
    \ to the OCR stage and the service waits for the pipeline for up to\n     `PIPELINE_WAIT_SECONDS`\
    \ (15 s by default, counted from the request's arrival). Finished in time ->\n     **200**, `job_status:\
    \ completed`, `data` = `nomor_npwp` and `nama` as `{value, confidence}` with\n     confidence 0/1;\
    \ a stage failed -> **422** `OCR_FAILED` / `STRUCTURING_FAILED` / `SCORING_FAILED`; still\n     running\
    \ -> **202**, `job_status: processing`. Give this call an HTTP timeout well above the wait.\n2. **Receive\
    \ callbacks** (see *Webhooks*): `OCR` -> `STRUCTURING` -> `SCORING`, each `DONE` or\n   `FAILED`,\
    \ sent in every case after a hand-off. The `SCORING` / `DONE` callback carries the **final\n   result**\
    \ (richer than `data`: OCR scores, trust probabilities, the guardrails report). A `FAILED`\n   callback\
    \ of any stage ends the request.\n3. **Reconcile when needed** with `GET /v1/<stage>/jobs/{request_id}`\
    \ on the stage's own service.\n\nTime a request out on your side: a stage that crashes mid-job cannot\
    \ send its callback.\n\n## What the result is, and is not\n\n`fields` holds `nomor_npwp`, `nama`,\
    \ `nama_badan`. `scoring` holds `npwp_confidence` and\n`name_confidence`: the probability, from the\
    \ ML team's trust model, that each extracted field is\ncorrect. There is **no document-level score\
    \ and no approve / reject decision**; thresholds are yours.\n\n## Addresses\n\nEach operation lists\
    \ the servers of the service that owns it. Inside GKE the four services share one\nService; from another\
    \ namespace: `http://nilam-ocr-npwp.nilam-ocr-npwp.svc.cluster.local:<port>` with\nguardrails `8031`,\
    \ ekstraksi `8030`, structuring `8032`, scoring `8033`. Nothing is exposed outside\nthe cluster.\n\
    \n\n## Conventions (the same for every nilam-ocr service)\n\n**Authentication.** Every endpoint except\
    \ `/health`, `/ready` and `/metrics` requires the header `X-API-Key`.\nA missing or wrong key answers\
    \ `401`. The services are reachable only from inside the cluster.\n\n**Envelope.** Every JSON response,\
    \ success or error, has the same shape:\n`{status_code, status_desc, message, data, errors, request_id}`.\
    \ `status_code` always equals the HTTP\nstatus. On success `errors` is null; on error `data` is null.\n\
    \n**Errors.** `errors` is machine-readable: `VALIDATION_ERROR` for `422`, otherwise the same text\
    \ as\n`message`. `400` = the request or the document is unusable (do not retry unchanged). `401` =\
    \ API key.\n`404` = unknown request_id. `409` = request_id already processed (legacy contract only).\
    \ `422` = a\nfield is missing or has the wrong type. `500` = this service or its model failed. `503`\
    \ = a\ndependency is unreachable, `504` = it did not answer in time (both are safe to retry).\n\n\
    **request_id.** Minted by the orchestrator and carried through every stage. Where an endpoint has\
    \ no\nrequest_id of its own, the `X-Request-ID` request header is used (and echoed in the response\
    \ header);\nwithout it the service generates one.\n\n**Asynchronous stages.** `POST .../jobs` answers\
    \ `202` immediately and does the work in the\nbackground. The outcome is reported by a callback to\
    \ the orchestrator (see *Webhooks*), and can be\nread at any time with `GET .../jobs/{request_id}`.\
    \ Submitting the same request_id again is idempotent:\n`202` with `duplicate: true`, the work is not\
    \ repeated, unless the earlier attempt `FAILED` or has been\n`PROCESSING` for longer than the job\
    \ lease (`PIPELINE_JOB_LEASE_SECONDS`, 5 minutes by default: the\nprocess running it died). A job\
    \ still running when the service shuts down is reported `FAILED`. Because\nthe request was already\
    \ answered `202`, a problem with the document itself (unreadable file, no text,\nunsupported document\
    \ type) shows up as a `FAILED` job and callback, not as a `4xx`.\n"
tags:
- name: 1. Start the pipeline
  description: 'The only call you make: guardrails check, then OCR -> structuring -> scoring, waited on
    for up to PIPELINE_WAIT_SECONDS; answers in the orchestrator''s extract-ocr contract. 200: `completed`
    with the fields. 202: still `processing`, the result arrives by callback. 400: rejected. 422: a stage
    failed.'
- name: 2. Callbacks (you implement this)
  description: 'Listed under **Webhooks**: the request each stage sends to you when it finishes.'
- name: 3. Reconciliation
  description: Read a stage's status and result directly, e.g. after a missed callback or a timeout.
paths:
  /v1/extract-ocr:
    post:
      tags:
      - 1. Start the pipeline
      summary: Judge a document, run the pipeline, answer with the OCR result or 202
      description: '**The only call the orchestrator makes.** Judges the document with the guardrails
        model, hands it to the OCR stage when it passes, then waits for OCR -> structuring -> scoring
        for up to `PIPELINE_WAIT_SECONDS` (15 s by default), counted from when this request arrived. The
        response follows the orchestrator''s `extract-ocr` contract:


        | Outcome | HTTP | `job_status` | `data` | `guardrails` | `errors` |

        |---|---|---|---|---|---|

        | Finished in time | 200 | `completed` | the fields | `1` | null |

        | Still running | 202 | `processing` | null | null | null |

        | Rejected by the guardrails model | 400 | `failed` | null | `0` | `DOWNSTREAM_VALIDATION_ERROR`
        |

        | Rejected by the structuring rules | 400 | `failed` | null | `0` | `DOWNSTREAM_VALIDATION_ERROR`
        |

        | A stage failed in time | 422 | `failed` | null | `1` | `OCR_FAILED`, `STRUCTURING_FAILED` or
        `SCORING_FAILED` |


        `data` holds `nomor_npwp` and `nama` as `{value, confidence}`; `nama` is the taxpayer''s name,
        or the registered name on a company''s card. `confidence` is `1` when the ML team''s trust model
        gives the value a probability of being correct of at least `FIELD_CONFIDENCE_THRESHOLD` (0.5 by
        default), else `0`. `params` is returned as sent.


        **Rejected by the structuring rules**: the ML team''s rules reject a document that is blurred
        or blank, not in the standard NPWP format, another document or bundled with one, a screenshot
        of the online NPWP lookup, longer than the page limit, or whose number carries an invalid birthdate,
        province, kecamatan or KPP code. `message` is the rules'' Indonesian reason, e.g. `Kode provinsi
        pada NPWP tidak valid, mohon dicek kembali`. A single-word name or a letter in the number is tolerated:
        the fields are returned, and the trust model''s confidence already accounts for it.


        **Refused before anything runs** (plain error envelope, no `job_status`): a document above `MAX_UPLOAD_BYTES`
        (2.5 MB by default) answers `413`, one with more than `GUARDRAILS_MAX_DOCUMENT_PAGES` (2) pages
        answers `400`, both with an Indonesian `message` the client can show as is.


        After a hand-off the `OCR`, `STRUCTURING` and `SCORING` callbacks are sent in every case; on 202
        the result arrives in the SCORING callback. Give this call an HTTP timeout well above `PIPELINE_WAIT_SECONDS`
        (e.g. +15 s) to cover a slow guardrails check or hand-off.


        Send `request_id` plus the document as `file`, or as `file_url` (downloaded here once, then forwarded
        as a file, so the URL only has to live for this call); exactly one of the two. The raw guardrails
        report (per-page probabilities) is not part of this response: it travels down the pipeline, comes
        back in the SCORING callback, and `POST /v1/guardrails/check` returns it on its own.


        **Idempotency.** The same request_id again re-runs the guardrails check, but the pipeline does
        not run twice unless the earlier attempt `FAILED` or outlived the job lease (`PIPELINE_JOB_LEASE_SECONDS`);
        a request_id that already finished answers 200 with its stored result.'
      operationId: extractOcr
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_extractOcr'
        required: true
      responses:
        '200':
          description: Accepted and finished within the wait
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              examples:
                completed:
                  summary: The OCR result
                  value:
                    status_code: 200
                    status_desc: OK
                    message: OCR extraction completed successfully
                    data:
                      nomor_npwp:
                        value: 12.345.678.9-012.345
                        confidence: 1
                      nama:
                        value: BUDI SANTOSO
                        confidence: 1
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                    document_type: npwp
                    guardrails: 1
                    params:
                      nik: '3123456711950001'
                      refno: PK19039Y8U
        '202':
          description: 'Accepted, but still running when the wait ran out: the result follows in the SCORING
            callback'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              examples:
                processing:
                  summary: Still processing
                  value:
                    status_code: 202
                    status_desc: Accepted
                    message: OCR job accepted; still processing
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                    document_type: npwp
                    job_status: processing
                    params:
                      nik: '3123456711950001'
                      refno: PK19039Y8U
        '400':
          description: 'Rejected by the guardrails model or by the structuring rules (`DOWNSTREAM_VALIDATION_ERROR`,
            `guardrails: 0`), unsupported `document_type` (`UNSUPPORTED_DOCUMENT_TYPE`), more than `GUARDRAILS_MAX_DOCUMENT_PAGES`
            pages (`Jumlah halaman melebihi batas, pastikan hanya mengunggah dokumen NPWP`), or a bad
            file / intake (empty, unsupported type, unreadable, `file_url` refused)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              example:
                status_code: 400
                status_desc: Bad Request
                message: 'Document rejected by guardrails: 1/1 page(s) rejected (confidence 0.88)'
                errors: DOWNSTREAM_VALIDATION_ERROR
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                document_type: npwp
                job_status: failed
                guardrails: 0
                params:
                  nik: '3123456711950001'
                  refno: PK19039Y8U
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
        '413':
          description: The document exceeds `MAX_UPLOAD_BYTES` (2.5 MB by default); nothing was started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 413
                status_desc: Payload Too Large
                message: Ukuran dokumen melebihi batas 2,5 MB, pastikan hanya mengunggah dokumen NPWP
                errors: Ukuran dokumen melebihi batas 2,5 MB, pastikan hanya mengunggah dokumen NPWP
        '422':
          description: A pipeline stage failed within the wait (`OCR_FAILED`, `STRUCTURING_FAILED`, `SCORING_FAILED`;
            `message` says why), `params` is not valid JSON (`INVALID_PARAMS`), or a required field is
            missing (`VALIDATION_ERROR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: No text lines to structure
                errors: STRUCTURING_FAILED
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                document_type: npwp
                job_status: failed
                guardrails: 1
                params:
                  nik: '3123456711950001'
                  refno: PK19039Y8U
        '500':
          description: The guardrails model or the ekstraksi service failed or answered in an unexpected
            shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 500
                status_desc: Internal Server Error
                message: guardrails model returned an unexpected response
                errors: guardrails model returned an unexpected response
        '503':
          description: The ekstraksi service (or the remote guardrails model) is unreachable; nothing
            was started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 503
                status_desc: Service Unavailable
                message: ekstraksi service is unavailable
                errors: ekstraksi service is unavailable
        '504':
          description: The ekstraksi service (or the remote guardrails model) did not answer in time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 504
                status_desc: Gateway Timeout
                message: ekstraksi service timed out after 10.0s
                errors: ekstraksi service timed out after 10.0s
      security:
      - APIKeyHeader: []
      servers:
      - url: http://guardrails.nilam-ocr-{environment}.svc.cluster.local:8031
        description: GKE, from another namespace (e.g. the orchestrator / gateway)
        variables:
          environment:
            enum:
            - dev
            - staging
            - production
            default: dev
            description: 'One namespace per environment: nilam-ocr-<environment>'
      - url: http://guardrails:8031
        description: GKE from the same namespace, or the Docker Compose network
      - url: http://127.0.0.1:8031
        description: Local development
  /v1/ekstraksi/jobs/{request_id}:
    get:
      tags:
      - 3. Reconciliation
      summary: Status and result of the OCR stage
      description: Status of this stage only, and its raw OCR result once `DONE`. The orchestrator normally
        learns the status from the callback; use this to reconcile after a missed callback, or to debug.
        The later stages have the same endpoint on their own service (`/v1/structuring/jobs/{request_id}`,
        `/v1/scoring/jobs/{request_id}`).
      operationId: getOcrJob
      security:
      - APIKeyHeader: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      responses:
        '200':
          description: The job exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrJobStatusResponse'
              examples:
                processing:
                  summary: Still running
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: OCR
                      created_at: '2026-09-18T04:00:00+00:00'
                      status: PROCESSING
                      updated_at: '2026-09-18T04:00:00+00:00'
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                done:
                  summary: Finished
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: OCR
                      created_at: '2026-09-18T04:00:00+00:00'
                      status: DONE
                      result:
                        engine: paddle
                        model: PP-OCRv6_medium_det+PP-OCRv6_medium_rec
                        elapsed_ms: 412.5
                        full_text: 'DIREKTORAT JENDERAL PAJAK

                          NPWP : 12.345.678.9-012.345

                          BUDI SANTOSO'
                        blocks:
                        - text: DIREKTORAT JENDERAL PAJAK
                          confidence: 0.9985
                          bbox:
                            x1: 175
                            y1: 247
                            x2: 887
                            y2: 308
                          page: 0
                        - text: 'NPWP : 12.345.678.9-012.345'
                          confidence: 0.9992
                          bbox:
                            x1: 35
                            y1: 389
                            x2: 637
                            y2: 437
                          page: 0
                        - text: BUDI SANTOSO
                          confidence: 0.9773
                          bbox:
                            x1: 33
                            y1: 480
                            x2: 483
                            y2: 523
                          page: 0
                      updated_at: '2026-09-18T04:00:01+00:00'
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                failed:
                  summary: 'Failed: same `error_message` as the FAILED callback. Resubmitting the request_id
                    runs it again'
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: OCR
                      created_at: '2026-09-18T04:00:00+00:00'
                      status: FAILED
                      error_message: ekstraksi OCR model is unavailable
                      updated_at: '2026-09-18T04:00:03+00:00'
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No OCR job for this request_id
          content:
            application/json:
              example:
                status_code: 404
                status_desc: Not Found
                message: 'No OCR job found for request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0'
                errors: 'No OCR job found for request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0'
                request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'path.request_id: Field required'
                errors: VALIDATION_ERROR
                request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      servers:
      - url: http://ekstraksi.nilam-ocr-{environment}.svc.cluster.local:8030
        description: GKE, from another namespace (e.g. the orchestrator / gateway)
        variables:
          environment:
            enum:
            - dev
            - staging
            - production
            default: dev
            description: 'One namespace per environment: nilam-ocr-<environment>'
      - url: http://ekstraksi:8030
        description: GKE from the same namespace, or the Docker Compose network
      - url: http://127.0.0.1:8030
        description: Local development
  /v1/structuring/jobs/{request_id}:
    get:
      tags:
      - 3. Reconciliation
      summary: Status and result of the structuring stage
      description: Status of this stage only, and its structured fields once `DONE`. The orchestrator
        normally learns the status from the callback; use this to reconcile after a missed callback, or
        to debug.
      operationId: getStructuringJob
      security:
      - APIKeyHeader: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      responses:
        '200':
          description: The job exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuringJobStatusResponse'
              examples:
                done:
                  summary: Finished
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: STRUCTURING
                      created_at: '2026-09-18T04:00:01+00:00'
                      status: DONE
                      result:
                        document_type: npwp
                        fields:
                          nomor_npwp:
                            value: 12.345.678.9-012.345
                            confidence: 0.9992
                            source: 'NPWP : 12.345.678.9-012.345'
                            signals:
                              candidate_count: 1
                              has_homoglyph: false
                              invalid_province_prefix: false
                              invalid_kecamatan_prefix: false
                              invalid_birthdate: false
                              invalid_kpp_prefix: false
                          nama:
                            value: BUDI SANTOSO
                            confidence: 0.9773
                            source: BUDI SANTOSO
                            signals:
                              name_base: BUDI SANTOSO
                              corrected: false
                          nama_badan:
                            confidence: 0.0
                        flag: false
                      updated_at: '2026-09-18T04:00:01+00:00'
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                failed:
                  summary: 'Failed: the upload was not a lone NPWP card'
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: STRUCTURING
                      created_at: '2026-09-18T04:00:01+00:00'
                      status: FAILED
                      error_message: Upload contains another document (KARTU TANDA PENDUDUK); send the
                        NPWP card only
                      updated_at: '2026-09-18T04:00:01+00:00'
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No structuring job for this request_id
          content:
            application/json:
              example:
                status_code: 404
                status_desc: Not Found
                message: 'No STRUCTURING job found for request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0'
                errors: 'No STRUCTURING job found for request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0'
                request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'path.request_id: Field required'
                errors: VALIDATION_ERROR
                request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      servers:
      - url: http://structuring.nilam-ocr-{environment}.svc.cluster.local:8032
        description: GKE, from another namespace (e.g. the orchestrator / gateway)
        variables:
          environment:
            enum:
            - dev
            - staging
            - production
            default: dev
            description: 'One namespace per environment: nilam-ocr-<environment>'
      - url: http://structuring:8032
        description: GKE from the same namespace, or the Docker Compose network
      - url: http://127.0.0.1:8032
        description: Local development
  /v1/scoring/jobs/{request_id}:
    get:
      tags:
      - 3. Reconciliation
      summary: Status and result of the scoring stage
      description: Status of this stage only and, once `DONE`, the two confidences plus the exact payload
        that was scored. The orchestrator normally receives the final result in the `SCORING` callback;
        use this to reconcile after a missed callback, or to audit a score.
      operationId: getScoringJob
      security:
      - APIKeyHeader: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      responses:
        '200':
          description: The job exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoringJobStatusResponse'
              examples:
                done:
                  summary: Finished
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: SCORING
                      created_at: '2026-09-18T04:00:01+00:00'
                      status: DONE
                      result:
                        npwp_confidence: 0.9806
                        name_confidence: 0.9948
                        payload:
