<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NILAM OCR NPWP API</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css" />
    <style>
      body { margin: 0; background: #fafafa; }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
    <script>
      window.ui = SwaggerUIBundle({
        urls: [
          { name: "Gateway integration (start here)", url: "./gateway.openapi.yaml" },
          { name: "orchestrator (full)", url: "../services/orchestrator/openapi.yaml" },
          { name: "guardrails (full)", url: "../services/guardrails/openapi.yaml" },
          { name: "extraction (full)", url: "../services/extraction/openapi.yaml" },
          { name: "structuring (full)", url: "../services/structuring/openapi.yaml" },
          { name: "scoring (full)", url: "../services/scoring/openapi.yaml" },
        ],
        "urls.primaryName": "Gateway integration (start here)",
        dom_id: "#swagger-ui",
        deepLinking: true,
        docExpansion: "list",
        defaultModelsExpandDepth: 0,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: "StandaloneLayout",
      });
    </script>
  </body>
</html>
