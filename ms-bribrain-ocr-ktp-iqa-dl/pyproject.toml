[project]
name = "ms-bribrain-ocr-ktp-iqa-dl-rev"
version = "1.0.0"
description = "KTP Image Quality Assessment API using MobileNet classifier"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "fastapi==0.128.0",  # pinned: 0.128.1 changed routing internals (_IncludedRouter) that elastic-apm 6.25.0 can't parse (matches working dgc_tpr)
    "uvicorn>=0.34.0",
    "pydantic>=2.10.5",
    "pyyaml>=6.0.1",
    "pillow>=10.2.0",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg>=3.3.2",
    "psycopg-binary>=3.3.2",
    "minio>=7.2.11",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.2.1",
    "google-auth>=2.48.0",
    "google-cloud-storage>=3.9.0",
    "elastic-apm>=6.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "black>=24.10.0",
    "ruff>=0.8.5",
]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/integration"]
markers = [
    "e2e: end-to-end tests against the real service",
]
