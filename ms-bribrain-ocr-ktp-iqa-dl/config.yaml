model:
  path: ./src/models/qualitydl_model.pth
  num_classes: 2
  img_height: 64
  img_width: 320
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]
  use_compile: true
  compile_mode: "default"

prediction:
  confidence_threshold: 0.67
  bad_crop_threshold: 4
  batch_max_files: 10

crop_filter:
  min_width_ratio: 1.0
  min_width: 0

image:
  max_size_mb: 1

server:
  host: 0.0.0.0
  port: 8100
  thread_pool_workers: 4
  cors_allowed_origins:
    - "https://api-bribrain.dev.example.com"
    - "https://api-brispot.dev.example.com"
    - "https://api-brispot-testing.dev.example.com"
    - "https://api-brispot-staging.dev.example.com"
    - "https://api-staging.example.com"
  cors_allowed_credentials: true
  cors_allowed_methods: ["*"]
  cors_allowed_headers: ["*"]

logging:
  logger_name: "quality"
  log_to_database: true
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - [%(request_id)s] - %(message)s"
  file:
    enabled: true
    path: "logs/ocr_quality.log"
    max_bytes: 10485760
    backup_count: 5

device:
  force_cpu: false

database:
  table_name: "bribrain_ocr_ktp_iqa_dl"
  schema: "public"
  pool_size: 5
  max_overflow: 10
  pool_pre_ping: true
  pool_recycle: 3600
  pool_timeout: 10
  connect_timeout: 5

gcs:
  bucket_name: "gc-bribrain-dev-gcs-iguru-01"
  prefix: "ocr_models/qualitydl_models/"
  model_prefix: "qualitydl_model"

minio:
  bucket: bribrain-webviewasset-dev
  object: ocr_ktp_models/quality_model.pth

api:
  title: "KTP Image Quality Classifier API"
  description: "Classifies KTP image quality by analyzing OCR text crop quality. Predicts good/bad for each crop and determines overall image quality based on bad crop threshold."
  version: "1.0.0"

debug_mode: false

# Elastic APM Configuration
elastic_apm:
  enabled: true
  server_url: "${ELASTIC_APM_SERVER_URL}"
  service_name: "${ELASTIC_APM_SERVICE_NAME:-ocr-ktp-iqa-dl}"
  environment: "${ELASTIC_APM_ENVIRONMENT:-dev}"
  secret_token: "${ELASTIC_APM_SECRET_TOKEN}"
  verify_server_cert: false

# Threshold provider — periodically refreshes thresholds from
# `ms-bribrain-manage-thservice` so model thresholds can be updated
# centrally without redeploying this service.
threshold_provider:
  refresh_interval_seconds: 3600   # how often to re-read from DB (seconds)
  table_name: "bribrain_model_thresholds"
  schema: "public"
  pool_size: 2
  max_overflow: 2
  pool_recycle: 3600
