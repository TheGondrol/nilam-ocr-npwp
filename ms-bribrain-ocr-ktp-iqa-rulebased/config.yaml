# Application settings
app:
  name: "OCR Quality Service"
  version: "0.1.0"
  debug: false

# Server settings
server:
  host: "0.0.0.0"
  port: 8000
  workers: 1
  max_file_size_mb: 1

# Device settings
device:
  prefer_gpu: true
  fallback_to_cpu: true

# Image quality thresholds
quality:
  blur:
    enabled: false
    threshold: 100.0
  confidence:
    enabled: true
    threshold_median: 0.8
  glare:
    enabled: false
    min_area: 100
    padding_size: 20
    kernel_size: 5 # Morphological kernel size for noise cleanup
    min_text_confidence: 0.6 # Minimum OCR confidence to consider text for glare analysis
    affected_percentage_threshold: 5 # Minimum % of text area affected to flag as glare
  rotation:
    enabled: true
    min_face_proportion: 0.12
    face_detection_confidence: 0.5 # InsightFace RetinaFace detection confidence threshold
    det_size: [640, 640] # InsightFace detector input size (width, height)
    verification_box_width_ratio: 0.3 # Width of verification box as ratio of image width
    verification_box_height_ratio: 0.6 # Height of verification box as ratio of image height
    verification_box_margin_ratio: 0.02 # Right margin as ratio of image width
    verification_box_vertical_center: 0.44 # Vertical center position as ratio

# CORS Configuration
cors:
  # Allowed origins (use ["*"] to allow all)
  allow_origins:
    - "https://api-bribrain.dev.example.com"
    - "https://api-brispot.dev.example.com"
    - "https://api-brispot-testing.dev.example.com"
    - "https://api-brispot-staging.dev.example.com"
    - "https://api-staging.example.com"
  # Allow credentials (cookies, authorization headers)
  allow_credentials: true
  # Allowed HTTP methods (use ["*"] to allow all)
  allow_methods:
    - "POST"
    - "GET"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  # Allowed headers (use ["*"] to allow all)
  allow_headers:
    - "*"

# Logging settings
logging:
  log_to_database: true
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - [%(request_id)s] - %(message)s"
  file:
    enabled: true
    path: "logs/ocr_quality.log"
    max_bytes: 10485760 # 10MB
    backup_count: 5
  console:
    enabled: true

# Database settings
database:
  table_name: "bribrain_ocr_ktp_iqa_rulebased"
  schema: "public"
  pool_size: 5
  max_overflow: 10
  pool_pre_ping: true
  pool_recycle: 3600
  pool_timeout: 10
  connect_timeout: 5

# Elastic APM Configuration
elastic_apm:
  enabled: true
  server_url: "${ELASTIC_APM_SERVER_URL}"
  service_name: "${ELASTIC_APM_SERVICE_NAME:-ocr-ktp-iqa-rulebased}"
  environment: "${ELASTIC_APM_ENVIRONMENT:-dev}"
  secret_token: "${ELASTIC_APM_SECRET_TOKEN}"
  verify_server_cert: false

# Threshold provider — periodically refreshes thresholds from
# `ms-bribrain-manage-thservice` so model thresholds can be updated
# centrally without redeploying this service.
threshold_provider:
  refresh_interval_seconds: 3600   # how often to re-read from DB (seconds)
  table_name: "bribrain_model_thresholds"
  schema: "public"
  pool_size: 2
  max_overflow: 2
  pool_recycle: 3600
