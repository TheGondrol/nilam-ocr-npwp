[project]
name = "ms-bribrain-ocr-quality"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.124.0",
    "insightface>=0.7.3; sys_platform != 'win32'",
    "onnxruntime>=1.17",
    # onnx 1.19 (pulled in by insightface) uses ml_dtypes.float4_e2m1fn but
    # doesn't pin ml-dtypes>=0.5 itself, so we pin it here.
    "ml-dtypes>=0.5; sys_platform != 'win32'",
    "python-multipart>=0.0.20",
    "uvicorn>=0.38.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "psycopg>=3.3.2",
    "psycopg-binary>=3.3.2",
    "sqlalchemy>=2.0.45",
    "python-dotenv>=1.0.0",
    "ruff>=0.14.10",
    "asyncpg>=0.29.0",
    "elastic-apm>=6.20.0",
    "cryptography>=46.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "aiosqlite>=0.19.0",
    "faker>=22.0.0",
    "httpx>=0.24.0,<0.27.0",
]
[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests against the real service",
]
