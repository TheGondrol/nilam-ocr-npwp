apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nilam-ocr-staging
resources:
  - ../../base

configMapGenerator:
  - name: guardrails-config
    behavior: merge
    literals:
      - ENVIRONMENT=staging
  - name: ekstraksi-config
    behavior: merge
    literals:
      - ENVIRONMENT=staging
      - EKSTRAKSI_OCR_URL=http://REPLACE_ME:8070
      # Hanya kalau Orkestrasi punya endpoint callback; kosong = hasil lewat ORCHESTRATION_OUTCOME_TABLE
      # - ORCHESTRATION_URL=http://REPLACE_ME-orchestration.REPLACE_ME-namespace.svc.cluster.local:8000
      - ORCHESTRATION_OUTCOME_TABLE=orchestration_extract_ocr
  - name: structuring-config
    behavior: merge
    literals:
      - ENVIRONMENT=staging
      # Hanya kalau Orkestrasi punya endpoint callback; kosong = hasil lewat ORCHESTRATION_OUTCOME_TABLE
      # - ORCHESTRATION_URL=http://REPLACE_ME-orchestration.REPLACE_ME-namespace.svc.cluster.local:8000
      - ORCHESTRATION_OUTCOME_TABLE=orchestration_extract_ocr
  - name: scoring-config
    behavior: merge
    literals:
      - ENVIRONMENT=staging
      # Hanya kalau Orkestrasi punya endpoint callback; kosong = hasil lewat ORCHESTRATION_OUTCOME_TABLE
      # - ORCHESTRATION_URL=http://REPLACE_ME-orchestration.REPLACE_ME-namespace.svc.cluster.local:8000
      - ORCHESTRATION_OUTCOME_TABLE=orchestration_extract_ocr

images:
  - name: nilam-ocr-guardrails
    newName: asia-southeast2-docker.pkg.dev/REPLACE_ME-staging-project/nilam-ocr/guardrails
    newTag: REPLACE_ME
  - name: nilam-ocr-ekstraksi
    newName: asia-southeast2-docker.pkg.dev/REPLACE_ME-staging-project/nilam-ocr/ekstraksi
    newTag: REPLACE_ME
  - name: nilam-ocr-structuring
    newName: asia-southeast2-docker.pkg.dev/REPLACE_ME-staging-project/nilam-ocr/structuring
    newTag: REPLACE_ME
  - name: nilam-ocr-scoring
    newName: asia-southeast2-docker.pkg.dev/REPLACE_ME-staging-project/nilam-ocr/scoring
    newTag: REPLACE_ME

replicas:
  - name: guardrails
    count: 2
  - name: ekstraksi
    count: 2
  - name: structuring
    count: 2
  - name: scoring
    count: 2

patches:
  - target: {kind: ServiceAccount, name: nilam-ocr}
    patch: |-
      - op: replace
        path: /metadata/annotations/iam.gke.io~1gcp-service-account
        value: nilam-ocr@REPLACE_ME-staging-project.iam.gserviceaccount.com
  - target: {kind: NetworkPolicy, name: allow-orchestration}
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: REPLACE_ME-orchestration-namespace
