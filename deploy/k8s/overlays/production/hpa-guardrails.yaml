# Hanya guardrails yang CPU-bound (inference torch), jadi hanya dia yang masuk akal
# diskalakan dari CPU. Tiga service lain menunggu I/O; skalakan lewat `replicas`.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: guardrails
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: guardrails
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300 # image 1,7 GB: pod baru mahal, jangan cepat-cepat dibuang
