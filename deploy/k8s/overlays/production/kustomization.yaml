apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nilam-ocr-production
resources:
  - ../../base
  - hpa-guardrails.yaml

configMapGenerator:
  - name: guardrails-config
    behavior: merge
    literals:
      - ENVIRONMENT=production
  - name: ekstraksi-config
    behavior: merge
    literals:
      - ENVIRONMENT=production
      - EKSTRAKSI_OCR_URL=http://REPLACE_ME:8070
      - ORCHESTRATION_URL=http://REPLACE_ME-orchestration.REPLACE_ME-namespace.svc.cluster.local:8000
  - name: structuring-config
    behavior: merge
    literals:
      - ENVIRONMENT=production
      - ORCHESTRATION_URL=http://REPLACE_ME-orchestration.REPLACE_ME-namespace.svc.cluster.local:8000
  - name: scoring-config
    behavior: merge
    literals:
      - ENVIRONMENT=production
      - ORCHESTRATION_URL=http://REPLACE_ME-orchestration.REPLACE_ME-namespace.svc.cluster.local:8000

images:
  - name: nilam-ocr-guardrails
    newName: asia-southeast2-docker.pkg.dev/REPLACE_ME-prod-project/nilam-ocr/guardrails
    newTag: REPLACE_ME
  - name: nilam-ocr-ekstraksi
    newName: asia-southeast2-docker.pkg.dev/REPLACE_ME-prod-project/nilam-ocr/ekstraksi
    newTag: REPLACE_ME
  - name: nilam-ocr-structuring
    newName: asia-southeast2-docker.pkg.dev/REPLACE_ME-prod-project/nilam-ocr/structuring
    newTag: REPLACE_ME
  - name: nilam-ocr-scoring
    newName: asia-southeast2-docker.pkg.dev/REPLACE_ME-prod-project/nilam-ocr/scoring
    newTag: REPLACE_ME

replicas:
  - name: ekstraksi
    count: 2
  - name: structuring
    count: 2
  - name: scoring
    count: 2

patches:
  - target: {kind: ServiceAccount, name: nilam-ocr}
    patch: |-
      - op: replace
        path: /metadata/annotations/iam.gke.io~1gcp-service-account
        value: nilam-ocr@REPLACE_ME-prod-project.iam.gserviceaccount.com
  - target: {kind: NetworkPolicy, name: allow-orchestration}
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: REPLACE_ME-orchestration-namespace
  - target: {kind: Deployment, name: guardrails}
    patch: |-
      - op: remove
        path: /spec/replicas
