apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# I/O-bound (menunggu model OCR). EKSTRAKSI_OCR_URL dan ORCHESTRATION_URL diisi per overlay.
resources:
  - deployment.yaml
  - service.yaml
  - pdb.yaml
# Generator, bukan ConfigMap statis: nama mendapat sufiks hash isi, jadi perubahan
# konfigurasi otomatis memicu rolling update (env hanya dibaca saat pod start).
configMapGenerator:
  - name: ekstraksi-config
    literals:
      - PORT=8030
      - EKSTRAKSI_BACKEND=paddle
      - EKSTRAKSI_OCR_TIMEOUT_SECONDS=60
      - STRUCTURING_SERVICE_URL=http://structuring:8032
      - GUARDRAILS_SERVICE_URL=http://guardrails:8031
      - SCORING_SERVICE_URL=http://scoring:8033
      - PIPELINE_DRAIN_TIMEOUT_SECONDS=30
