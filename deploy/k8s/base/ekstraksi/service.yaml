apiVersion: v1
kind: Service
metadata:
  name: ekstraksi # nama ini adalah alamatnya: http://ekstraksi:8030 di dalam namespace
  labels:
    app.kubernetes.io/name: ekstraksi
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ekstraksi
  ports:
    - name: http
      port: 8030
      targetPort: http
