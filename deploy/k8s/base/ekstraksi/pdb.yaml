apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ekstraksi
spec:
  # maxUnavailable, bukan minAvailable: dengan 1 replika, minAvailable: 1 akan menahan
  # drain node (upgrade GKE) selamanya. Bermakna begitu replika >= 2.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ekstraksi
