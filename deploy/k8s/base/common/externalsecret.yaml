# Rahasia hidup di GCP Secret Manager; External Secrets Operator menyalinnya menjadi
# Secret k8s `nilam-ocr-secrets`. Tidak ada nilai rahasia di git.
# Prasyarat cluster: ESO terpasang + ClusterSecretStore `gcp-secret-manager`.
# Cek versi CRD yang terpasang (`kubectl get crd externalsecrets.external-secrets.io -o
# jsonpath='{.spec.versions[*].name}'`); ESO lama memakai external-secrets.io/v1beta1.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nilam-ocr-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: nilam-ocr-secrets
    creationPolicy: Owner
  data:
    # Satu key untuk keempat service (tiap service memakai API_KEY-nya sendiri sebagai key
    # keluar kalau *_API_KEY kosong). Kalau ingin key per service, tambah entri di sini
    # dan isi STRUCTURING_API_KEY / SCORING_API_KEY di Deployment pemanggilnya.
    - secretKey: API_KEY
      remoteRef:
        key: nilam-ocr-api-key
    # postgresql+asyncpg://<user>:<password>@<host>:5432/<db>. Host = private IP Cloud SQL,
    # atau 127.0.0.1 kalau memakai Cloud SQL Auth Proxy sebagai sidecar.
    - secretKey: DATABASE_URL
      remoteRef:
        key: nilam-ocr-database-url
    # X-API-Key yang dikirim ke Orkestrasi saat callback. Opsional di Deployment:
    # tanpa ini service memakai API_KEY.
    - secretKey: ORCHESTRATION_API_KEY
      remoteRef:
        key: nilam-ocr-orchestration-api-key
