apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nilam-ocr-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: nilam-ocr-secrets
    creationPolicy: Owner
  data:
    - secretKey: API_KEY
      remoteRef:
        key: nilam-ocr-api-key
    - secretKey: DATABASE_URL
      remoteRef:
        key: nilam-ocr-database-url
    - secretKey: ORCHESTRATION_API_KEY
      remoteRef:
        key: nilam-ocr-orchestration-api-key
