apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: nilam-ocr
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-orchestration
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [guardrails, ekstraksi]}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: REPLACE_ME-orchestration-namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ekstraksi-to-structuring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: structuring
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ekstraksi
      ports:
        - port: 8032
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pipeline-to-scoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: scoring
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: structuring
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ekstraksi
      ports:
        - port: 8033
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ekstraksi-to-guardrails-legacy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: guardrails
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ekstraksi
      ports:
        - port: 8031
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-guardrails-to-ekstraksi
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ekstraksi
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: guardrails
      ports:
        - port: 8030
