apiVersion: v1
kind: ServiceAccount
metadata:
  name: nilam-ocr
  annotations:
    # Workload Identity: KSA ini bertindak sebagai GSA di bawah. Di-patch per overlay.
    # GSA hanya butuh akses yang dipakai pod (mis. Cloud SQL Client kalau memakai
    # Auth Proxy). Akses Secret Manager ada di GSA milik External Secrets, bukan di sini.
    iam.gke.io/gcp-service-account: REPLACE_ME@REPLACE_ME.iam.gserviceaccount.com
