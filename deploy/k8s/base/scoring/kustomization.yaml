apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Tahap terakhir: callback-nya membawa hasil akhir. ORCHESTRATION_URL diisi per overlay.
resources:
  - deployment.yaml
  - service.yaml
  - pdb.yaml
# Generator, bukan ConfigMap statis: nama mendapat sufiks hash isi, jadi perubahan
# konfigurasi otomatis memicu rolling update (env hanya dibaca saat pod start).
configMapGenerator:
  - name: scoring-config
    literals:
      - PORT=8033
      - SCORING_BACKEND=heuristic
      - SCORING_APPROVE_THRESHOLD=0.8
      - SCORING_REVIEW_THRESHOLD=0.5
      - PIPELINE_DRAIN_TIMEOUT_SECONDS=30
