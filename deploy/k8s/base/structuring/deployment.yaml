apiVersion: apps/v1
kind: Deployment
metadata:
  name: structuring
  labels:
    app.kubernetes.io/name: structuring
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: structuring
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: structuring
    spec:
      serviceAccountName: nilam-ocr
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: structuring
          image: nilam-ocr-structuring
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8032
          envFrom:
            - configMapRef:
                name: structuring-config
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef: {name: nilam-ocr-secrets, key: API_KEY}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: nilam-ocr-secrets, key: DATABASE_URL}
            - name: ORCHESTRATION_API_KEY
              valueFrom:
                secretKeyRef: {name: nilam-ocr-secrets, key: ORCHESTRATION_API_KEY, optional: true}
            - name: HOME
              value: /tmp
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: "250m"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
