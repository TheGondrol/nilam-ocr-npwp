apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - pdb.yaml
configMapGenerator:
  - name: guardrails-config
    literals:
      - PORT=8031
      - GUARDRAILS_BACKEND=efficientnet
      - GUARDRAILS_MODEL_PATH=weights/best_model.pt
      - GUARDRAILS_DEVICE=cpu
      - GUARDRAILS_TORCH_THREADS=2
      - EKSTRAKSI_SERVICE_URL=http://ekstraksi:8030
      - STRUCTURING_SERVICE_URL=http://structuring:8032
      - SCORING_SERVICE_URL=http://scoring:8033
      - PIPELINE_WAIT_SECONDS=15
