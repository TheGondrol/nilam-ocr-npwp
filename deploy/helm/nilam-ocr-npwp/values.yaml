nameOverride: ""
fullnameOverride: ""

revisionHistoryLimit: 5
# Default untuk semua service; services.<nama>.terminationGracePeriodSeconds menimpanya.
# 45 = drain job 30 dtk (PIPELINE_DRAIN_TIMEOUT_SECONDS) + preStop 5 dtk + cadangan.
terminationGracePeriodSeconds: 45

environment: production

image:
  # Nexus BRI, satu folder untuk aplikasi ini: image = <registry>/ms-bribrain-nilam-ocr-npwp-<service>:<tag>.
  registry: new-nexus.gcp.bri.co.id/bribrain/dev/nilam/nilam-ocr-npwp
  tag: ""
  pullPolicy: IfNotPresent

# Dibuat/diperbarui deploy.sh dari nexus.env sebelum tiap helm upgrade. Generik: dipakai bersama semua service
# dokumen NILAM OCR (NPWP, KTP, KK, ...) di namespace yang sama.
imagePullSecrets:
  - name: nilam-ocr-nexus

existingSecret: nilam-ocr-npwp-secrets
secretKeys:
  apiKey: API_KEY
  # Opsional: key lain yang juga diterima (dipisah koma) selama rotasi; lihat README "API key".
  apiKeys: API_KEYS
  databaseUrl: DATABASE_URL
  orchestrationApiKey: ORCHESTRATION_API_KEY
  # Nilai X-Callback-Key untuk callback hasil Orkestrasi (orchestration.callbackFormat: result).
  callbackKey: ORCHESTRATION_CALLBACK_KEY
  # Opsional: kredensial server Elastic APM, salah satu sesuai server APM-nya (lihat apm di bawah).
  apmSecretToken: ELASTIC_APM_SECRET_TOKEN
  apmApiKey: ELASTIC_APM_API_KEY
  # Client secret app Entra ID untuk identitas GCS (gcpWif di bawah); wajib di Secret begitu gcpWif.clientId diisi.
  gcpWifClientSecret: AZURE_CLIENT_SECRET

# Callback tahap ke Orkestrasi pusat, dikirim oleh ketiga tahap pipeline (bukan oleh orchestrator).
# Kosong = tidak ada callback yang dikirim maupun diantrekan; hasil sampai ke Orkestrasi lewat tabelnya
# sendiri (ORCHESTRATION_OUTCOME_TABLE dan/atau ORCHESTRATION_API_EVENTS_TABLE di commonEnv) dan
# GET /v1/extract-ocr/{request_id} di orchestrator. Tahap pipeline menolak start kalau semuanya kosong.
orchestration:
  url: ""
  callbackPath: /v1/callbacks/stage
  timeoutSeconds: "10"
  # stage  = satu callback per tahap (OCR, STRUCTURING, SCORING) dengan X-API-Key.
  # result = satu callback hasil per request saat selesai (completed dari scoring, failed dari tahap
  #          mana pun) dengan X-Callback-Key dari secretKeys.callbackKey; tanpa key, service menolak start.
  callbackFormat: stage
  # Saklar callback: false = tidak ada callback yang dikirim maupun diantrekan walau url terisi, mis. selama
  # Orkestrasi pusat memasang NPWP di mode poll (setiap callback dijawab 409 CALLBACK_NOT_EXPECTED; mereka
  # membaca GET /v1/extract-ocr/{request_id}). Harus mengikuti mode di sisi mereka.
  callbackEnabled: true
  # Berapa lama outbox mencoba ulang callback yang gagal (5xx / tidak terjangkau). Orkestrasi pusat berhenti
  # menunggu sejumlah detik setelah menjawab 202 (OCR_CALLBACK_DEADLINE_SECONDS di sisi mereka) dan menolak
  # callback sesudahnya dengan 409 RESULT_CONFLICT; samakan dengan nilai itu.
  callbackMaxAgeSeconds: "600"

# Elastic APM di kelima service (libs/ocr_common/ocr_common/web/apm.py). serverUrl kosong = mati: agen tidak dimuat
# dan tidak ada yang dikirim. Token/API key dibaca dari Secret (secretKeys.apmSecretToken / apmApiKey), opsional.
# Isi body dan header request tidak pernah dikirim (dokumen, NPWP, nama, API key).
apm:
  serverUrl: ""
  # Satu nama untuk kelima service. Kosong = nama per service: <serviceNamePrefix>-<service>, atau
  # nilam-ocr-npwp-<service> (bawaan kode) kalau serviceNamePrefix juga kosong.
  serviceName: ""
  serviceNamePrefix: ""
  # Kosong = nilai `environment` di atas.
  environment: ""
  # 1.0 = setiap request dan job dilacak; turunkan kalau volumenya besar.
  transactionSampleRate: "1.0"
  verifyServerCert: true
  # Nama field yang disamarkan, dipisah koma, boleh wildcard (`*token`). Kosong = daftar bawaan agen.
  sanitizeFieldNames: ""
  # Log aplikasi juga dikirim ke server APM ini (OpenTelemetry, OTLP/HTTP /v1/logs; web/log_shipping.py) dan masuk
  # Elasticsearch (logs-apm.app.<service>-default), di bawah service name APM yang sama, seperti log Orkestrasi
  # pusat. Log stderr tetap ada. Hanya berlaku dengan serverUrl.
  logSending: false
  # Level minimum yang dikirim, tidak bisa di bawah LOG_LEVEL. Kosong = INFO.
  logLevel: ""

# Identitas GCP lewat Workload Identity Federation dengan Entra ID (panduan Tim SEA, wif.gcs.env), dipakai service
# dengan `gcsModels: true` untuk mengunduh modelnya dari GCS saat start (<SERVICE>_MODEL_GCS_URI + _SHA256 di
# services.<nama>.env). clientId kosong = tidak dirender; client secret dari Secret (secretKeys.gcpWifClientSecret).
gcpWif:
  tenantId: ""
  clientId: ""
  projectNumber: ""
  poolId: ""
  providerId: ""
  serviceAccountEmail: ""

commonEnv:
  # Host yang boleh dipakai file_url (presigned MinIO), dipisah koma; ".example.internal" = semua subdomain.
  # Kosong = hanya host yang resolve ke alamat publik, jadi MinIO di jaringan internal ditolak: isi sebelum deploy.
  FILE_URL_ALLOWED_HOSTS: ""
  # Endpoint -test untuk load test tim ML (orchestrator /v1/extract-ocr-test, /v1/<tahap>/jobs-test): pipeline
  # yang sama di tabel testing_*, tanpa callback dan tanpa menulis ke tabel Orkestrasi. Hanya untuk dev.
  TESTING_ENDPOINTS: "false"

# Tiap service = satu Deployment + satu ConfigMap + satu Service internal `<release>-<nama>`.
#   entrypoint : dipanggil dari luar release (Orkestrasi pusat). Terbuka lewat Service `<release>-orchestrator`
#                (bukan Service internal) dan NetworkPolicy-nya menerima namespace di
#                networkPolicy.clientNamespaces. Hanya orchestrator; yang lain internal.
#   pipeline   : tahap async yang butuh DATABASE_URL dan konfigurasi Orkestrasi.
#   database   : butuh DATABASE_URL tanpa konfigurasi Orkestrasi (orchestrator: tabel nilam_guardrails_results).
#   rollingUpdate: {maxSurge, maxUnavailable} saat rollout; default 1 / 0 (pod baru siap dulu, tanpa jeda).
#                Cluster yang tidak punya ruang untuk pod tambahan: 0 / 1 (pod lama dimatikan dulu).
#   upstreams  : service lain yang dipanggil; chart mengisi <NAMA>_SERVICE_URL dan NetworkPolicy dari sini.
# Nama service dipakai sebagai nama port Kubernetes: maksimal 15 karakter, huruf kecil/angka, tanpa `-`.
services:
  # Pintu masuk tunggal: POST /v1/extract-ocr (cek guardrails, hand-off ke extraction, tunggu pipeline)
  # dan GET /v1/extract-ocr/{request_id}. Tanpa callback; DB hanya untuk mencatat setiap putusan guardrails
  # (nilam_guardrails_results, migrasi 0008), best-effort: DB yang mati tidak menggagalkan request.
  orchestrator:
    enabled: true
    image:
      repository: ms-bribrain-nilam-ocr-npwp-orchestrator
      tag: ""
    port: 8034
    entrypoint: true
    pipeline: false
    database: true
    upstreams: [guardrails, extraction, structuring, scoring]
    replicaCount: 2
    # Queueing theory: tambah replika sebelum utilisasi melewati ~75% (waktu tunggu ~ rho / (1 - rho)). Target HPA
    # dihitung terhadap requests.cpu. Dev mematikannya di values-ddb-dev.yaml (cluster penuh).
    # Extraction sengaja tanpa HPA: replika tambahan hanya menambah panggilan ke VM model OCR, bottleneck sebenarnya.
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 75
    startupFailureThreshold: 15
    # Satu POST bisa memakan cek guardrails (GUARDRAILS_TIMEOUT_SECONDS) + tunggu pipeline + hand-off;
    # shutdown menunggu request yang sedang ditahan selesai.
    terminationGracePeriodSeconds: 60
    env:
      # Tunggu pipeline sampai selesai (200 + hasil) sebelum menjawab 202; 0 = tidak menunggu.
      PIPELINE_WAIT_SECONDS: "15"
      GUARDRAILS_TIMEOUT_SECONDS: "20"
      # Admission control: POST extract-ocr yang ditahan bersamaan per pod. Lebih dari ini dijawab 429
      # TOO_MANY_REQUESTS + Retry-After sebelum apa pun dikerjakan. 100 x dokumen NPWP (1-2 MB) masih jauh di bawah
      # limits.memory; 0 = tanpa batas. Orkestrasi pusat perlu mengirim ulang 429 setelah Retry-After.
      MAX_IN_FLIGHT_REQUESTS: "100"
      ADMISSION_RETRY_AFTER_SECONDS: "2"
      # Polling job tahap selama menunggu: 0.25 dtk lalu dua kali lipat sampai 2 dtk (default di kode).
    # Tiap request menahan dokumennya (maks. MAX_UPLOAD_BYTES, 10 MB) selama menunggu pipeline.
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

  # Model guardrails, internal: hanya orchestrator yang memanggil POST /v1/guardrails/check.
  guardrails:
    enabled: true
    image:
      repository: ms-bribrain-nilam-ocr-npwp-guardrails
      tag: ""
    port: 8031
    entrypoint: false
    pipeline: false
    # Mengunduh checkpoint dari GCS saat start kalau GUARDRAILS_MODEL_GCS_URI diisi (lihat gcpWif).
    gcsModels: true
    upstreams: []
    replicaCount: 1
    # Satu-satunya service CPU-bound (torch): HPA aktif (replicaCount diabaikan). Dev mematikannya di
    # values-ddb-dev.yaml karena cluster dev penuh.
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    startupFailureThreshold: 30
    terminationGracePeriodSeconds: 30
    env:
      GUARDRAILS_BACKEND: efficientnet
      GUARDRAILS_MODEL_PATH: weights/best_model.pt
      GUARDRAILS_DEVICE: cpu
      # Samakan dengan limits.cpu; tanpa ini torch membuat thread sebanyak core node.
      GUARDRAILS_TORCH_THREADS: "2"
      # Bulkhead inference per pod: 2 dokumen dinilai bersamaan (render PDF dan inference bergantian di 2 CPU),
      # 20 menunggu; lebih dari itu 503 SERVICE_BUSY + Retry-After, diteruskan orchestrator sebagai 503.
      GUARDRAILS_MAX_CONCURRENCY: "2"
      GUARDRAILS_MAX_QUEUE: "20"
      # Ambang reject dari Orkestrasi pusat; isi begitu endpoint-nya ada. Kosong = default 0.5 (checkpoint).
      # GUARDRAILS_THRESHOLD_URL: http://<orkestrasi-pusat>
      # GUARDRAILS_THRESHOLD_PATH: /v1/thresholds/guardrails
    resources:
      requests:
        cpu: "1"
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi

  extraction:
    enabled: true
    image:
      repository: ms-bribrain-nilam-ocr-npwp-extraction
      tag: ""
    port: 8030
    entrypoint: false
    pipeline: true
    upstreams: [structuring]
    replicaCount: 1
    startupFailureThreshold: 15
    # Env dari Secret, per service: [{name, secret (default existingSecret), key (default name), optional}].
    # Contoh: X-API-Key PaddleOCR dari Secret tim PaddleOCR (values-shared-dev.yaml).
    secretEnv: []
    env:
      EXTRACTION_BACKEND: paddle
      EXTRACTION_OCR_URL: ""
      # /ocr = API lama di VM 10.213.128.67:8070; /v1/ocr = service PP-OCRv6 di cluster shared.
      EXTRACTION_OCR_PATH: /ocr
      EXTRACTION_OCR_TIMEOUT_SECONDS: "60"
      PIPELINE_DRAIN_TIMEOUT_SECONDS: "30"
      # Proteksi beban (stress test 15 Okt 2026: VM model OCR kebanjiran ratusan panggilan sekaligus).
      # Panggilan ke model OCR bersamaan per pod; sisanya antre di sini, tidak ditumpuk ke VM.
      EXTRACTION_OCR_CONCURRENCY: "4"
      # Batas total satu panggilan (EXTRACTION_OCR_TIMEOUT_SECONDS berlaku per fase, jadi bisa 2x lipat).
      EXTRACTION_OCR_TOTAL_TIMEOUT_SECONDS: "60"
      # 5 gagal berturut-turut: berhenti memanggil model 30 dtk (job gagal cepat 503) supaya VM sempat pulih.
      EXTRACTION_OCR_BREAKER_FAILURES: "5"
      EXTRACTION_OCR_BREAKER_RESET_SECONDS: "30"
      # Bulkhead job: 8 jalan + 50 antre per pipeline; lebih dari itu submit dijawab 503 SERVICE_BUSY + Retry-After
      # sebelum job dicatat. Yang antre menahan dokumennya di memori (50 x 1-2 MB).
      PIPELINE_MAX_CONCURRENCY: "8"
      PIPELINE_MAX_QUEUE: "50"
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi

  structuring:
    enabled: true
    image:
      repository: ms-bribrain-nilam-ocr-npwp-structuring
      tag: ""
    port: 8032
    entrypoint: false
    pipeline: true
    upstreams: [scoring]
    replicaCount: 1
    startupFailureThreshold: 15
    env:
      STRUCTURING_BACKEND: npwp_rules
      PIPELINE_DRAIN_TIMEOUT_SECONDS: "30"
      # Bulkhead job (CPU-bound di threadpool); hand-off yang ditolak 503 dicoba lagi oleh outbox extraction.
      PIPELINE_MAX_CONCURRENCY: "8"
      PIPELINE_MAX_QUEUE: "100"
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi

  scoring:
    enabled: true
    image:
      repository: ms-bribrain-nilam-ocr-npwp-scoring
      tag: ""
    port: 8033
    entrypoint: false
    pipeline: true
    # Mengunduh trust model dari GCS saat start kalau SCORING_MODEL_GCS_URI diisi (lihat gcpWif).
    gcsModels: true
    upstreams: []
    replicaCount: 1
    startupFailureThreshold: 15
    env:
      PIPELINE_DRAIN_TIMEOUT_SECONDS: "30"
      # Bulkhead job (CPU-bound di threadpool); hand-off yang ditolak 503 dicoba lagi oleh outbox structuring.
      PIPELINE_MAX_CONCURRENCY: "8"
      PIPELINE_MAX_QUEUE: "100"
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi

service:
  type: ClusterIP
  annotations: {}
  # Service `<release>-orchestrator` yang membuka port semua service ber-entrypoint (hanya orchestrator, 8034).
  # Ini alamat yang dipublikasikan ke Orkestrasi pusat (integration.md). Service per komponen
  # (`<release>-<service>`) hanya untuk panggilan internal pipeline, jadi orchestrator tidak punya.
  entrypoint:
    enabled: true
    # Nama Service tambahan dengan isi yang sama, untuk pemanggil yang masih memakai alamat lama (mis. ddb-dev:
    # nilam-ocr-npwp, nama entry Service sebelum 20 Okt 2026). Kosong = hanya `<release>-orchestrator`.
    aliases: []
  # Service `<release>-public` bertipe LoadBalancer dengan port yang sama (orchestrator, 8034), untuk pemanggil
  # di luar cluster. Tanpa annotation: IP publik internet, HTTP tanpa TLS, dijaga X-API-Key saja. Untuk IP
  # internal VPC: annotations {networking.gke.io/load-balancer-type: Internal}. loadBalancerSourceRanges kosong =
  # semua alamat. externalTrafficPolicy Local menjaga IP asal pemanggil (log, NetworkPolicy ipBlock).
  public:
    enabled: false
    annotations: {}
    loadBalancerSourceRanges: []
    externalTrafficPolicy: Local

# Ingress default-deny untuk semua pod release; tiap service hanya menerima dari pemanggilnya
# (dihitung dari upstreams). Service ber-entrypoint menerima dari semua pod release, dari namespace di
# clientNamespaces (semua pod-nya), dan dari pod di namespace release yang cocok dengan salah satu label di
# clientPods (pemanggil yang satu namespace, tanpa membuka namespace itu untuk semua pod). Egress belum dibatasi.
# Cluster tanpa enforcement (GKE tanpa Dataplane V2 / Calico) mengabaikan policy ini diam-diam.
networkPolicy:
  enabled: true
  clientNamespaces: []
  # Contoh: - app.kubernetes.io/instance: ocr-backend
  clientPods: []

# maxUnavailable, bukan minAvailable: minAvailable 1 menahan upgrade node saat replika 1.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

serviceAccount:
  create: true
  name: ""
  # Workload Identity: iam.gke.io/gcp-service-account: <gsa>@<project>.iam.gserviceaccount.com
  annotations: {}

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
