# Dev di GKE shared: cluster gc-bigpool-dev-gke-cluster-01 (project shared-kubecluster-dev-01), namespace
# bribrain-ocr-nilam (sejak 21 Okt 2026; bersama service SPR, tanpa ResourceQuota/LimitRange). Sebelumnya di nilam,
# yang kuota memorinya sudah habis dipesan service KTP, PaddleOCR dan slipgaji.
# deploy.sh memakainya dengan DEPLOY_ENV=shared-dev (default). API server cluster ini privat: deploy.sh membuka
# tunnel lewat bastion gc-shared-dev-gce-bastion-01.
#
# Database: Cloud SQL gc-bribrain-dev-sql-ocrkpr-01 (10.213.193.3, database nilam), DATABASE_URL di Secret
# nilam-ocr-npwp-secrets. Status jaringan dari pod di cluster ini (20 Okt 2026): DB dan Nexus terjangkau;
# Elastic APM (10.213.128.39:8200) dan Logstash belum.
#
# OCR: sejak 22 Okt 2026 service PaddleOCR PP-OCRv6 milik tim PaddleOCR di namespace yang sama
# (ms-bribrain-nilam-ocr-paddle-ppocr-v6-service:80, POST /v1/ocr, GPU), kontrak response sama dengan /ocr di VM
# lama (10.213.128.67:8070, tidak terjangkau dari cluster ini). Wajib X-API-Key: diambil langsung dari Secret
# mereka (PADDLE_API_KEY), jadi tidak ada salinan key di Secret kita dan rotasi dari mereka langsung terbawa
# (setelah pod extraction di-restart).
#
# Model guardrails dan scoring ikut di dalam image (deploy.sh mengambilnya dari GCS saat build), jadi pod tidak
# butuh identitas GCP; gcpWif dan *_MODEL_GCS_URI tidak dipakai. (SA node gc-bribrain-dev-sac-gke-01 sudah bisa
# membaca gs://gc-bribrain-dev-gcs-ocrkprmod-01/nilam/ kalau nanti model diambil saat start.)

environment: production

# Nama objek seperti service tim lain di namespace nilam (ms-bribrain-nilam-ocr-ktp-*): Deployment, Service,
# ConfigMap, dll. bernama ms-bribrain-nilam-ocr-npwp-<service>. Release Helm dan label tetap nilam-ocr-npwp.
fullnameOverride: ms-bribrain-nilam-ocr-npwp

existingSecret: nilam-ocr-npwp-secrets

orchestration:
  # Orkestrasi pusat berjalan di cluster ddb (ocr-orchestration.ocr-dev.svc.cluster.local), nama itu tidak
  # ada di cluster ini. Isi url dengan alamat yang terjangkau dari cluster shared, lalu nyalakan callback.
  url: ""
  callbackPath: /v1/ocr-callback
  callbackFormat: result
  callbackEnabled: false

commonEnv:
  ORCHESTRATION_API_EVENTS_TABLE: ""
  PIPELINE_OUTBOX: "true"
  TESTING_ENDPOINTS: "true"

# APM mati (serverUrl kosong): server APM dev belum terjangkau dari cluster ini; agen yang terus timeout hanya
# membuang CPU. Isi lagi seperti values-ddb-dev.yaml begitu jaringannya dibuka.
apm:
  serverUrl: ""

# Belum ada client yang diizinkan. Kandidat Orkestrasi pusat di cluster ini: namespace nilam-ocr-orchestrator
# (Service ocr-orchestration, terlihat 20 Okt 2026); isi clientNamespaces + orchestration.url setelah dikonfirmasi.
networkPolicy:
  clientNamespaces: []

service:
  public:
    enabled: false

# HPA dimatikan dan tiap service 1 replika, seperti service tim lain di cluster ini; semua Service ClusterIP, tanpa
# LoadBalancer.
#
# Jatah per service dari tim: 250m CPU / 512Mi, request = limit (QoS Guaranteed: pod tidak pernah diusir lebih
# dulu saat node penuh). Lima service = 1,25 CPU / 2,5 Gi.
# maxSurge 0: rollout tidak memesan pod tambahan di atas jatah; service mati sebentar selama pod baru menyala.
# Pemakaian nyata di ddb (21 Okt 2026, idle): orchestrator ~150Mi, extraction ~95Mi, structuring ~120Mi,
# scoring ~145Mi, guardrails ~400Mi. Guardrails paling mepet: kena OOMKilled -> naikkan memorinya saja.
services:
  orchestrator:
    replicaCount: 1
    autoscaling:
      enabled: false
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 250m
        memory: 512Mi
    env:
      # Tiap request menahan dokumennya (maks. 10 MB) selama menunggu pipeline: 20 x 10 MB masih di bawah 512Mi.
      MAX_IN_FLIGHT_REQUESTS: "20"
  guardrails:
    autoscaling:
      enabled: false
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    # Memuat torch + model dengan 250m CPU lebih lambat: beri 180 dtk (90 x 2 dtk) sebelum pod dianggap gagal.
    startupFailureThreshold: 90
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 250m
        memory: 512Mi
    env:
      # Satu dokumen dinilai sekali waktu: dua render PDF + inference bersamaan tidak muat di 512Mi.
      GUARDRAILS_TORCH_THREADS: "1"
      GUARDRAILS_MAX_CONCURRENCY: "1"
      GUARDRAILS_MAX_QUEUE: "5"
  extraction:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 250m
        memory: 512Mi
    secretEnv:
      - name: EXTRACTION_OCR_API_KEY
        secret: ms-bribrain-nilam-ocr-paddle-ppocr-v6-secret
        key: PADDLE_API_KEY
    env:
      EXTRACTION_OCR_URL: http://ms-bribrain-nilam-ocr-paddle-ppocr-v6-service
      EXTRACTION_OCR_PATH: /v1/ocr
  structuring:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 250m
        memory: 512Mi
  scoring:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 250m
        memory: 512Mi
