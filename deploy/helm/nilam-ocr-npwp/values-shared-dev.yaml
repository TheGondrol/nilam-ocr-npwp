# Dev di GKE shared: cluster gc-bigpool-dev-gke-cluster-01 (project shared-kubecluster-dev-01), namespace
# bribrain-ocr-nilam (sejak 21 Okt 2026; bersama service SPR, tanpa ResourceQuota/LimitRange). Sebelumnya di nilam,
# yang kuota memorinya sudah habis dipesan service KTP, PaddleOCR dan slipgaji.
# deploy.sh memakainya dengan DEPLOY_ENV=shared-dev (default). API server cluster ini privat: deploy.sh membuka
# tunnel lewat bastion gc-shared-dev-gce-bastion-01.
#
# Database: Cloud SQL gc-bribrain-dev-sql-ocrkpr-01 (10.213.193.3, database nilam), DATABASE_URL di Secret
# nilam-ocr-npwp-secrets. Status jaringan dari pod di cluster ini (20 Okt 2026): DB dan Nexus terjangkau;
# Elastic APM di VM (10.213.128.39:8200) dan Logstash (10.213.128.12:5040) belum. APM memakai server di namespace ini,
# dan log aplikasi ikut dikirim ke server itu (apm.logSending di bawah): cluster ini tidak punya Filebeat, dan GKE
# hanya mengumpulkan log sistem.
#
# OCR: sejak 22 Okt 2026 service PaddleOCR PP-OCRv6 milik tim PaddleOCR di namespace yang sama
# (ms-bribrain-nilam-ocr-paddle-ppocr-v6-service:80, POST /v1/ocr, GPU), kontrak response sama dengan /ocr di VM
# lama (10.213.128.67:8070, tidak terjangkau dari cluster ini). Wajib X-API-Key: diambil langsung dari Secret
# mereka (PADDLE_API_KEY), jadi tidak ada salinan key di Secret kita dan rotasi dari mereka langsung terbawa
# (setelah pod extraction di-restart). Query doc_orientation=true&doc_unwarping=true&textline_orientation=false
# di-hardcode di kode (app/ml/paddle.py), bukan di sini.
#
# Model guardrails dan scoring ikut di dalam image (deploy.sh mengambilnya dari GCS saat build), jadi pod tidak
# butuh identitas GCP; gcpWif dan *_MODEL_GCS_URI tidak dipakai. (SA node gc-bribrain-dev-sac-gke-01 sudah bisa
# membaca gs://gc-bribrain-dev-gcs-ocrkprmod-01/nilam/ kalau nanti model diambil saat start.)

environment: production

# Nama objek seperti service tim lain di namespace nilam (ms-bribrain-nilam-ocr-ktp-*): Deployment, Service,
# ConfigMap, dll. bernama ms-bribrain-nilam-ocr-npwp-<service>. Release Helm dan label tetap nilam-ocr-npwp.
fullnameOverride: ms-bribrain-nilam-ocr-npwp

existingSecret: nilam-ocr-npwp-secrets

orchestration:
  # Orkestrasi pusat di namespace yang sama (release ocr-backend, Service ms-bribrain-nilam-ocr-orchestrator:80),
  # diminta 23 Okt 2026. Callback hasil (result) dengan X-Callback-Key dari secretKeys.callbackKey.
  url: http://ms-bribrain-nilam-ocr-orchestrator.bribrain-ocr-nilam.svc.cluster.local
  callbackPath: /v1/ocr-callback
  callbackFormat: result
  callbackEnabled: true

commonEnv:
  ORCHESTRATION_API_EVENTS_TABLE: ""
  PIPELINE_OUTBOX: "true"
  TESTING_ENDPOINTS: "true"

# Elastic APM di namespace yang sama (repo elastics-vm, release elastic-apm: ES + Kibana + APM Server 9.2.0), karena
# server APM di VM (10.213.128.39:8200) tidak terjangkau dari cluster ini. Secret token = APM_SECRET_TOKEN di
# elastics-vm, disalin ke Secret nilam-ocr-npwp-secrets (ELASTIC_APM_SECRET_TOKEN); tanpa itu server menolak (401).
# Satu service name per service, sama dengan nama Deployment-nya: ms-bribrain-nilam-ocr-npwp-<service> (26 Okt 2026,
# beda dengan ddb-dev): tiap service punya halaman sendiri di Kibana APM dan Service Map menggambar alurnya; per
# dokumen dilihat lewat Service group `service.name : ms-bribrain-nilam-ocr-npwp-*`. environment diisi eksplisit:
# `environment` di atas bernilai production.
apm:
  serverUrl: http://ms-bribrain-nilam-elastic-apm-server.bribrain-ocr-nilam.svc.cluster.local:8200
  # Eksplisit kosong: deploy.sh memakai --reset-then-reuse-values, jadi tanpa baris ini serviceName lama
  # (nilam-ocr-npwp) dari release sebelumnya terbawa dan mengalahkan prefix.
  serviceName: ""
  serviceNamePrefix: ms-bribrain-nilam-ocr-npwp
  environment: dev
  sanitizeFieldNames: password,passwd,pwd,secret,key,*token,session,credit,card,auth,principal,set-cookie,signature,credential
  # Log aplikasi ke Elasticsearch lewat server APM ini (OTLP), seperti Orkestrasi pusat (29 Okt 2026); dilihat di
  # Kibana: halaman service APM tab Logs, atau Discover logs-apm.app.ms_bribrain_nilam_ocr_npwp_*.
  logSending: true

# Orkestrasi pusat (release Helm ocr-backend, pod ms-bribrain-nilam-ocr-orchestrator-api dan -worker) berjalan di
# namespace yang sama, jadi diizinkan per label pod, bukan per namespace: clientNamespaces [bribrain-ocr-nilam]
# akan membuka orchestrator NPWP untuk semua pod tim lain di namespace ini. Diminta tim Orkestrasi 23 Okt 2026.
# orchestration.url (callback) masih kosong: itu arah sebaliknya, dari kita ke mereka.
networkPolicy:
  clientNamespaces: []
  clientPods:
    - app.kubernetes.io/instance: ocr-backend

service:
  public:
    enabled: false

# HPA dimatikan dan tiap service 1 replika, seperti service tim lain di cluster ini; semua Service ClusterIP, tanpa
# LoadBalancer.
#
# Jatah per service dari tim: 250m CPU / 512Mi, request = limit (QoS Guaranteed: pod tidak pernah diusir lebih
# dulu saat node penuh). Lima service = 1,25 CPU / 2,5 Gi.
# maxSurge 0: rollout tidak memesan pod tambahan di atas jatah; service mati sebentar selama pod baru menyala.
# Pemakaian nyata di ddb (21 Okt 2026, idle): orchestrator ~150Mi, extraction ~95Mi, structuring ~120Mi,
# scoring ~145Mi, guardrails ~400Mi. Guardrails paling mepet: kena OOMKilled -> naikkan memorinya saja.
services:
  orchestrator:
    replicaCount: 1
    autoscaling:
      enabled: false
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 250m
        memory: 512Mi
    env:
      # Tiap request menahan dokumennya (maks. 10 MB) selama menunggu pipeline: 20 x 10 MB masih di bawah 512Mi.
      MAX_IN_FLIGHT_REQUESTS: "20"
  guardrails:
    autoscaling:
      enabled: false
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    # Memuat torch + model dengan 250m CPU lebih lambat: beri 180 dtk (90 x 2 dtk) sebelum pod dianggap gagal.
    startupFailureThreshold: 90
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 250m
        memory: 512Mi
    env:
      # Satu dokumen dinilai sekali waktu: dua render PDF + inference bersamaan tidak muat di 512Mi.
      GUARDRAILS_TORCH_THREADS: "1"
      GUARDRAILS_MAX_CONCURRENCY: "1"
      GUARDRAILS_MAX_QUEUE: "5"
  extraction:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 250m
        memory: 512Mi
    secretEnv:
      - name: EXTRACTION_OCR_API_KEY
        secret: ms-bribrain-nilam-ocr-paddle-ppocr-v6-secret
        key: PADDLE_API_KEY
    env:
      EXTRACTION_OCR_URL: http://ms-bribrain-nilam-ocr-paddle-ppocr-v6-service
      EXTRACTION_OCR_PATH: /v1/ocr
  structuring:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 250m
        memory: 512Mi
  scoring:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 250m
        memory: 512Mi
