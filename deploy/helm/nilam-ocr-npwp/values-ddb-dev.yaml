environment: production

image:
  # Tag global terakhir yang di-deploy manual sebelum ada lock file dan larangan build dari
  # working tree kotor. deploy.sh menimpanya per service dengan SHA commit bersih
  # (services.<nama>.image.tag); ganti nilai ini ke SHA yang sama setelah deploy `all` berikutnya.
  tag: 4d02eba-dirty

existingSecret: nilam-ocr-npwp-secrets

orchestration:
  # Callback hasil ke Orkestrasi (endpoint dari tim Orkestrasi, 24 Sep 2026): satu POST per request
  # saat selesai, dengan X-Callback-Key = ORCHESTRATION_CALLBACK_KEY di Secret nilam-ocr-npwp-secrets.
  # Key itu WAJIB ada di Secret sebelum deploy: tanpa key, extraction/structuring/scoring menolak start.
  url: http://ocr-orchestration.ocr-dev.svc.cluster.local
  callbackPath: /v1/ocr-callback
  callbackFormat: result

commonEnv:
  # Double write ke log API Orkestrasi dimatikan (5 Okt 2026): di mode callback Orkestrasi membaca hasil
  # dari tabel job-nya sendiri, dan tabel lama ocr.orchestration_api_events sudah dihapus oleh migrasi
  # mereka. Tulisan itu ada di transaksi job kita, jadi tabel yang hilang menggagalkan setiap job.
  # Kosong, bukan dihapus: deploy.sh memakai --reset-then-reuse-values, jadi key yang dihapus tetap
  # terbawa dari release sebelumnya.
  ORCHESTRATION_API_EVENTS_TABLE: ""
  # Outbox transaksional: hand-off dan callback ditulis ke pipeline_outbox bersama hasil job, lalu dikirim
  # relay dengan backoff (sampai 5 menit sekali, selama 24 jam), jadi tidak hilang saat pod restart atau
  # penerima down. Dinyalakan di cluster 24 Sep 2026.
  PIPELINE_OUTBOX: "true"
  # Load test tim ML lewat kubectl port-forward ke orchestrator, /v1/extract-ocr-test. Butuh migrasi 0006
  # (tabel testing_*). Lihat README, "Endpoint testing".
  TESTING_ENDPOINTS: "true"

# Pindah ke Cloud SQL dengan login IAM (deploy/helm/README.md, "Pindah ke Cloud SQL"): buka komentar ini
# setelah tim platform memberi roles/iam.workloadIdentityUser di GSA ini untuk
# serviceAccount:ddb-kubecluster-dev-01.svc.id.goog[nilam-ocr-npwp/nilam-ocr-npwp]. Tidak perlu untuk login
# dengan user/password Cloud SQL biasa.
# serviceAccount:
#   annotations:
#     iam.gke.io/gcp-service-account: gc-bribrain-dev-sac-sql-01@common-sec-dev-01.iam.gserviceaccount.com

# Model guardrails dan scoring dari GCS (bucket gc-bribrain-dev-gcs-ocr-nilam-01, folder nilam-ocr-npwp; diunggah
# 6 Okt 2026 dengan scripts/upload_model.py; model baru menimpa objeknya, pod mengambilnya saat restart). Buka
# komentar ini, juga GUARDRAILS_/SCORING_MODEL_GCS_URI di
# services di bawah, setelah: (1) Secret punya AZURE_CLIENT_SECRET dari wif.gcs.env; (2) pod terbukti bisa
# menjangkau login.microsoftonline.com dan *.googleapis.com (deploy/helm/README.md, "Model dari GCS").
# gcpWif:
#   tenantId: 76795979-244b-45d7-b043-ae27e60f46ee
#   clientId: 85add4a1-bd8e-48b1-9d72-658159f734a5
#   projectNumber: "849229018263"
#   poolId: gc-entra-dev-idp-oidc-01
#   providerId: entra-bri-pool-dev
#   serviceAccountEmail: gc-bribrain-dev-sac-gcs-01@common-sec-dev-01.iam.gserviceaccount.com

networkPolicy:
  # Namespace Orkestrasi di cluster dev. Cluster ini memakai LEGACY_DATAPATH tanpa
  # network policy enforcement, jadi policy hanya terpasang, belum ditegakkan.
  clientNamespaces: [ocr-dev]

services:
  extraction:
    env:
      EXTRACTION_OCR_URL: http://10.213.128.67:8070
  guardrails:
    # env:
    #   GUARDRAILS_MODEL_GCS_URI: gs://gc-bribrain-dev-gcs-ocr-nilam-01/nilam-ocr-npwp/guardrails/best_model.pt
    # Cluster dev penuh (node pool di ukuran maksimum, 29 Sep 2026): pod guardrails kedua (1 CPU, 1 Gi) saat
    # surge tidak pernah dapat node, jadi helm --wait menunggu sampai timeout. Pod lama dimatikan dulu dan
    # penggantinya memakai slotnya; guardrails tidak tersedia selama pod baru menyala (~30-60 dtk).
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    # Request CPU 500m, bukan 1 (2 Okt 2026): tidak ada node dengan 1 CPU request kosong lagi (yang tersisa
    # ~500-600m per node), jadi pod pengganti tidak pernah dijadwalkan dan helm --wait gagal walau pod lama
    # sudah dimatikan. Limit tetap 2 CPU; request hanya menentukan penjadwalan.
    resources:
      requests:
        cpu: 500m
  # scoring:
  #   env:
  #     SCORING_MODEL_GCS_URI: gs://gc-bribrain-dev-gcs-ocr-nilam-01/nilam-ocr-npwp/scoring/trust_model.joblib

# Node l5uf di cluster dev rusak tetapi tetap Ready dan menerima pod (29 Sep 2026): sandbox pod baru tidak
# pernah dibuat (FailedCreatePodSandBox DeadlineExceeded) dan pod tim lain macet Terminating di sana. Pod
# scoring dan structuring yang dijadwalkan ke node itu tidak pernah menyala, jadi helm --wait menunggu sampai
# dibatalkan. Node itu milik cluster bersama, jadi pod kita saja yang menghindarinya. Hapus blok ini setelah
# node diganti.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values: [gke-gc-ddb-dev-gke-c-gc-dgv-dev-ndp-c-42b3b8a0-l5uf]
