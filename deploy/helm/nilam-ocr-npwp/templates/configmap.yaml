{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nilam-ocr-npwp.componentName" (dict "root" $ "name" $name) }}
  labels:
    {{- include "nilam-ocr-npwp.componentLabels" (dict "root" $ "name" $name "svc" $svc) | nindent 4 }}
data:
  {{- include "nilam-ocr-npwp.serviceEnv" (dict "root" $ "svc" $svc) | indent 2 }}
{{- end }}
{{- end }}
