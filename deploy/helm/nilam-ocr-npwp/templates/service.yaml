{{- /* Satu Service internal per komponen, untuk panggilan antar service (upstreams). Komponen ber-entrypoint
       (orchestrator) tidak dipanggil service lain, jadi hanya terbuka lewat Service `<release>-orchestrator` di bawah. */}}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled (not $svc.entrypoint) }}
{{- $component := dict "root" $ "name" $name "svc" $svc }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nilam-ocr-npwp.componentName" $component }}
  labels:
    {{- include "nilam-ocr-npwp.componentLabels" $component | nindent 4 }}
  {{- with $.Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $.Values.service.type }}
  selector:
    {{- include "nilam-ocr-npwp.componentSelectorLabels" $component | nindent 4 }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: {{ $name }}
{{- end }}
{{- end }}
{{- if .Values.service.entrypoint.enabled }}
{{- range $serviceName := prepend (.Values.service.entrypoint.aliases | default list) (printf "%s-orchestrator" (include "nilam-ocr-npwp.fullname" $)) }}
---
# Pintu masuk: alamat dalam cluster yang dipublikasikan ke Orkestrasi pusat (integration.md), satu nama untuk semua
# service ber-entrypoint, plus nama lama di service.entrypoint.aliases. Selector-nya mencakup semua pod release;
# tiap port hanya sampai ke pod yang punya port bernama itu, karena Kubernetes melewatkan pod tanpa nama port tersebut.
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}
  labels:
    {{- include "nilam-ocr-npwp.labels" $ | nindent 4 }}
    app.kubernetes.io/component: entrypoint
  {{- with $.Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $.Values.service.type }}
  selector:
    {{- include "nilam-ocr-npwp.selectorLabels" $ | nindent 4 }}
  ports:
    {{- range $name, $svc := $.Values.services }}
    {{- if and $svc.enabled $svc.entrypoint }}
    - name: {{ $name }}
      port: {{ $svc.port }}
      targetPort: {{ $name }}
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- if .Values.service.public.enabled }}
---
# Pintu masuk yang sama dengan IP load balancer GCP, untuk pemanggil di luar cluster. Terpisah dari Service
# `<release>-orchestrator` supaya alamat dalam cluster yang dipakai Orkestrasi pusat tidak berubah.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nilam-ocr-npwp.fullname" . }}-public
  labels:
    {{- include "nilam-ocr-npwp.labels" . | nindent 4 }}
    app.kubernetes.io/component: public
  {{- with .Values.service.public.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: {{ .Values.service.public.externalTrafficPolicy }}
  {{- with .Values.service.public.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    {{- include "nilam-ocr-npwp.selectorLabels" . | nindent 4 }}
  ports:
    {{- range $name, $svc := .Values.services }}
    {{- if and $svc.enabled $svc.entrypoint }}
    - name: {{ $name }}
      port: {{ $svc.port }}
      targetPort: {{ $name }}
    {{- end }}
    {{- end }}
{{- end }}
