{{- if .Values.externalSecret.enabled }}
---
apiVersion: {{ .Values.externalSecret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ .Values.existingSecret }}
  labels:
    {{- include "nilam-ocr-npwp.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.existingSecret }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.secretKeys.apiKey }}
      remoteRef:
        key: {{ .Values.externalSecret.remoteKeys.apiKey }}
    - secretKey: {{ .Values.secretKeys.databaseUrl }}
      remoteRef:
        key: {{ .Values.externalSecret.remoteKeys.databaseUrl }}
    - secretKey: {{ .Values.secretKeys.orchestrationApiKey }}
      remoteRef:
        key: {{ .Values.externalSecret.remoteKeys.orchestrationApiKey }}
{{- end }}
