# YOLO Detection Service Configuration

# Model Configuration
model:
  # Path to the trained YOLO model file
  path: ./src/models/ktp_detection_model.pt
  openvino_path: ./src/models/best_openvino_model
  # Export format: 'pt' (PyTorch), 'openvino' (optimized for CPU)
  # Use 'openvino' for 2-3x faster CPU inference
  export_format: openvino
  # Confidence threshold for detections
  confidence: 0.5
  # IOU threshold for NMS
  iou_threshold: 0.45

# Image Upload Configuration
image:
  # Maximum allowed image upload size in megabytes
  max_size_mb: 1

# Class Configuration
classes:
  # Class names mapping (index: name)
  names:
    0: "ktp"
    1: "non-ktp"

# Performance Configuration (CPU Optimization)
performance:
  # Override detected CPU count (optional, leave commented for auto-detection)
  # Useful for testing or when cgroup detection fails
  # override_cpu_count: 4

  # ThreadPoolExecutor multiplier for I/O operations (image decoding)
  # Multiplier > 1 allows better overlap of I/O and CPU work
  thread_pool_multiplier: 1

  # Batch inference settings (experimental)
  # Batching improves CPU cache utilization and throughput
  enable_batching: false
  batch_max_size: 8
  batch_timeout_ms: 50

  # OpenVINO performance mode: 'latency' or 'throughput'
  # Use 'latency' for single-image requests
  # Use 'throughput' for concurrent requests (recommended for load)
  openvino_mode: latency

  # OpenVINO inference streams: AUTO or specific number
  # AUTO lets OpenVINO optimize based on CPU architecture
  openvino_streams: AUTO

# Server Configuration
server:
  # Host address to bind the server
  host: 0.0.0.0
  # Port number for the service
  port: 8000

# CORS Configuration
cors:
  # Allowed origins (use ["*"] to allow all)
  allow_origins:
    - "https://api-bribrain.dev.example.com"
    - "https://api-brispot.dev.example.com"
    - "https://api-brispot-testing.dev.example.com"
    - "https://api-brispot-staging.dev.example.com"
    - "https://api-staging.example.com"
  # Allow credentials (cookies, authorization headers)
  allow_credentials: true
  # Allowed HTTP methods (use ["*"] to allow all)
  allow_methods:
    - "POST"
    - "GET"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  # Allowed headers (use ["*"] to allow all)
  allow_headers:
    - "*"

# Logging Configuration
logging:
  log_to_database: true
  # Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: INFO
  # Log format
  format: "%(asctime)s - %(name)s - %(levelname)s - [%(request_id)s] - %(message)s"
  # File logging configuration
  file:
    enabled: true
    directory: ./logs
    filename: "ocr_ktp_detection.log"
    # Maximum file size in bytes (10MB)
    max_bytes: 10485760
    # Number of backup files to keep
    backup_count: 5

# Device Configuration
device:
  # Prefer GPU if available
  prefer_gpu: false
  # Force CPU mode (overrides prefer_gpu)
  force_cpu: true

database:
  pool_size: 5
  max_overflow: 10
  pool_pre_ping: true
  pool_recycle: 3600
  pool_timeout: 10
  connect_timeout: 5

gcs:
  bucket_name: "gc-bribrain-dev-gcs-iguru-01"
  prefix: "ocr_models/detection_models/"
  model_prefix: "ktp_detection_model"
  openvino_prefix: "ktp_detection_model_openvino_v"

minio:
  bucket: bribrain-webviewasset-dev
  object: ocr_ktp_models/ktp_detection_model.pt

# Elastic APM Configuration
elastic_apm:
  enabled: true
  server_url: "${ELASTIC_APM_SERVER_URL}"
  service_name: "${ELASTIC_APM_SERVICE_NAME:-ocr-ktp-detector}"
  environment: "${ELASTIC_APM_ENVIRONMENT:-dev}"
  secret_token: "${ELASTIC_APM_SECRET_TOKEN}"
  verify_server_cert: false

# Threshold provider — periodically refreshes thresholds from
# `ms-bribrain-manage-thservice` so model thresholds can be updated
# centrally without redeploying this service.
threshold_provider:
  refresh_interval_seconds: 3600   # how often to re-read from DB (seconds)
  table_name: "bribrain_model_thresholds"
  schema: "public"
  pool_size: 2
  max_overflow: 2
  pool_recycle: 3600
